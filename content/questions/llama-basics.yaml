# Вопросы курса к модулю 1 (GPT-2 → Llama): RMSNorm, SwiGLU, RoPE, GQA, KV-cache, блок Llama.
# Ответы написаны авторами курса. Квиз модуля C-Q1 собирает все вопросы этого файла.
- id: rmsnorm-vs-layernorm-01
  topic: normalization
  tasks: [C01-rmsnorm]
  difficulty: easy
  kind: open
  question: "Чем RMSNorm отличается от LayerNorm и почему от этого не страдает качество?"
  answer: >
    RMSNorm не вычитает среднее и не имеет сдвига β: вектор делится на корень из среднего
    квадрата и умножается на γ. Эксперименты авторов показали, что полезный эффект нормализации
    в основном даёт инвариантность к масштабу входа, а центрирование почти ничего не добавляет.
    Взамен — одна редукция вместо двух и меньше параметров, то есть слой чуть быстрее.
  source: course
- id: rmsnorm-eps-01
  topic: normalization
  tasks: [C01-rmsnorm, C01d-rmsnorm-debug]
  difficulty: medium
  kind: open
  question: "Где стоит eps в RMSNorm Llama и что сломается, если перенести его за корень?"
  answer: >
    Под корнем: x / sqrt(mean(x²) + eps). Вариант x / (sqrt(mean(x²)) + eps) тоже не делит на
    ноль, но даёт другие числа, когда mean(x²) сравним с eps (маленькие активации): там
    делитель отличается в разы. Модель, обученная с одной формулой, при загрузке в код с другой
    выдаёт расходящиеся активации, и разница копится по слоям.
  source: course
- id: rmsnorm-precision-01
  topic: normalization
  tasks: [C01-rmsnorm]
  difficulty: medium
  kind: open
  question: "Зачем RMSNorm в Llama считают в float32, если веса и активации в bf16/fp16?"
  answer: >
    Квадраты активаций легко выходят за диапазон fp16 (максимум ≈ 65 504, переполнение уже при
    |x| > 256), а в bf16 у суммы квадратов мало значащих бит, и среднее получается грубым.
    Поэтому вход приводят к float32, нормируют и возвращают в исходный dtype; на скорость это
    почти не влияет, а численно стабильнее.
  source: course
- id: swiglu-formula-01
  topic: ffn
  tasks: [C02-swiglu, C02d-swiglu-debug]
  difficulty: easy
  kind: open
  question: "Запишите SwiGLU-FFN Llama. Какие матрицы в нём есть и к какой ветке применяется SiLU?"
  answer: >
    FFN(x) = W_down · (SiLU(W_gate·x) ⊙ (W_up·x)). Три матрицы без bias: gate и up (C → F) и
    down (F → C). SiLU применяется только к ветке gate; ветка up остаётся линейной, а
    поэлементное произведение «открывает» и «закрывает» её каналы.
  source: course
- id: swiglu-hidden-01
  topic: ffn
  tasks: [C02-swiglu]
  difficulty: medium
  kind: open
  question: "Почему скрытый размер SwiGLU-FFN обычно ≈ 8/3·d, а не 4·d, как в GPT-2?"
  answer: >
    У SwiGLU три матрицы вместо двух. Чтобы число параметров (и FLOPs) совпало с классическим
    MLP 2·d·4d = 8d², скрытый размер F берут из 3·d·F = 8d², то есть F = 8d/3, и округляют до
    кратного удобного числа. У Llama 3 8B есть ещё множитель 1.3, поэтому F = 14 336 = 3.5·d.
  source: course
- id: rope-relative-01
  topic: positional-encoding
  tasks: [C03-rope, C03d-rope-debug]
  difficulty: medium
  kind: open
  question: "Почему с RoPE скалярное произведение q_m·k_n зависит только от m − n?"
  answer: >
    RoPE поворачивает каждую пару координат на угол, пропорциональный позиции: q_m = R(mθ)q,
    k_n = R(nθ)k. Повороты ортогональны и коммутируют, поэтому ⟨R(mθ)q, R(nθ)k⟩ =
    ⟨q, R((n−m)θ)k⟩ — абсолютные позиции сокращаются, остаётся только разность. Позиционная
    информация попадает в attention, а модель не привязана к абсолютным номерам.
  source: course
- id: rope-where-01
  topic: positional-encoding
  tasks: [C03-rope]
  difficulty: easy
  kind: open
  question: "К каким тензорам применяется RoPE и почему не к V и не к эмбеддингам на входе?"
  answer: >
    Только к q и k внутри каждого слоя attention, после проекций и разбиения на головы. Позиция
    нужна лишь для оценок сходства q·k; значения v просто усредняются с весами, и поворачивать
    их незачем. Эмбеддинги на входе остаются без позиций — это и есть отличие от обучаемых
    абсолютных позиций GPT-2.
  source: course
- id: rope-theta-01
  topic: positional-encoding
  tasks: [C03-rope]
  difficulty: hard
  kind: open
  question: "Что задаёт параметр θ (rope_theta) и зачем Llama 3 увеличила его до 500 000?"
  answer: >
    Частоты пар равны θ^(−2i/D): первые пары вращаются быстро (различают соседние позиции),
    последние — очень медленно (кодируют дальние расстояния). Чем больше θ, тем медленнее самые
    медленные пары и тем больше расстояний модель может различить, прежде чем углы «обернутся».
    Это помогает работать с длинным контекстом; Llama 2 использовала 10 000, Llama 3 — 500 000.
  source: course
- id: gqa-what-01
  topic: attention
  tasks: [C04-gqa]
  difficulty: easy
  kind: open
  question: "Что такое GQA и как через него выражаются MHA и MQA?"
  answer: >
    Головы запросов делятся на H_kv групп, и все головы одной группы используют общую пару K/V.
    Формула attention при этом не меняется — меняется только, какую K/V-голову берёт голова
    запроса: голова h берёт голову h // (H / H_kv). При H_kv = H у каждой головы свои K и V —
    это обычный MHA; при H_kv = 1 все головы делят одну пару — это MQA. GQA — промежуточный
    вариант: кеш меньше в H / H_kv раз, а качество почти как у MHA.
  source: course
- id: gqa-groups-01
  topic: attention
  tasks: [C04-gqa, C04d-gqa-debug]
  difficulty: easy
  kind: mcq
  question: "H = 8 голов запросов, H_kv = 2 KV-головы. Какую KV-голову использует голова запроса 6?"
  options: ["0", "1", "3", "6"]
  correct: 1
  answer: >
    Размер группы r = 8 / 2 = 4: головы 0–3 используют KV-голову 0, головы 4–7 — KV-голову 1,
    так что 6 // 4 = 1. Ответ «0» получается при чередовании «по кругу» (6 mod 2) — это типичная
    ошибка, когда KV-головы размножают через .repeat вместо repeat_interleave.
  source: course
- id: gqa-cache-size-01
  topic: attention
  tasks: [C04-gqa]
  difficulty: medium
  kind: mcq
  question: >
    Llama 3 8B: 32 слоя, 32 головы запросов, 8 KV-голов, head_dim = 128, bf16. Сколько займёт
    KV-cache для одной последовательности длиной 8192 токена?
  options: ["256 МиБ", "1 ГиБ", "4 ГиБ", "16 ГиБ"]
  correct: 1
  answer: >
    2 (K и V) × 32 слоя × 8 KV-голов × 128 × 8192 токена × 2 байта = 2³⁰ байт = 1 ГиБ. Если бы
    это был MHA с 32 KV-головами, получилось бы 4 ГиБ: GQA с группами по 4 уменьшает кеш в 4 раза.
  source: course
- id: gqa-bandwidth-01
  topic: attention
  tasks: [C04-gqa]
  difficulty: hard
  kind: open
  question: "Почему GQA ускоряет генерацию, а не только экономит память, хотя FLOPs attention почти те же?"
  answer: >
    На шаге декодирования новый токен делает мало вычислений, но должен прочитать из памяти
    весь KV-cache всех слоёв (и все веса). Такой шаг упирается в пропускную способность памяти,
    а не в арифметику. GQA уменьшает объём кеша, который читается на каждом шаге, в H / H_kv раз,
    поэтому шаг становится быстрее; к тому же освободившаяся память позволяет держать больший
    batch или более длинный контекст.
  source: course
- id: kvcache-why-01
  topic: inference
  tasks: [C05-kv-cache]
  difficulty: easy
  kind: open
  question: "Почему ключи и значения прошлых токенов можно закешировать и не пересчитывать?"
  answer: >
    Из-за causal-маски представление токена t в каждом слое зависит только от токенов 0..t.
    Добавление новых токенов в конец не меняет ни скрытые состояния прошлых токенов, ни их k и v.
    Поэтому их можно посчитать один раз, а на каждом шаге считать q, k, v только для нового
    токена и делать attention его q по всем сохранённым k, v.
  source: course
- id: kvcache-no-q-01
  topic: inference
  tasks: [C05-kv-cache]
  difficulty: easy
  kind: mcq
  question: "Почему кешируют K и V, но не Q?"
  options:
    - "Q занимает больше памяти, чем K и V"
    - "q прошлых токенов больше не нужны: на шаге генерации используется только q нового токена"
    - "Q пересчитывается из K, поэтому хранить его незачем"
    - "Q кешируют, но в отдельном буфере"
  correct: 1
  answer: >
    Выход позиции t зависит от q_t и от k, v всех позиций ≤ t. Выходы прошлых позиций уже
    посчитаны и не меняются, так что их q больше не участвуют ни в одном вычислении. А k и v
    прошлых токенов нужны каждому новому запросу — их и храним.
  source: course
- id: kvcache-positions-01
  topic: inference
  tasks: [C05-kv-cache, C05d-kv-cache-debug]
  difficulty: medium
  kind: open
  question: >
    В кеше 7 токенов, пришёл 1 новый. Какую позицию нужно передать в RoPE и что сломается,
    если всегда считать позиции как arange(T)?
  answer: >
    Позицию 7: новые токены идут следом за кешем, start = длина кеша до обновления. С arange(T)
    каждый новый токен получит позицию 0, как будто он в начале текста. Prefill при этом верен,
    но на следующих шагах относительные расстояния между q нового токена и ключами из кеша
    искажаются, и генерация тихо расходится с полным прогоном.
  source: course
- id: kvcache-mask-01
  topic: inference
  tasks: [C05-kv-cache]
  difficulty: medium
  kind: open
  question: >
    В кеше 3 токена, пришли 2 новых (S = 5, T = 2). Какая нужна маска и что не так с
    F.scaled_dot_product_attention(q, k, v, is_causal=True) в этом случае?
  answer: >
    Маска [2, 5]: первый новый токен (позиция 3) видит ключи 0..3, второй (позиция 4) — 0..4,
    т. е. tril(ones(T, S), diagonal = S − T). Флаг is_causal=True строит треугольник от левого
    верхнего угла: первый новый токен видел бы только ключ 0, второй — ключи 0..1, и большая
    часть кеша оказалась бы закрыта. При T = S (без кеша) обе маски совпадают, поэтому ошибка
    проявляется только при работе с кешем.
  source: course
- id: kvcache-store-01
  topic: inference
  tasks: [C05-kv-cache]
  difficulty: medium
  kind: open
  question: "Что именно класть в KV-cache: k до или после RoPE, до или после repeat_kv?"
  answer: >
    После RoPE: позиция токена не меняется, поэтому поворот ключа делается один раз при записи,
    а не на каждом шаге для всего кеша. До repeat_kv: в кеше должно лежать H_kv голов, иначе он
    раздуется в H / H_kv раз и выигрыш GQA по памяти пропадёт; размножение делается «на лету»
    (а быстрые ядра вообще индексируют общую голову без копий).
  source: course
- id: kvcache-cost-01
  topic: inference
  tasks: [C05-kv-cache]
  difficulty: medium
  kind: open
  question: "Чем отличаются prefill и decode с точки зрения нагрузки на железо?"
  answer: >
    Prefill обрабатывает весь промпт одним проходом: много токенов, большие матричные умножения,
    упор в вычисления. Decode обрабатывает по одному токену на последовательность: вычислений на
    шаг мало, а прочитать нужно все веса и весь KV-cache, — упор в пропускную способность памяти.
    Поэтому для decode важны размер кеша (GQA, MQA, квантизация кеша) и batch, а для prefill —
    FLOPs.
  source: course
- id: llama-block-prenorm-01
  topic: architecture
  tasks: [C06-llama-block, C06d-llama-block-debug]
  difficulty: medium
  kind: open
  question: "Запишите блок Llama. Чем Pre-Norm отличается от Post-Norm и почему остаток нельзя брать от norm(x)?"
  answer: >
    x = x + Attn(RMSNorm₁(x)); x = x + SwiGLU(RMSNorm₂(x)). В Pre-Norm норма стоит на входе
    подслоя, а остаточный поток идёт по сети без изменений; в Post-Norm (оригинальный
    Transformer) норма применяется после сложения: x = Norm(x + f(x)). Если написать
    h = norm(x); x = h + f(h), остаточный поток нормируется в каждом блоке: блок с нулевыми
    подслоями перестаёт быть тождественным, градиент по остаточному пути не проходит «напрямую»,
    и обученные для Pre-Norm веса дают другую модель.
  source: course
- id: llama-block-diff-01
  topic: architecture
  tasks: [C06-llama-block]
  difficulty: easy
  kind: open
  question: "Перечислите, чем модель Llama 3 отличается от GPT-2."
  answer: >
    RMSNorm вместо LayerNorm; RoPE в каждом слое attention вместо обучаемых абсолютных позиций
    на входе; GQA вместо MHA; SwiGLU вместо GELU-MLP (скрытый размер ≈ 8/3·d вместо 4d); ни
    одного bias; у Llama 3 8B выходной слой не связан с эмбеддингами. Скелет тот же: decoder-only,
    Pre-Norm, остаточный поток, финальная норма перед выходным слоем.
  source: course
- id: llama-block-params-01
  topic: architecture
  tasks: [C06-llama-block]
  difficulty: medium
  kind: mcq
  question: "Какая часть Llama 3 8B содержит больше всего параметров?"
  options: ["attention (q, k, v, o)", "SwiGLU-FFN", "embed_tokens и lm_head", "RMSNorm"]
  correct: 1
  answer: >
    SwiGLU-FFN: 3 × 4096 × 14 336 ≈ 176 млн на слой, ≈ 5,6 млрд на 32 слоя — около 70 % модели.
    Attention с GQA — ≈ 42 млн на слой (≈ 17 %), эмбеддинги и выходной слой — ≈ 1,05 млрд (≈ 13 %),
    нормы — доли процента.
  source: course
- id: llama-block-tie-01
  topic: architecture
  tasks: [C06-llama-block]
  difficulty: medium
  kind: open
  question: "Что такое weight tying и почему у Llama 3.2 1B он есть, а у Llama 3 8B — нет?"
  answer: >
    Выходной слой использует ту же матрицу, что и эмбеддинги токенов (lm_head.weight =
    embed_tokens.weight). Это экономит vocab × d параметров. При словаре 128 256 у модели на
    1 млрд параметров эмбеддинги — около пятой части всех весов, и вторая такая же матрица была
    бы заметной тратой; у 8B-модели доля той же матрицы меньше, и отдельный выходной слой даёт
    модели больше свободы.
  source: course
