# Вопросы курса к блоку B, модуль 3 (DistilBERT и T5): дистилляция, относительный bias T5, слой T5, span corruption.
# Ответы написаны авторами курса. Квиз B-Q3 собирает весь файл.
- id: distill-why-soft-01
  topic: training
  tasks: [B12-distillation]
  difficulty: easy
  kind: open
  question: "Почему ученик, обученный на мягких метках учителя, обычно лучше ученика, обученного только на правильных ответах?"
  answer: >
    Правильный ответ говорит только, какой класс верен. Распределение учителя говорит ещё, какие неверные ответы
    похожи на верный и насколько: для «столица Франции — [MASK]» учитель даёт заметную вероятность «лиону» и почти
    нулевую «банану». Это сведения о сходстве классов, и ученик получает их на каждом примере и на каждом токене, а не
    только на размеченных позициях. Мягкие метки ещё и регуляризуют: у них меньше дисперсия градиента, чем у one-hot,
    поэтому ученик учится на меньшем числе примеров и меньше переобучается.
  source: course
- id: distill-temperature-01
  topic: training
  tasks: [B12-distillation]
  difficulty: medium
  kind: open
  question: "Зачем в дистилляции температура T > 1 и что будет при T → ∞?"
  answer: >
    При T = 1 уверенный учитель отдаёт почти всю массу одному классу, а малые вероятности (10⁻⁴ и меньше) почти не
    влияют на лосс. Деление логитов на T делает распределение площе, отношения вероятностей сжимаются до e^(Δv/T), и
    различия между «почти невероятными» ответами начинают учитываться. При T → ∞ softmax(v/T) ≈ (1 + v/T)/V, и
    градиент мягкой части становится пропорционален z − v (для логитов с нулевым средним): дистилляция превращается в
    подгонку логитов ученика к логитам учителя (MSE). Слишком большая T тащит в ученика и шум в очень маленьких
    логитах, поэтому на практике берут T от 2 до 5 (у DistilBERT — 2).
  source: course
- id: distill-t2-01
  topic: training
  tasks: [B12-distillation]
  difficulty: medium
  kind: mcq
  question: "Зачем мягкую часть лосса дистилляции умножают на T²?"
  options:
    - "чтобы KL была неотрицательной"
    - "градиент KL по логитам ученика масштабируется как 1/T², множитель возвращает его к масштабу жёсткой части"
    - "чтобы учитель тоже получал градиент"
    - "так KL превращается в cross-entropy"
  correct: 1
  answer: >
    Градиент KL(p_T ‖ q_T) по логитам ученика равен (q − p)/T, а при больших T сама разность q − p порядка (z − v)/(TV),
    то есть вместе ≈ 1/T². Без множителя при T = 4 мягкая часть стала бы в ~16 раз слабее, и вес α пришлось бы подбирать
    заново под каждую T. С T² градиент T·(q − p) почти не зависит от температуры. KL неотрицательна и без множителя.
  source: course
- id: distill-kl-direction-01
  topic: training
  tasks: [B12-distillation]
  difficulty: medium
  kind: code-reading
  question: >
    В коде дистилляции написано loss = F.kl_div(F.log_softmax(t / T, -1), F.softmax(s / T, -1), reduction="mean") * T**2,
    где s — логиты ученика, t — учителя. Какие здесь ошибки?
  answer: >
    Две. Первая — перепутаны аргументы: F.kl_div(input, target) ждёт первым логарифм распределения модели, которую
    обучают (ученика), а вторым — цель (учителя), и считает KL(target ‖ input). Здесь получилась KL(ученик ‖ учитель):
    другой лосс (ученик штрафуется за массу там, где у учителя её нет, и легко «схлопывается» на один ответ), к тому же
    градиент идёт в учителя, если его логиты не отсоединены. Вторая — reduction="mean" делит сумму на N·V, а не на N:
    лосс в V раз меньше нужного. Правильно: F.kl_div(F.log_softmax(s / T, -1), F.softmax(t / T, -1),
    reduction="batchmean") * T**2.
  source: course
- id: distill-distilbert-recipe-01
  topic: training
  tasks: [B12-distillation]
  difficulty: medium
  kind: open
  question: "Как устроен DistilBERT: архитектура ученика, инициализация и лосс?"
  answer: >
    Ученик — тот же BERT, но 6 слоёв вместо 12 при той же ширине 768 и 12 головах; эмбеддинги типов сегментов и pooler
    убраны. Инициализация — из учителя: эмбеддинги и слои через один (в скрипте Hugging Face — слои 0, 2, 4, 7, 9, 11).
    Лосс — сумма трёх: дистилляционный T²·KL с T = 2 по всем токенам, обычный MLM по закрытым токенам и 1 − cos между
    последними скрытыми состояниями ученика и учителя; веса 5 : 2 : 1. Обучение на тех же данных, что BERT, с
    динамической маской и без NSP. Результат: 66 М параметров против 110 М, на 60 % быстрее, 97 % качества BERT на GLUE.
  source: course
- id: distill-cosine-width-01
  topic: training
  tasks: [B12-distillation]
  difficulty: hard
  kind: open
  question: "Почему cosine-loss скрытых состояний в DistilBERT работает «из коробки» и что делать, если ученик уже учителя?"
  answer: >
    У DistilBERT ширина ученика та же, 768, поэтому скрытые состояния лежат в пространствах одной размерности, а
    инициализация из слоёв учителя делает их ещё и согласованными по базису: косинус сравнивает похожие вещи. Если
    ученик уже (TinyBERT, MiniLM), нужна обучаемая проекция W, переводящая состояния ученика в размерность учителя (или
    наоборот), и лосс берут на W·h_S. Другой путь — переносить не сами состояния, а то, что от базиса не зависит:
    распределения внимания или матрицы сходства токенов (так делает MiniLM). Косинус, а не MSE, выбран потому, что
    направление важнее длины вектора, а нормы у слоёв разные.
  source: course
- id: t5-bias-why-01
  topic: positional-encoding
  tasks: [B13-t5-relative-bias]
  difficulty: medium
  kind: open
  question: "Как T5 кодирует позиции и чем это отличается от синусоид исходного Transformer?"
  answer: >
    Ко входу T5 ничего не прибавляет. Вместо этого в каждой голове к scores attention прибавляется обучаемое число
    B[bucket(j − i), h], зависящее только от сдвига ключа относительно запроса. Сдвиги собраны в 32 бакета: близкие
    различаются точно, дальние — логарифмическими корзинами до 128, всё дальнее — в одном бакете. Таблица 32 × H есть
    только у первого слоя стека, остальные слои используют тот же bias. Отличия от синусоид: позиция влияет на score
    напрямую, а не через смесь с содержанием токена; важен только сдвиг (инвариантность к переносу); таблица
    обучается; и нет ограничения на длину входа таблицей позиций, хотя за пределами обучающей длины модель всё равно
    видит только «последний бакет».
  source: course
- id: t5-bias-buckets-01
  topic: positional-encoding
  tasks: [B13-t5-relative-bias, B13d-t5-bias-debug]
  difficulty: medium
  kind: mcq
  question: "В энкодере T5 (32 бакета, max_distance = 128) в какие бакеты попадут сдвиги key − query = −3, +3 и −500?"
  options:
    - "3, 3 и 31"
    - "3, 19 и 15"
    - "13, 19 и 0"
    - "3, 19 и 31"
  correct: 1
  answer: >
    В двунаправленном режиме бакеты делятся пополам: 0 … 15 — ключи слева и на месте, 16 … 31 — справа. Внутри половины
    первые 8 расстояний точные: −3 → 3, +3 → 16 + 3 = 19. Дальние сдвиги слева сливаются в последний бакет первой
    половины — 15 (31 — последний бакет для ключей справа).
  source: course
- id: t5-bias-causal-01
  topic: positional-encoding
  tasks: [B13-t5-relative-bias, B13d-t5-bias-debug]
  difficulty: medium
  kind: open
  question: "Почему в декодере T5 бакеты относительных позиций устроены иначе, чем в энкодере?"
  answer: >
    В декодере causal-маска закрывает все ключи справа, поэтому тратить на них половину бакетов бессмысленно. В режиме
    bidirectional=False расстояние считается как max(−(j − i), 0): у будущих ключей оно 0 (их всё равно закроет маска),
    а все 32 бакета отданы прошлому — точных расстояний вдвое больше (0 … 15), логарифмические корзины уже. Если
    перепутать знак сдвига (запрос минус ключ), то в декодере все прошлые ключи получат расстояние 0 и один бакет: модель
    перестанет различать порядок слов в цели.
  source: course
- id: t5-layer-diff-01
  topic: architecture
  tasks: [B14-t5-layer]
  difficulty: medium
  kind: open
  question: "Чем слой T5 отличается от слоя исходного Transformer (Vaswani et al., 2017)?"
  answer: >
    Нормы перед подслоями (Pre-LN) и ещё одна в конце стека, вместо Post-LN. Норма — RMSNorm без вычитания среднего и
    без bias (T5LayerNorm). Ни у одного линейного слоя нет bias. Позиционных эмбеддингов на входе нет — только
    относительный bias в scores. Scores без деления на √d_k: масштаб заложен в инициализацию весов запроса. Одна
    матрица эмбеддингов на энкодер, декодер и голову, перед головой выход умножается на d_model^(−1/2). FFN —
    ReLU, d_ff = 4·d_model у t5-small/base; в T5 v1.1 — GeGLU и несвязанная голова.
  source: course
- id: t5-layer-no-scale-01
  topic: attention
  tasks: [B14-t5-layer]
  difficulty: hard
  kind: open
  question: "Почему в T5 attention без деления на √d_k и что будет, если загрузить веса T5 в attention с делением?"
  answer: >
    Деление на √d_k нужно, чтобы дисперсия q·k не росла с размерностью головы и softmax не насыщался. T5 добивается
    того же инициализацией: веса запроса начинают с дисперсией 1/(d_model·d_kv) вместо 1/d_model, то есть запрос с
    самого начала в √d_kv раз короче. После обучения веса рассчитаны именно на scores без деления. Если поделить на
    √64 = 8, все scores сожмутся в 8 раз, а относительный bias — нет (если делить только q·k) или тоже (если делить
    сумму): распределения внимания станут намного площе, и предобученная модель даст мусор, хотя код «по учебнику».
  source: course
- id: t5-layer-bias-shared-01
  topic: positional-encoding
  tasks: [B14-t5-layer]
  difficulty: easy
  kind: mcq
  question: "Где в T5 хранится таблица относительного позиционного bias?"
  options:
    - "в каждом слое attention своя"
    - "одна в первом слое self-attention энкодера и одна в первом слое self-attention декодера; остальные слои берут их bias"
    - "одна на всю модель, общая для энкодера и декодера"
    - "в cross-attention каждого слоя декодера"
  correct: 1
  answer: >
    У T5Attention флаг has_relative_attention_bias стоит только у блока 0 каждого стека. Блок 0 считает position_bias
    [1, H, T, S] и возвращает его, а T5Stack передаёт его следующим блокам. У энкодера bias двунаправленный, у
    декодера — causal, поэтому таблиц две. В cross-attention позиционного bias нет совсем: позиции источника и цели
    несравнимы.
  source: course
- id: t5-span-vs-mlm-01
  topic: training
  tasks: [B15-span-corruption, B15d-sentinel-debug]
  difficulty: medium
  kind: open
  question: "Чем span corruption T5 отличается от MLM BERT и почему T5 выбрала его?"
  answer: >
    MLM закрывает отдельные токены, ставит [MASK] на месте каждого и предсказывает их на тех же позициях энкодером.
    Span corruption вырезает спаны (в среднем по 3 токена, всего 15 %), заменяет каждый спан одним sentinel-токеном,
    а декодер генерирует цель: sentinel, вырезанный кусок, следующий sentinel… Вход короче исходного текста, цель — около
    15 % его длины плюс sentinel-ы, поэтому шаг обучения дешевле, чем у целей, восстанавливающих весь текст. В
    сравнении статьи T5 почти все цели «восстанови испорченный текст» дали похожее качество, и авторы выбрали вариант
    с короткой целью ради скорости; спаны (а не отдельные токены) ещё сильнее укорачивают вход. Ещё плюс: модель учится
    генерировать несколько токенов подряд, что ближе к задачам «текст → текст».
  source: course
- id: t5-span-lengths-01
  topic: training
  tasks: [B15-span-corruption]
  difficulty: medium
  kind: mcq
  question: "Текст из 568 токенов, шум 15 %, средняя длина спана 3. Какой длины будет вход T5 (с EOS)?"
  options:
    - "568"
    - "483"
    - "512"
    - "540"
  correct: 2
  answer: >
    Токенов шума round(0.15 · 568) = 85, спанов round(85 / 3) = 28. Каждый спан шума заменяется одним sentinel:
    568 − 85 + 28 = 511, плюс EOS — 512. Так T5 подбирает длину сырого куска текста под вход длины 512. Цель:
    85 токенов шума + 28 sentinel-ов перед ними + EOS = 114.
  source: course
- id: t5-span-sentinels-01
  topic: tokenization
  tasks: [B15-span-corruption, B15d-sentinel-debug]
  difficulty: easy
  kind: open
  question: "Что такое sentinel-токены T5 и как они связывают вход с целью?"
  answer: >
    Это 100 служебных токенов <extra_id_0> … <extra_id_99> в конце словаря SentencePiece (у t5-small <extra_id_0> = 32 099,
    дальше id убывают). Во входе каждый вырезанный спан заменён своим sentinel по порядку. В цели перед каждым
    вырезанным куском стоит тот же sentinel, что заменил его во входе, — так модель знает, какой пропуск она заполняет.
    Цель заканчивается ещё одним sentinel, если текст кончается не шумом, и EOS. Если сдвинуть нумерацию в цели хотя бы
    на один, модель выучит ставить кусок не после своего sentinel.
  source: course
- id: t5-text-to-text-01
  topic: architecture
  tasks: [B14-t5-layer, B-P3-distil-t5]
  difficulty: easy
  kind: open
  question: "Что значит «text-to-text» в T5 и как в этом формате решается классификация?"
  answer: >
    Любая задача записывается как преобразование текста в текст одной и той же моделью с одним лоссом (cross-entropy
    по токенам цели). Задача указывается префиксом во входе: «translate English to German: …», «summarize: …»,
    «cola sentence: …». Для классификации цель — слово-метка («acceptable», «entailment»), для регрессии STS-B — число
    строкой, округлённое до 0.2. Нет отдельных голов под задачи. Минус — если модель сгенерирует слово не из списка
    меток, ответ засчитывают как ошибку.
  source: course
