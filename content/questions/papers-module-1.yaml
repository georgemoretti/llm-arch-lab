# Вопросы на понимание статей модуля 1 (задание C-P1): RoFormer, MQA, GQA.
# Ответы — пересказ идей своими словами, без цитат из статей.
- id: paper-roformer-goal-01
  topic: positional-encoding
  tasks: [C-P1-roformer-gqa]
  difficulty: medium
  kind: open
  question: >
    RoFormer: какое свойство авторы требуют от позиционного кодирования q и k и как из него
    получается вращение?
  answer: >
    Хотят, чтобы скалярное произведение закодированных q (на позиции m) и k (на позиции n)
    зависело только от самих векторов и разности m − n. В двумерном случае такое преобразование
    находится явно: представить пару координат комплексным числом и умножить на e^{imθ} — это
    поворот на угол mθ, и при скалярном произведении остаётся только разность углов. Для D
    измерений вектор режут на D/2 пар, у каждой своя частота θ_i.
  source: course
- id: paper-roformer-decay-01
  topic: positional-encoding
  tasks: [C-P1-roformer-gqa]
  difficulty: hard
  kind: open
  question: "Что в RoFormer называют «long-term decay» и от чего оно зависит?"
  answer: >
    При частотах θ_i = 10000^{−2i/D} верхняя оценка вклада ⟨R_m q, R_n k⟩ в среднем убывает с
    ростом |m − n|: слагаемые от разных пар вращаются с разной скоростью и при больших
    расстояниях начинают взаимно гаситься. Это согласуется с интуицией, что далёкие токены в
    среднем связаны слабее. Скорость убывания определяется выбором частот, т. е. основанием θ.
  source: course
- id: paper-roformer-efficient-01
  topic: positional-encoding
  tasks: [C-P1-roformer-gqa]
  difficulty: easy
  kind: open
  question: "Почему RoPE не реализуют умножением на матрицу D × D?"
  answer: >
    Матрица поворота блочно-диагональная: D/2 независимых поворотов 2 × 2. Умножать на полную
    разреженную матрицу расточительно, поэтому поворот записывают поэлементно:
    x ⊙ cos + rotate_half(x) ⊙ sin (или с перестановкой соседних координат в интерливной
    раскладке) — O(D) операций на вектор вместо O(D²).
  source: course
- id: paper-mqa-bandwidth-01
  topic: attention
  tasks: [C-P1-roformer-gqa]
  difficulty: medium
  kind: open
  question: "MQA (Shazeer, 2019): какую проблему инкрементального декодирования решает статья и как?"
  answer: >
    При пошаговой генерации на каждом шаге приходится заново читать из памяти все прошлые ключи
    и значения всех голов, а вычислений на шаг мало, поэтому скорость ограничена пропускной
    способностью памяти, а не арифметикой. Если у всех голов одни K и V, объём этих данных
    уменьшается в число голов раз, и декодирование заметно ускоряется ценой небольшой потери
    качества.
  source: course
- id: paper-gqa-uptraining-01
  topic: attention
  tasks: [C-P1-roformer-gqa]
  difficulty: medium
  kind: open
  question: "GQA: что такое uptraining и как из MHA-чекпойнта получают GQA-модель?"
  answer: >
    Не обучать GQA с нуля, а переделать готовую MHA-модель: K- и V-проекции голов внутри каждой
    группы усредняют (mean pooling) в одну голову, а затем дообучают модель на небольшой доле
    исходного объёма предобучения (в статье — порядка 5 %). Усреднение сохраняет информацию из
    всех голов группы и работает лучше, чем взять одну голову или инициализировать случайно.
  source: course
- id: paper-gqa-tradeoff-01
  topic: attention
  tasks: [C-P1-roformer-gqa]
  difficulty: medium
  kind: open
  question: "Какой компромисс показывает статья GQA и почему GQA выгоднее для больших моделей?"
  answer: >
    MQA быстрее всех, но теряет качество; MHA качественнее, но медленнее при декодировании.
    GQA с небольшим числом групп по качеству близок к MHA, а по скорости — к MQA. Для больших
    моделей число голов растёт, и MQA сжимает K/V слишком агрессивно (один K/V на десятки голов),
    а GQA сохраняет ту же долю сжатия: размер кеша уменьшается пропорционально, а не до одной головы.
  source: course
- id: paper-gqa-encoder-01
  topic: attention
  tasks: [C-P1-roformer-gqa]
  difficulty: hard
  kind: open
  question: "В экспериментах GQA на encoder-decoder модели группировку применяли не везде. Где нет и почему?"
  answer: >
    Не применяли к self-attention энкодера. Энкодер обрабатывает весь вход параллельно одним
    проходом, его скорость ограничена вычислениями, а не чтением кеша, так что сокращение K/V там
    почти ничего не даёт. Выигрыш GQA — в декодере, где на каждом шаге читаются накопленные K и V.
  source: course
