# Вопросы на понимание статей модуля 3 (задание C-P3): Switch Transformer, DeepSeekMoE, DeepSeek-V2, DeepSeek-V3.
# Ответы — пересказ идей своими словами, без цитат из статей.
- id: paper-switch-capacity-01
  topic: moe
  tasks: [C-P3-moe-deepseek]
  difficulty: medium
  kind: open
  question: "Что такое capacity factor в Switch Transformer и что происходит с токенами при переполнении эксперта?"
  answer: >
    Для эффективного распределённого вычисления у каждого эксперта фиксированный буфер:
    capacity = capacity_factor · (токенов в батче / число экспертов). Если эксперта выбрало больше
    токенов, лишние не обрабатываются экспертом — их представление проходит дальше только по
    остаточному соединению (token dropping). Больший capacity factor уменьшает потери токенов, но
    тратит память и вычисления на пустые слоты. Многие современные открытые MoE в инференсе работают
    без отбрасывания (dropless).
  source: course
- id: paper-switch-top1-01
  topic: moe
  tasks: [C-P3-moe-deepseek]
  difficulty: medium
  kind: open
  question: "Почему Switch Transformer выбирает одного эксперта на токен (top-1) и как при этом учится роутер?"
  answer: >
    Раньше считалось, что нужно минимум k = 2, чтобы роутер получал сравнительный сигнал. Авторы
    показали, что top-1 работает: вдвое меньше вычислений экспертов и коммуникации, меньший размер
    буферов, проще реализация. Роутер учится, потому что выход эксперта умножается на вероятность
    роутера для этого эксперта (без перенормировки), и через неё идёт градиент; плюс вспомогательный
    loss балансировки.
  source: course
- id: paper-deepseekmoe-ideas-01
  topic: moe
  tasks: [C-P3-moe-deepseek]
  difficulty: medium
  kind: open
  question: "Какие две идеи предлагает DeepSeekMoE и какую проблему обычного MoE решает каждая?"
  answer: >
    Fine-grained сегментация: эксперты делятся на более мелкие, и активируется пропорционально больше
    — вычисления те же, а комбинаций экспертов на порядки больше, знания распределяются точнее.
    Shared experts: несколько экспертов обрабатывают каждый токен, принимая на себя общее знание,
    которое иначе дублировалось бы в routed-экспертах. Вместе это должно повышать специализацию
    routed-экспертов.
  source: course
- id: paper-dsv2-mla-01
  topic: attention
  tasks: [C-P3-moe-deepseek]
  difficulty: hard
  kind: open
  question: "Зачем в DeepSeek-V2 сжимают не только K/V, но и запрос (q_lora_rank), если запрос не кешируется?"
  answer: >
    Сжатие запроса не влияет на KV-cache. Оно уменьшает число параметров и объём активаций, которые
    нужно хранить для обратного прохода при обучении: q = W_UQ · norm(W_DQ x) вместо одной большой
    матрицы W_Q размера C × H·(d_n + d_r). У DeepSeek-V3 латент запроса — 1536 при hidden 7168.
  source: course
- id: paper-dsv3-balance-01
  topic: moe
  tasks: [C-P3-moe-deepseek]
  difficulty: hard
  kind: open
  question: >
    DeepSeek-V3 балансирует нагрузку bias-ом без градиента, но всё же оставляет маленький
    sequence-wise aux loss. Зачем?
  answer: >
    Bias выравнивает нагрузку в среднем по батчу/шагам, но внутри отдельной последовательности
    распределение может быть сильно перекошено (например, весь текст — код, и все токены идут к
    одним экспертам). Небольшой aux loss, считаемый по каждой последовательности с очень малым
    коэффициентом, не даёт такому перекосу стать экстремальным, почти не мешая основному loss.
  source: course
- id: paper-dsv3-mtp-01
  topic: training
  tasks: [C-P3-moe-deepseek]
  difficulty: medium
  kind: open
  question: "Чем MTP в DeepSeek-V3 отличается от более ранних вариантов с независимыми выходными головами?"
  answer: >
    В ранних вариантах несколько голов параллельно предсказывали t+1, t+2, … из одного и того же
    скрытого состояния. В DeepSeek-V3 модули последовательны: глубина k получает выход глубины k − 1 и
    эмбеддинг уже известного токена t_{i+k}, проходит через свой блок трансформера — полная причинная
    цепочка сохраняется на каждой глубине. Эмбеддинг и выходная голова общие с основной моделью.
  source: course
