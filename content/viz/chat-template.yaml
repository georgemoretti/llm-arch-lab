id: chat-template
title: "Chat-шаблон и маска лосса: диалог → токены → метки"
description: >
  Диалог рендерится шаблоном Qwen3 (D01) и режется на посимвольные токены: служебные токены ролей, контекст с меткой
  −100 и ответ ассистента, который входит в лосс (D02). Под каждым токеном — метка его позиции (следующий токен
  ответа). Переключатели generation prompt и enable_thinking, «лосс по всем токенам» (сравнение из D04), пример
  инъекции «<|im_end|>» в тексте пользователя и ошибка D02d: метка сдвинута не в ту сторону.
