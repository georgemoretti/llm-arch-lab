# Вопросы курса к блоку A, модуль 4 (Свой GPT): эмбеддинги и позиции, weight tying, одноголовое attention и маска,
# блок трансформера, мини-GPT, обучение и генерация. Ответы написаны авторами курса. Квиз A-Q4 собирает весь файл.
- id: emb-positions-01
  topic: positional-encoding
  tasks: [A15-embeddings]
  difficulty: easy
  kind: open
  question: "Зачем трансформеру позиционные эмбеддинги, если у MLP с окном (A10) их не было?"
  answer: >
    MLP с окном склеивал эмбеддинги символов в фиксированном порядке: первые числа вектора — первый символ окна,
    следующие — второй. Порядок был зашит в устройство входа. Трансформер обрабатывает каждую позицию одними и теми
    же весами, а attention складывает значения взвешенной суммой, которой порядок слагаемых безразличен. Без
    дополнительной информации перестановка токенов переставит выходы, но не изменит их. Поэтому к вектору токена
    прибавляют вектор позиции, и модель различает «кто на каком месте».
  source: course
- id: emb-positions-limit-01
  topic: positional-encoding
  tasks: [A15-embeddings, A18-minigpt]
  difficulty: medium
  kind: mcq
  question: "Модель с обучаемыми позиционными эмбеддингами (block_size = 64) получает последовательность из 100 токенов. Что произойдёт?"
  options:
    - "Ничего: attention работает на любой длине"
    - "Для позиций 64–99 нет строк в таблице позиций; приходится обрезать контекст до последних 64 токенов"
    - "Позиции 64–99 получат нулевые векторы, и модель будет работать хуже"
    - "Модель автоматически интерполирует позиции"
  correct: 1
  answer: >
    Таблица wpe имеет ровно block_size строк, позиции 64 и дальше в ней просто нет: индексирование упадёт. Поэтому
    при генерации контекст обрезают до последних block_size токенов (как в generate из A18), а длина контекста
    модели жёстко ограничена при обучении. Это одна из причин, почему позже перешли на RoPE (C03): там позиция —
    угол поворота, и формула определена для любого номера, хотя качество на длинах больше обучающих всё равно
    нужно отдельно обеспечивать.
  source: course
- id: emb-init-loss-01
  topic: training
  tasks: [A15-embeddings, A18-minigpt]
  difficulty: easy
  kind: mcq
  question: "Языковая модель со словарём 67 символов только что инициализирована весами N(0, 0.02²). Какого стартового loss стоит ожидать?"
  options:
    - "Около 0"
    - "Около ln 67 ≈ 4.2"
    - "Около 67"
    - "Около 1"
  correct: 1
  answer: >
    При маленьких весах логиты почти нулевые, и softmax даёт почти равномерное распределение 1/V. Cross-entropy
    равномерного распределения равна ln V, для V = 67 это ≈ 4.2. Если стартовый loss заметно больше (например, 10),
    модель с самого начала уверенно ошибается: обычно виновата инициализация (слишком большие веса выходного слоя).
    Эта проверка стоит одной строки и ловит ошибку до траты времени на обучение.
  source: course
- id: tying-why-01
  topic: embeddings
  tasks: [A15-embeddings]
  difficulty: medium
  kind: open
  question: "Что такое weight tying в языковой модели и зачем его делают?"
  answer: >
    Входная таблица эмбеддингов и выходной слой имеют одну форму [V, C], и при tying это один и тот же тензор:
    логит токена — скалярное произведение скрытого состояния с эмбеддингом этого токена. Экономия — V·C
    параметров: у GPT-2 small это 38.6 млн из 124 млн. Кроме того, выходной слой получает градиенты для всех
    токенов на каждом шаге, а входной — только для встретившихся, и связка помогает редким токенам. Press и Wolf
    (2017) показали, что связка улучшает перплексию. У больших моделей доля эмбеддингов в параметрах мала, и их
    часто не связывают (Llama 3 8B), у маленьких — связывают (GPT-2, Llama 3.2 1B, Qwen3-0.6B).
  source: course
- id: tying-grad-01
  topic: embeddings
  tasks: [A15-embeddings]
  difficulty: medium
  kind: mcq
  question: "Веса wte и lm_head связаны. Как считается градиент этого общего тензора?"
  options:
    - "Берётся только градиент от выходного слоя"
    - "Градиенты двух путей усредняются"
    - "Градиенты от входа (строки встретившихся токенов) и от выхода (вся матрица) складываются"
    - "Связанные веса не обучаются"
  correct: 2
  answer: >
    Тензор участвует в вычислении дважды, и по правилу дифференцирования сложной функции его полный градиент —
    сумма вкладов обоих использований. Autograd делает это сам: при backward градиенты накапливаются в .grad (A01).
    Важно, чтобы это был именно один параметр, а не копия значений: копии после первого шага оптимизатора
    разойдутся.
  source: course
- id: attn1-scaling-01
  topic: attention
  tasks: [A16-attention]
  difficulty: medium
  kind: open
  question: "Почему оценки q·k в attention делят именно на √D, а не на D и не на 1?"
  answer: >
    Если компоненты q и k независимы, с нулевым средним и единичной дисперсией, их скалярное произведение — сумма D
    слагаемых с дисперсией 1, то есть дисперсия D и стандартное отклонение √D. Деление на √D возвращает оценкам
    масштаб порядка 1. Без деления при D = 64 оценки порядка ±8, softmax почти one-hot, градиенты невыбранных
    ключей исчезают, и обучение застревает. Деление на D сжало бы оценки до ~1/√D, и веса стали бы почти
    равномерными: модель не могла бы сфокусироваться.
  source: course
- id: attn1-mask-softmax-01
  topic: attention
  tasks: [A16-attention, A16d-attention-debug]
  difficulty: medium
  kind: open
  question: "Почему causal-маску применяют к оценкам до softmax значением −∞, а не обнуляют веса после softmax?"
  answer: >
    Softmax нормирует строку на сумму экспонент всех оценок. Если будущие оценки ещё стоят в строке, они попадают в
    знаменатель, и веса прошлых ключей зависят от будущих токенов: будущее протекает, даже если его веса потом
    обнулить. Вдобавок строка перестаёт суммироваться в 1. Значение −∞ до softmax даёт e^−∞ = 0 и в числителе, и в
    знаменателе, поэтому оставшиеся веса — честное распределение по разрешённым ключам.
  source: course
- id: attn1-qkv-01
  topic: attention
  tasks: [A16-attention]
  difficulty: easy
  kind: mcq
  question: "Зачем в attention три разные проекции (query, key, value), а не одна?"
  options:
    - "Так быстрее считается"
    - "Чтобы роли разделились: что позиция ищет, по чему её находят и что она передаёт — разные признаки"
    - "Без трёх проекций не совпадут формы матриц"
    - "Это нужно только для causal-маски"
  correct: 1
  answer: >
    Запрос описывает, какая информация нужна текущей позиции, ключ — по какому признаку позицию можно найти,
    значение — что она отдаст. Это разные вещи: местоимение ищет существительное подходящего рода (запрос),
    существительное «рекламирует» свой род (ключ), а передать должно своё значение (value). С одной проекцией оценка
    q·q была бы симметричной, и каждая позиция сильнее всего смотрела бы на себя.
  source: course
- id: attn1-cost-01
  topic: attention
  tasks: [A16-attention]
  difficulty: medium
  kind: open
  question: "Как растут время и память attention с длиной последовательности T и чем это отличается от MLP с окном?"
  answer: >
    Матрица оценок имеет форму [T, T], поэтому и вычисления, и память растут как T² (при фиксированной размерности
    головы). MLP с окном k тратит O(k) на позицию, и общая стоимость линейна по T, но видит только k символов. Attention
    видит весь контекст, и за это платит квадратом. Отсюда ограничение block_size и поздние ухищрения: KV-cache для
    генерации (C05), скользящее окно (C07), FlashAttention, линейное внимание (C20).
  source: course
- id: block-residual-01
  topic: transformer
  tasks: [A17-block]
  difficulty: medium
  kind: open
  question: "Зачем в блоке трансформера остаточные связи и что они дают глубокой сети?"
  answer: >
    Подслой не заменяет вход, а прибавляет поправку: x ← x + f(x). Производная по входу содержит единичное слагаемое,
    поэтому градиент доходит до первых слоёв без затухания, даже через десятки блоков. При малых весах подслоёв
    глубокая сеть в начале обучения близка к тождеству, и каждый блок учится лишь немного уточнять представление.
    Residual-поток работает как общая шина: блоки читают из неё и дописывают в неё свои результаты.
  source: course
- id: block-prepost-01
  topic: transformer
  tasks: [A17-block]
  difficulty: medium
  kind: mcq
  question: "Чем pre-LN отличается от post-LN?"
  options:
    - "В pre-LN LayerNorm стоит перед подслоем, а residual-поток не нормализуется; в post-LN нормализуется сумма x + f(x)"
    - "В pre-LN нормализация только перед первым блоком"
    - "Pre-LN использует RMSNorm, post-LN — LayerNorm"
    - "Разницы нет, это разные названия"
  correct: 0
  answer: >
    Pre-LN: x + f(LN(x)) — нормализуется только вход подслоя, а прямой путь по остаткам свободен; нужен финальный
    LayerNorm после последнего блока. Post-LN (исходный Transformer): LN(x + f(x)) — нормализация стоит на прямом
    пути, и градиент проходит через каждую LayerNorm. Глубокий post-LN трудно обучать без долгого warmup, поэтому
    GPT-2 и почти все современные LLM используют pre-LN (подробно — C08).
  source: course
- id: block-mlp-01
  topic: transformer
  tasks: [A17-block]
  difficulty: easy
  kind: open
  question: "Зачем в блоке трансформера MLP, если attention уже собирает информацию со всего контекста?"
  answer: >
    Attention смешивает позиции, но для фиксированных весов внимания это взвешенная сумма линейных проекций — почти
    линейная операция. MLP обрабатывает каждую позицию отдельно и нелинейно: расширяет вектор в 4 раза, применяет
    GELU и сжимает обратно. Здесь модель преобразует собранную информацию. В больших моделях на MLP приходится
    около двух третей параметров блока, и считается, что там хранится значительная часть «знаний».
  source: course
- id: block-gelu-01
  topic: transformer
  tasks: [A17-block]
  difficulty: easy
  kind: mcq
  question: "Чем GELU в MLP GPT-2 отличается от ReLU?"
  options:
    - "Ничем, это другое название ReLU"
    - "GELU гладкая: умножает вход на вероятность Φ(x), пропуская маленькие отрицательные значения; GPT-2 считает её через tanh-аппроксимацию"
    - "GELU всегда положительна"
    - "GELU нужна только для post-LN"
  correct: 1
  answer: >
    GELU(x) = x·Φ(x), где Φ — функция распределения стандартной нормальной величины. Для больших положительных x она
    почти равна x, для больших отрицательных — почти 0, а около нуля гладкая и чуть уходит ниже нуля. ReLU резко
    обрезает всё отрицательное. GPT-2 использует tanh-аппроксимацию Φ, и чтобы загрузить её веса, нужна именно она:
    точный GELU даёт расхождение порядка 1e-3.
  source: course
- id: minigpt-targets-01
  topic: training
  tasks: [A18-minigpt]
  difficulty: easy
  kind: open
  question: "Как устроен обучающий пример для GPT и почему один кусок текста даёт T примеров сразу?"
  answer: >
    Из текста вырезается кусок длины T + 1: вход x — первые T токенов, цель y — те же токены, сдвинутые на один
    вперёд. Позиция t должна предсказать y_t = x_{t+1}, видя только x_0 … x_t (causal-маска). Все T позиций
    считаются за один проход и дают T слагаемых лосса: модель одновременно учится предсказывать по контексту длины
    1, 2, …, T. Это одна из причин, почему трансформеры учатся гораздо эффективнее RNN, которые проходят текст
    шаг за шагом.
  source: course
- id: minigpt-overfit-01
  topic: training
  tasks: [A18-minigpt]
  difficulty: medium
  kind: open
  question: "Мини-GPT на 190 тыс. параметров учится на 21 тыс. символов. Train-лосс падает до 0.5, а val после 1000 шагов растёт. Что происходит и что делать?"
  answer: >
    Модель переобучается: ей хватает ёмкости заучить обучающий текст, и дальше она запоминает конкретные фразы, а не
    закономерности языка. На отложенном тексте её уверенные «вспоминания» ошибочны, и val растёт. Средства: больше
    данных (главное), меньше модель, dropout и weight decay, ранняя остановка по минимуму val и сохранение лучших
    весов. Большие LLM почти не переобучаются при предобучении: они видят каждый документ один-два раза.
  source: course
- id: minigpt-generate-01
  topic: generation
  tasks: [A18-minigpt]
  difficulty: medium
  kind: mcq
  question: "Генерация в A18 прогоняет на каждом шаге весь контекст через модель. Что здесь неэффективно и как это исправляют?"
  options:
    - "Ничего, иначе нельзя"
    - "Ключи и значения прошлых позиций пересчитываются каждый шаг; KV-cache хранит их и считает только новую позицию"
    - "Нужно генерировать сразу по 10 токенов"
    - "Нужно отключить causal-маску при генерации"
  correct: 1
  answer: >
    Прошлые токены не меняются, и их ключи и значения в каждом слое тоже. Наивная генерация пересчитывает их на
    каждом шаге, и стоимость шага растёт с длиной. KV-cache (C05) сохраняет k и v всех прошлых позиций, а новый
    токен считает только свои q, k, v и смотрит на кеш. Выход при этом совпадает с полным прогоном.
  source: course
- id: minigpt-temperature-01
  topic: generation
  tasks: [A18-minigpt]
  difficulty: easy
  kind: open
  question: "Как температура влияет на текст мини-GPT и почему при temperature = 0 генерация часто зацикливается?"
  answer: >
    Логиты делятся на τ перед softmax. При τ < 1 распределение становится острее, и модель чаще выбирает самые
    вероятные символы: текст гладкий, но однообразный. При τ > 1 распределение сглаживается: больше разнообразия и
    больше бессмысленных слов. При τ = 0 всегда берётся argmax, и генерация детерминирована. Попав в частую фразу,
    модель предсказывает её продолжение, затем снова её начало, и выбраться из цикла ей нечем, потому что случайности
    нет.
  source: course
- id: minigpt-vs-gpt2-01
  topic: transformer
  tasks: [A18-minigpt]
  difficulty: medium
  kind: open
  question: "Чем мини-GPT из A18 отличается от настоящей GPT-2 small?"
  answer: >
    Устройство то же: эмбеддинги токенов и обучаемых позиций, pre-LN блоки с causal attention и GELU-MLP, финальный
    LayerNorm, выходной слой, связанный с эмбеддингами. Отличия: одна голова attention на весь n_embd вместо 12
    голов по 64 (C00), словарь из 67 символов вместо 50 257 BPE-токенов (A11–A14), 4 блока вместо 12, n_embd 64 вместо
    768, контекст 64 вместо 1024, нет dropout и bias-настроек оригинала, и обучение на 21 тыс. символов вместо
    ~40 ГБ текста WebText. Параметров — 190 тысяч против 124 миллионов.
  source: course
