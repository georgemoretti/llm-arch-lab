# Вопросы к статьям блока B (энкодеры). Модуль 1: Sutskever et al. 2014, Bahdanau et al. 2014, Vaswani et al. 2017
# (энкодер-декодер, регуляризация). Ответы написаны авторами курса.
- id: paper-seq2seq-bottleneck-01
  topic: architecture
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какое «бутылочное горлышко» было у seq2seq на RNN (Sutskever et al., 2014) и как его обходили в самой статье?"
  answer: >
    Энкодер-LSTM сжимает всё предложение в один вектор состояния фиксированного размера, и декодер разворачивает
    перевод только из него. Чем длиннее фраза, тем больше теряется. Авторы заметили, что подача исходного
    предложения в обратном порядке заметно улучшает качество: первые слова источника оказываются ближе к первым
    словам перевода, и зависимости становятся короче. Это обход, а не решение: вектор всё равно один.
  source: course
- id: paper-bahdanau-attention-01
  topic: attention
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Что предложили Bahdanau et al. (2014) и чем их attention отличается от scaled dot-product attention Transformer?"
  answer: >
    Декодер на каждом шаге строит свой вектор контекста — взвешенную сумму состояний энкодера по всем позициям,
    веса — softmax от оценок «насколько позиция источника подходит текущему шагу». Это убрало бутылочное горлышко
    одного вектора и дало выравнивание слов как побочный продукт. Оценка у них аддитивная: маленькая сеть
    vᵀ tanh(W s + U h). В Transformer — скалярное произведение q·k/√d: быстрее (матричное умножение) и при правильном
    масштабе не хуже. И главное: у Bahdanau attention — добавка к RNN, а в Transformer рекуррентности нет вовсе.
  source: course
- id: paper-aiayn-three-attentions-01
  topic: attention
  tasks: [B-P1-seq2seq-attention]
  difficulty: easy
  kind: open
  question: "Какие три применения multi-head attention описывает §3.2.3 статьи Transformer?"
  answer: >
    Cross-attention «энкодер-декодер»: запросы из предыдущего слоя декодера, ключи и значения — из выхода энкодера,
    каждая позиция декодера видит весь источник. Self-attention энкодера: Q, K, V из предыдущего слоя энкодера, каждая
    позиция видит все. Self-attention декодера: то же, но позиция видит только себя и прошлое — запрещённые связи
    получают −∞ до softmax. В задачах B01, B03 и B04 это три маски: padding, causal + padding, padding источника.
  source: course
- id: paper-aiayn-regularization-01
  topic: training
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какие два способа регуляризации использует Transformer (§5.4) и какой из них ухудшает перплексию?"
  answer: >
    Residual dropout: dropout на выходе каждого подслоя перед сложением с остатком и на сумме эмбеддингов и позиций
    (P = 0.1 у базовой модели). И label smoothing с ε = 0.1: он делает модель менее уверенной и потому ухудшает
    перплексию, но улучшает точность и BLEU. В курсе dropout выключен (детерминированные тесты), label smoothing
    реализован в B05.
  source: course
- id: paper-aiayn-shared-embeddings-01
  topic: embeddings
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какие матрицы весов Transformer делит между собой (§3.4) и что для этого нужно от токенизации?"
  answer: >
    Одна матрица служит эмбеддингом входа энкодера, эмбеддингом входа декодера и (транспонированной) матрицей
    выходного слоя перед softmax; в слоях эмбеддингов её умножают на √d_model. Чтобы источник и цель могли делить
    одну таблицу, у них должен быть общий словарь: для англо-немецкого перевода — общий BPE примерно на 37 тысяч
    токенов. Так экономятся параметры, а одинаковые подслова (имена, числа) в двух языках получают одно
    представление.
  source: course
