id: masks
title: "Маски внимания: causal, sliding window, local:global по слоям, sparse top-k"
description: >
  Интерактивные матрицы масок: обычная causal-маска, скользящее окно (слайдер W), двунаправленное окно
  энкодера (ModernBERT), расписание sliding/full по слоям (Gemma 2 / Gemma 3, ModernBERT), рост поля зрения при наложении нескольких SWA-слоёв и
  sparse-маска top-k в стиле DSA (своя у каждого запроса, слайдеры k и веса близости).
