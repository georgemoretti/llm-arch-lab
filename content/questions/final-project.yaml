# Вопросы курса к модулю 5 (финальный проект): config.json и веса Hugging Face, загрузка, сравнение с эталоном,
# сэмплирование. Ответы написаны авторами курса.
- id: final-config-head-dim-01
  topic: weights
  tasks: [C24-hf-checkpoint]
  difficulty: easy
  kind: mcq
  question: >
    У Qwen3-0.6B hidden_size = 1024, num_attention_heads = 16, head_dim = 128. Какой формы матрица q_proj.weight?
  options:
    - "[1024, 1024] — проекция всегда квадратная"
    - "[2048, 1024] — 16 голов × 128 на выходе, 1024 на входе"
    - "[1024, 2048] — nn.Linear хранит [in, out]"
    - "[128, 1024] — одна матрица на голову"
  correct: 1
  answer: >
    nn.Linear хранит вес как [out, in]. Выход q_proj — все головы подряд: 16 · 128 = 2048, вход — d_model = 1024.
    У Qwen3 head_dim задан отдельно и не равен d_model / H = 64, поэтому q_proj «расширяет» пространство, а o_proj
    ([1024, 2048]) сжимает обратно. Код, который выводит head_dim как d_model // n_heads, сломается на загрузке.
  source: course
- id: final-config-silent-01
  topic: weights
  tasks: [C24-hf-checkpoint]
  difficulty: medium
  kind: open
  question: >
    Почему конвертер config.json должен падать на незнакомых опциях (rope_scaling, use_sliding_window, attention_bias),
    а не игнорировать их?
  answer: >
    Веса не несут информации о том, как их использовать: тот же набор тензоров загрузится в модель без YaRN, без окна
    или без bias без единой ошибки (а bias просто окажется «лишним» ключом, который легко выкинуть). Модель при этом
    будет считать другую функцию: позиции на длинном контексте закодированы не так, как при обучении, маска шире,
    сдвиги потеряны. Ошибка проявится только как плохое качество текста — самый дорогой для поиска вид бага.
    Явная ValueError превращает его в мгновенный и понятный.
  source: course
- id: final-config-rope-format-01
  topic: weights
  tasks: [C24-hf-checkpoint]
  difficulty: medium
  kind: open
  question: >
    Конвертер читал θ RoPE как hf.get("rope_theta", 10000). На config.json, сохранённом свежей версией transformers,
    модель загрузилась, но пишет хуже. Что произошло?
  answer: >
    Новые версии transformers пишут RoPE как "rope_parameters": {"rope_theta": …, "rope_type": …}, и поля rope_theta
    в файле нет. Конвертер молча взял значение по умолчанию 10 000 вместо 1 000 000: углы поворота на всех позициях
    стали другими, и attention видит относительные позиции «не в тех единицах». Лечится чтением обоих форматов и
    проверкой rope_type; профилактика — не давать значений по умолчанию для полей, от которых зависит математика.
  source: course
- id: final-weights-conv1d-01
  topic: weights
  tasks: [C24-hf-checkpoint]
  difficulty: medium
  kind: code-reading
  question: >
    При переносе GPT-2 написали `out[name] = t.t()` для mlp.c_fc и mlp.c_proj, а attn.c_proj скопировали как есть.
    load_state_dict прошёл без ошибок. Что не так и почему ошибки не было?
  answer: >
    В GPT-2 все эти слои — Conv1D, вес хранится как [in, out], и транспонировать нужно каждый. У c_fc и mlp.c_proj
    формы прямоугольные ([768, 3072] против [3072, 768]), и без .t() load_state_dict упал бы. attn.c_proj квадратный
    [768, 768]: форма совпадает при любой ориентации, поэтому загрузка «успешна», но слой считает xW вместо xWᵀ.
    Ловится только сравнением логитов с эталоном.
  source: course
- id: final-weights-tied-01
  topic: weights
  tasks: [C24-hf-checkpoint, C25-qwen3-project]
  difficulty: easy
  kind: open
  question: "Что такое связанные эмбеддинги (weight tying) и что с ними может пойти не так при загрузке весов?"
  answer: >
    Матрица эмбеддингов [V, d] используется дважды: на входе (строка по id токена) и на выходе как lm_head (логиты =
    h · Eᵀ). Экономит V · d параметров — у Qwen3-0.6B это 155.6 M из 596 M. При загрузке: lm_head.weight может
    отсутствовать в файле (его надо взять из эмбеддингов) или присутствовать как копия; загрузка с подменой
    параметров (assign=True) создаёт два отдельных тензора — логиты пока верны, но память удвоена, а дообучение
    разведёт матрицы. Связь нужно восстановить явно.
  source: course
- id: final-load-tolerance-01
  topic: weights
  tasks: [C25-qwen3-project]
  difficulty: medium
  kind: open
  question: >
    Ты сравниваешь логиты своей реализации с transformers на настоящих весах. Как выбрать допуск и почему сравнивать
    лучше в fp32, а не в bf16?
  answer: >
    Если обе реализации считают одну и ту же функцию, различаться может только порядок операций (разбиение matmul,
    сумма в softmax и RMSNorm). В fp32 это ~1e-7 относительно на операцию; через 28 слоёв набегает ~1e-5…1e-4 в
    логитах масштаба 10–20 (у Qwen3-0.6B фактически 6e-5). Допуск 1e-3 оставляет запас ×15, а любая настоящая ошибка
    (не тот θ, норма после RoPE, перепутанные головы) даёт расхождение порядка единиц — разделение надёжное. В bf16
    7 бит мантиссы: одно округление промежуточных значений даёт 1e-2…1e-1, и легальные расхождения сливаются с
    багами. Дополнительно полезно проверять совпадение argmax и жадной генерации токен в токен.
  source: course
- id: final-load-meta-01
  topic: weights
  tasks: [C25-qwen3-project]
  difficulty: medium
  kind: open
  question: "Зачем при загрузке большой модели создавать её на устройстве meta?"
  answer: >
    Обычный конструктор выделяет память под все параметры и заполняет их случайной инициализацией — для 0.6 B это
    секунды работы и 2.4 ГБ, которые тут же будут перезаписаны весами из файла, а у моделей побольше пиковая память
    удваивается (случайные веса + загруженные). На meta создаются только «формы» без данных; load_state_dict(…,
    assign=True) подставляет тензоры из файла как параметры. Цена — связанные веса и буферы надо восстановить вручную:
    assign заменяет параметры по отдельности.
  source: course
- id: final-load-shards-01
  topic: weights
  tasks: [C25-qwen3-project]
  difficulty: easy
  kind: open
  question: "Как устроен шардированный чекпойнт safetensors и почему его используют?"
  answer: >
    Веса режутся на несколько файлов model-0000i-of-0000n.safetensors (обычно по несколько ГБ), а
    model.safetensors.index.json хранит weight_map — какому файлу принадлежит каждый тензор. Так проще скачивать и
    докачивать, можно читать только нужные тензоры и загружать модель по частям (на разные устройства). Сам формат
    safetensors — заголовок JSON с формами, типами и смещениями плюс сырые байты: файл можно отобразить в память
    (mmap) без исполнения кода, в отличие от pickle в .bin.
  source: course
- id: final-sampling-top-p-01
  topic: generation
  tasks: [C25-qwen3-project]
  difficulty: medium
  kind: mcq
  question: "Вероятности токенов: 0.5, 0.3, 0.15, 0.05. Какие токены останутся при top-p = 0.7?"
  options:
    - "Только первый: 0.5 < 0.7, а 0.5 + 0.3 = 0.8 > 0.7"
    - "Первый и второй: наименьший набор с суммой ≥ 0.7"
    - "Первые три: нужно набрать больше 0.7 с запасом"
    - "Все, у которых вероятность ≥ 0.3 (1 − 0.7)"
  correct: 1
  answer: >
    Ядро — наименьший префикс отсортированных токенов с суммой ≥ p. Одного токена (0.5) не хватает, двух (0.8) —
    достаточно. Токен, который «пересекает» порог, входит в ядро; поэтому в коде маску строят по массе токенов ВЫШЕ
    текущего (cumsum − p_i < p), а не по cumsum ≤ p — иначе второй токен выпадет, а при уверенном распределении можно
    выкинуть вообще все. Затем вероятности 0.5 и 0.3 перенормируются: 0.625 и 0.375.
  source: course
- id: final-sampling-eos-01
  topic: generation
  tasks: [C25-qwen3-project]
  difficulty: medium
  kind: open
  question: >
    Батч из двух промптов генерируется с KV-cache. Первая строка выдала eos на 3-м шаге, вторая ещё пишет. Что делать
    с первой строкой и когда остановиться?
  answer: >
    Тензор батча общий, поэтому первая строка продолжает идти через модель, но её новые токены заменяются на eos
    (или pad), чтобы после конца ответа не появлялся текст. Генерация прекращается, когда закончили все строки или
    исчерпан лимит. Это «лишние» вычисления для законченных строк — поэтому серверы инференса используют continuous
    batching: законченная последовательность покидает батч, на её место встаёт новый запрос.
  source: course
