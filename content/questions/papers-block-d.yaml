# Вопросы к статьям блока D (после предобучения). Модуль 1: InstructGPT (Ouyang et al. 2022), FLAN (Wei et al. 2021),
# LIMA (Zhou et al. 2023). Ответы написаны авторами курса, факты сверены с текстом статей (arXiv-версии).
- id: paper-instructgpt-pipeline-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: easy
  kind: open
  question: "Из каких трёх этапов состоит обучение InstructGPT и какие данные нужны каждому?"
  answer: >
    Сначала SFT: GPT-3 дообучают на демонстрациях, где разметчики написали хорошие ответы на промпты (около 13 тысяч
    обучающих промптов из API и написанных разметчиками). Затем reward model: модель SFT без выходного слоя учится
    предсказывать, какой из ответов разметчики поставили выше (около 33 тысяч промптов с ранжированием нескольких
    ответов). Наконец PPO: политика генерирует ответы на новые промпты (около 31 тысячи, только из API, без разметки),
    reward model их оценивает, и политику оптимизируют по этой награде со штрафом KL к SFT-модели. Чем дальше этап,
    тем дешевле разметка: написать ответ труднее, чем выбрать лучший из двух.
  source: course
- id: paper-instructgpt-overfit-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: medium
  kind: open
  question: "Что авторы InstructGPT заметили про переобучение SFT и почему выбирали модель не по валидационному лоссу?"
  answer: >
    SFT обучали 16 эпох с cosine-расписанием и residual dropout 0.2. Валидационный лосс начинал расти уже после первой
    эпохи — классическое переобучение. Но оценка reward model и предпочтения людей продолжали улучшаться с числом
    эпох, поэтому финальную SFT-модель выбирали по оценке reward model на валидации. Вывод для практики: перплексия на
    отложенных демонстрациях плохо отражает качество ответов. LIMA пишет то же самое и выбирает чекпойнт вручную на
    отложенных промптах.
  source: course
- id: paper-instructgpt-size-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: easy
  kind: mcq
  question: "Какой результат InstructGPT чаще всего цитируют про размер модели?"
  options:
    - "175B InstructGPT хуже 1.3B GPT-3"
    - "ответы 1.3B InstructGPT люди предпочитают ответам 175B GPT-3, хотя параметров в 100 раз меньше"
    - "SFT без RLHF не улучшает модель"
    - "InstructGPT 1.3B лучше GPT-4"
  correct: 1
  answer: >
    На распределении промптов API ответы 1.3B InstructGPT разметчики предпочитали ответам исходной 175B GPT-3. Значит,
    умение следовать инструкциям даёт пользователю больше, чем стократный рост параметров без него. Это не значит, что
    маленькая модель «знает» больше: знания — от предобучения, дообучение делает их доступными в нужном формате.
  source: course
- id: paper-instructgpt-alignment-tax-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: medium
  kind: open
  question: "Что такое alignment tax в InstructGPT и как его уменьшали (PPO-ptx)?"
  answer: >
    После RLHF качество на части публичных NLP-бенчмарков (SQuAD, DROP, HellaSwag, перевод WMT) падало по сравнению с
    GPT-3. Выравнивание по предпочтениям «стоило» способностей — это и назвали налогом на выравнивание. В PPO-ptx к
    цели PPO добавляют обычный лосс языкового моделирования на данных предобучения. Градиенты предобучения удерживают
    модель от дрейфа, и регрессии почти уходят без потери в предпочтениях разметчиков. В статье «InstructGPT» по
    умолчанию означает именно модели PPO-ptx.
  source: course
- id: paper-instructgpt-vs-flan-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: medium
  kind: open
  question: "Почему GPT-3, дообученная на смеси FLAN или T0, проиграла InstructGPT на промптах реальных пользователей?"
  answer: >
    Авторы называют две причины. Первая — распределение задач: публичные NLP-датасеты состоят из того, что легко
    оценить автоматически (классификация, QA, отчасти суммаризация и перевод). У пользователей API классификация и QA
    — лишь около 18 % запросов, а открытая генерация и брейншторм — около 57 %. Вторая — разнообразие входов: собрать
    в публичных датасетах столько же разных запросов трудно. В прямом сравнении ответы 175B InstructGPT предпочитали
    ответам модели FLAN в 78 % случаев и T0 — в 79 %. Вывод: важны данные, похожие на реальное использование.
  source: course
- id: paper-flan-setup-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: easy
  kind: open
  question: "Как устроен instruction tuning в FLAN и как авторы проверяли обобщение на новые задачи?"
  answer: >
    Взяли 137B-модель LaMDA-PT и дообучили на смеси 62 публичных текстовых датасетов, сгруппированных в 12 кластеров
    задач (NLI, перевод, здравый смысл и т. д.). Каждый пример оформлен как инструкция по одному из десяти шаблонов,
    написанных для датасета вручную; до трёх шаблонов «переворачивают» задачу (например, сочинить отзыв вместо
    классификации отзыва). Обобщение проверяли по кластерам: чтобы оценить задачи кластера, из обучения убирали
    весь кластер. Так тестовая задача действительно новая, а не родственный датасет из того же кластера.
  source: course
- id: paper-flan-scale-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: medium
  kind: mcq
  question: "Что FLAN показал про instruction tuning маленьких моделей?"
  options:
    - "помогает одинаково на всех размерах"
    - "у моделей ~100B заметно улучшает отложенные задачи, а у моделей 8B и меньше ухудшает"
    - "работает только для моделей меньше 1B"
    - "размер не изучали"
  correct: 1
  answer: >
    У двух моделей порядка 100B параметров instruction tuning сильно поднимает качество на отложенных кластерах, а у
    моделей 8B и меньше качество на новых задачах падает. Авторы предполагают, что маленькой модели не хватает ёмкости:
    около 40 задач обучения забирают её целиком, и на обобщение не остаётся. Более поздние работы (FLAN-T5, Llama 2
    Chat) показали, что с лучшими данными и рецептом дообучение помогает и небольшим моделям. Но вывод «эффект зависит
    от масштаба» остаётся важным.
  source: course
- id: paper-flan-instructions-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: medium
  kind: open
  question: "Какие абляции FLAN показывают, что дело именно в инструкциях, а не просто в многозадачном дообучении?"
  answer: >
    Число кластеров: чем больше кластеров задач в обучении, тем лучше качество на отложенных, и насыщения при 7
    кластерах не видно. Роль инструкций: сравнили с дообучением без шаблона (только вход и выход) и с префиксом из
    имени датасета вместо инструкции. Оба варианта заметно хуже FLAN на отложенных задачах. Значит, модель учится
    понимать формулировку задачи, а не только запоминать набор задач.
  source: course
- id: paper-lima-hypothesis-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: easy
  kind: open
  question: "Сформулируй Superficial Alignment Hypothesis из LIMA своими словами. Какой эксперимент её подтверждает?"
  answer: >
    Знания и способности модель получает почти целиком при предобучении, а выравнивание учит её, в каком формате и
    стиле отвечать пользователю. Если так, хватит небольшого набора хороших примеров. LIMA — LLaMA 65B, дообученная
    только на 1000 тщательно отобранных пар «промпт — ответ», без RLHF. В сравнении людьми её ответы были не хуже или
    лучше ответов GPT-4 в 43 % случаев, Bard — в 58 %, DaVinci003 (обучена с RLHF) — в 65 %. В проекте D04 то же
    видно в миниатюре: SFT учит формату, а отвечать на новые примеры модель может благодаря «предобучению».
  source: course
- id: paper-lima-data-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: medium
  kind: open
  question: "Из чего собрана 1000 примеров LIMA и что показали абляции о разнообразии, качестве и количестве данных?"
  answer: >
    750 примеров взяты с сайтов сообщества: Stack Exchange — 400 (по 200 из STEM-разделов и прочих, с фильтрами длины
    и стиля), wikiHow — 200 статей, Reddit r/WritingPrompts — 150 историй. Ещё 200 примеров авторы написали сами и 50
    взяли из Super-Natural Instructions (по одному из 50 задач генерации). Абляции на 7B-модели: разнообразные
    промпты Stack Exchange лучше однородных wikiHow при равном качестве ответов. Отфильтрованные ответы заметно лучше неотфильтрованных
    (около 0.5 балла по шкале 1–6). Удвоение объёма без роста разнообразия качество не поднимает.
  source: course
- id: paper-lima-eot-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima, D01-chat-template]
  difficulty: medium
  kind: open
  question: "Зачем LIMA вводит отдельный токен конца хода (EOT), а не использует обычный EOS?"
  answer: >
    EOT ставится в конце каждой реплики и останавливает генерацию так же, как EOS. Но у предобученного EOS уже есть
    смысл — «конец документа». Новый токен не смешивает «конец хода в диалоге» с «концом документа», которые модель
    видела при предобучении. Та же идея — у <|im_end|> в ChatML/Qwen: отдельный служебный токен конца хода, отличный
    от <|endoftext|>.
  source: course
- id: paper-lima-multiturn-01
  topic: training
  tasks: [D-P1-instructgpt-flan-lima]
  difficulty: medium
  kind: mcq
  question: "LIMA обучали без диалогов. Что дали 30 добавленных многоходовых диалогов?"
  options:
    - "ничего: модель и так вела диалог идеально"
    - "доля отличных ответов в диалогах выросла примерно с 45 % до 76 %"
    - "модель разучилась отвечать на одиночные вопросы"
    - "диалоги не тестировали"
  correct: 1
  answer: >
    Даже без примеров диалогов LIMA вела связный разговор, но иногда сбивалась (15 провалов на 42 хода). После
    дообучения с 30 вручную написанными цепочками доля отличных ответов выросла с 45.2 % до 76.1 %, а провалов
    осталось 1 на 46 ходов. Это ещё один довод за гипотезу: небольшой порции примеров хватает, чтобы научить новому
    формату, если способности уже есть.
  source: course
