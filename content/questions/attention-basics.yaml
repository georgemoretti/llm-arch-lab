# Стартовый набор вопросов курса (формат — PLAN.md, Фаза 7).
# Ответы написаны авторами курса.
- id: attention-scaling-01
  topic: attention
  tasks: [C00-causal-mha]
  difficulty: easy
  kind: open
  question: "Зачем в scaled dot-product attention делить QKᵀ на √d_k?"
  answer: >
    Если компоненты q и k независимы с нулевым средним и единичной дисперсией, то их скалярное
    произведение имеет дисперсию d_k. При большом d_k логиты становятся большими по модулю,
    softmax насыщается почти в one-hot, и градиенты через него почти нулевые. Деление на √d_k
    возвращает дисперсию логитов к ~1 независимо от размера головы.
  source: course
- id: attention-causal-mask-01
  topic: attention
  tasks: [C00-causal-mha]
  difficulty: easy
  kind: open
  question: "Почему causal-маску применяют до softmax, заполняя запрещённые позиции −∞, а не обнуляют веса после softmax?"
  answer: >
    exp(−∞) = 0, поэтому запрещённые позиции получают нулевой вес, а оставшиеся веса строки
    по-прежнему суммируются в 1. Если обнулить веса после softmax, строка перестанет быть
    распределением (сумма < 1), а нормировочная константа уже «видела» будущие токены —
    информация из будущего просочится через знаменатель.
  source: course
- id: attention-heads-01
  topic: attention
  tasks: [C00-causal-mha]
  difficulty: medium
  kind: open
  question: "Сколько параметров у multi-head attention с d_model = C и H головами (с bias)? Зависит ли это от H?"
  answer: >
    Проекции Q, K, V: 3·(C·C + C), выходная проекция: C·C + C. Итого 4C² + 4C. От числа голов
    не зависит: головы — это разбиение тех же C измерений на H групп по D = C/H. Меняется
    только то, как считаются веса внимания (H независимых softmax вместо одного).
  source: course
- id: attention-complexity-01
  topic: attention
  tasks: [C00-causal-mha]
  difficulty: medium
  kind: open
  question: "Какова сложность self-attention по времени и памяти от длины последовательности T? Какая часть доминирует?"
  answer: >
    Матрица оценок имеет размер T×T на каждую голову, поэтому время O(T²·C), а память под
    веса внимания O(H·T²) (если не использовать FlashAttention-подобные алгоритмы, которые не
    материализуют матрицу целиком). Проекции стоят O(T·C²): при коротком контексте доминируют
    они, при длинном — квадратичная часть.
  source: course
