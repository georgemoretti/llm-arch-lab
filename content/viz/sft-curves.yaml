id: sft-curves
title: "SFT: формат от дообучения, знания от предобучения"
description: >
  Предзаписанный эксперимент D04: игрушечная модель дообучается на диалогах тремя способами — база после
  «предобучения» с лоссом только по ответу, та же база с лоссом по всем токенам и та же модель без предобучения.
  Кривые доли верного формата, верного ответа на отложенных примерах и лосса ответа по шагам SFT; таблица по задачам
  рядом с тем, что база умеет в своём формате сплошного текста.
