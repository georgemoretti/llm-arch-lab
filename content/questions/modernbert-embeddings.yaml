# Вопросы курса к блоку B, модуль 4 (ModernBERT и эмбеддинги текста): слой ModernBERT, unpadding, sentence-эмбеддинги,
# контрастивное обучение, мини-поиск. Ответы написаны авторами курса. Квиз B-Q4 собирает весь файл.
- id: modernbert-layer-diff-01
  topic: architecture
  tasks: [B16-modernbert-layer]
  difficulty: easy
  kind: open
  question: "Что ModernBERT взял у современных декодеров и что в нём осталось от BERT?"
  answer: >
    От декодеров: RoPE вместо таблицы позиций, GeGLU вместо обычного FFN, Pre-LN с финальной нормой, линейные слои и
    нормы без bias, чередование локального attention (окно) и глобального. От BERT: двунаправленное внимание, цель
    MLM (без NSP, как у RoBERTa), спецтокены [CLS] / [SEP] / [MASK] и MLM-голова со связанной матрицей. Окно у
    ModernBERT симметричное, ±64 токена, а не «только назад», как в Gemma или Mistral.
  source: course
- id: modernbert-layer-window-01
  topic: attention
  tasks: [B16-modernbert-layer]
  difficulty: medium
  kind: mcq
  question: "У ModernBERT-base local_attention = 128, global_attn_every_n_layers = 3. Сколько ключей видит запрос в середине длинного текста в слое 4?"
  options:
    - "128"
    - "129"
    - "все 8192: слой 4 глобальный"
    - "65"
  correct: 1
  answer: >
    Глобальные слои — 0, 3, 6, …, так что слой 4 локальный. Окно 128 — это ширина в обе стороны, по 64: условие
    |i − j| ≤ 64 даёт 64 ключа слева, сам токен и 64 справа, всего 129. Ответ 65 верен только у края текста.
  source: course
- id: modernbert-layer-theta-01
  topic: positional-encoding
  tasks: [B16-modernbert-layer]
  difficulty: medium
  kind: open
  question: "Почему у глобальных слоёв ModernBERT θ RoPE = 160 000, а у локальных — 10 000?"
  answer: >
    θ задаёт самую медленную частоту RoPE. Чем больше θ, тем дольше самые медленные пары не делают полного оборота,
    и тем лучше модель различает далёкие позиции. Глобальный слой смотрит на весь контекст 8192, ему нужен большой
    θ (тот же приём, что у Llama 3 с θ = 500 000). Локальный слой видит не дальше 64 токенов: различать дальние
    позиции ему не нужно, и обычных 10 000 хватает. Так в одной модели две θ, своя у каждого типа слоя.
  source: course
- id: modernbert-layer-finfo-01
  topic: attention
  tasks: [B16-modernbert-layer]
  difficulty: medium
  kind: code-reading
  question: >
    В локальном слое закрытые ключи заполнены так: scores.masked_fill(~mask, float("-inf")). На батче с длинным
    паддингом весь выход модели — nan, хотя без паддинга всё работает. Почему?
  answer: >
    PAD-запрос в конце длинного хвоста видит в своём окне ±64 только PAD-ключи, и все они закрыты. Его строка scores
    целиком −inf, softmax даёт 0/0 = nan. В следующем слое этот nan оказывается в ключах и значениях PAD-позиций. Маска
    закрывает их в scores, но веса 0 умножаются на v = nan, а 0 · nan = nan, и nan расходится по всем токенам.
    Лечится заполнением torch.finfo(dtype).min: строка без видимых ключей даёт равномерные веса, но конечные. Другой
    способ — обнулять выходы PAD-позиций или вообще убрать PAD (unpadding, B17).
  source: course
- id: modernbert-layer-noprenorm-01
  topic: architecture
  tasks: [B16-modernbert-layer]
  difficulty: easy
  kind: open
  question: "Почему у первого слоя ModernBERT attn_norm = Identity?"
  answer: >
    Эмбеддинги ModernBERT сразу проходят через LayerNorm, так что вход слоя 0 уже нормирован. Вторая норма подряд
    ничего не добавила бы, кроме лишнего вектора весов. В остальных слоях вход attention — сумма остатков, и норма
    перед подслоем нужна (Pre-LN).
  source: course
- id: unpadding-why-01
  topic: inference
  tasks: [B17-unpadding]
  difficulty: easy
  kind: open
  question: "Что такое unpadding (упаковка батча) и что он экономит?"
  answer: >
    Вместо батча [B, T], где короткие тексты дополнены PAD, настоящие токены всех текстов кладутся подряд в одну
    строку [N], а границы текстов хранятся в cu_seqlens = [0, L₀, L₀ + L₁, …, N]. Линейные слои, нормы и FFN
    обрабатывают N токенов вместо B·T. Attention с ядром varlen (Flash Attention) считает только диагональные блоки:
    Σ L² пар вместо B·T². Чем сильнее разброс длин в батче, тем больше выигрыш. Если один текст длиной 512, а остальные
    около 80, на паддинг уходит около трёх четвертей работы.
  source: course
- id: unpadding-positions-01
  topic: positional-encoding
  tasks: [B17-unpadding]
  difficulty: medium
  kind: mcq
  question: "Батч упакован: тексты длины 3 и 2 идут подряд. Какие позиции RoPE нужны пяти токенам упаковки?"
  options:
    - "0 1 2 3 4"
    - "0 1 2 0 1"
    - "1 2 3 1 2"
    - "любые: RoPE относительный, сдвиг всех позиций ничего не меняет"
  correct: 1
  answer: >
    Позиции у каждого текста начинаются с нуля: 0 1 2 | 0 1. Скалярное произведение после RoPE зависит только от
    разности позиций внутри текста, поэтому сдвинуть все позиции одного текста на константу можно, и scores не
    изменятся. Но 0 1 2 3 4 — не такой сдвиг: в единой нумерации второй текст начинается с позиции 3, а для модели это
    уже другой вход, чем тот же текст в батче с паддингом. Например, пропадает связь «позиция 0 = [CLS]», а при
    абсолютных позициях BERT ответ поменялся бы явно. Значит, надёжно — позиции с нуля у каждого текста.
  source: course
- id: unpadding-mask-01
  topic: attention
  tasks: [B17-unpadding, B17d-cu-seqlens-debug]
  difficulty: medium
  kind: code-reading
  question: >
    Номер текста для токена упаковки считают так: seq_id = (pos[:, None] > cu_seqlens[None, 1:]).sum(-1), затем
    mask = seq_id[:, None] == seq_id[None, :]. Что не так и как это проявится?
  answer: >
    cu_seqlens[b + 1] — граница «после последнего токена» текста b, то есть это индекс первого токена текста b + 1.
    Токен n лежит в тексте b, если позади него ровно b концов, и сравнивать надо нестрого: pos ≥ cu. Со строгим «>»
    первый токен каждого текста (кроме нулевого) попадает в предыдущий текст. Он смотрит на чужой текст, а чужой
    текст смотрит на него. Формы и cu_seqlens верны, на батче из одного текста всё совпадает. Ошибку видно только по
    сравнению с батчем с паддингом или по тому, что эмбеддинг текста зависит от соседей по батчу.
  source: course
- id: unpadding-packing-sft-01
  topic: training
  tasks: [B17-unpadding]
  difficulty: medium
  kind: open
  question: "При обучении декодера короткие примеры склеивают в одну строку (packing). Что сломается, если не передать cu_seqlens (или position_ids) в attention?"
  answer: >
    Causal-маска на склеенной строке разрешит токенам второго примера смотреть на весь первый пример. Модель учится
    продолжать текст с учётом чужого, несвязанного примера, то есть получает перекрёстное загрязнение контекста. А
    позиции второго примера начинаются не с нуля, и при длинных строках модель видит позиции, которых на инференсе у
    короткого запроса не бывает. С cu_seqlens (или position_ids, по которым ядро восстанавливает границы) attention
    считается блочно-диагонально, и результат совпадает с обучением на отдельных примерах. Экономия от packing
    при этом сохраняется.
  source: course
- id: embed-pool-mean-cls-01
  topic: embeddings
  tasks: [B18-sentence-embeddings]
  difficulty: easy
  kind: open
  question: "Mean pooling или CLS pooling — что выбрать, чтобы получить эмбеддинг текста из готовой модели?"
  answer: >
    То, на котором модель обучали: вектор, который сближали контрастивным лоссом, и есть эмбеддинг. Для
    sentence-transformers это записано в 1_Pooling/config.json: all-MiniLM-L6-v2 — mean, bge-small-en-v1.5 — CLS.
    Перепутанный pooling работает без ошибок, но качество поиска падает. Если модель для эмбеддингов не обучали
    (голый BERT после MLM), mean pooling обычно лучше [CLS]: вектор [CLS] предобучали только на NSP, и как
    эмбеддинг он плох (это показано в статье Sentence-BERT). Но и mean pooling голого BERT заметно уступает
    дообученной модели.
  source: course
- id: embed-pool-pad-01
  topic: embeddings
  tasks: [B18-sentence-embeddings, B18d-mean-pool-debug]
  difficulty: medium
  kind: mcq
  question: "Какой вариант mean pooling даёт эмбеддинг, который после L2 не зависит от длины паддинга?"
  options:
    - "hidden.mean(1)"
    - "(hidden * m).sum(1) / T"
    - "hidden.sum(1) / m.sum(1)"
    - "hidden.mean(1) * T / m.sum(1)"
  correct: 1
  answer: >
    Скрытые состояния PAD-позиций ненулевые: маска закрывает PAD только как ключ, а выход на позиции PAD энкодер
    считает как для любого токена. Поэтому все варианты, где в сумму попадают PAD (1, 3, 4), меняют направление
    вектора. Вариант 2 обнуляет PAD и делит на T вместо числа токенов. Это лишь множитель L/T, и после L2 вектор
    тот же. Без нормировки (dot product) он был бы ошибкой. Правильная формула — (hidden · m).sum(1) / m.sum(1).
  source: course
- id: embed-bi-cross-01
  topic: embeddings
  tasks: [B18-sentence-embeddings]
  difficulty: medium
  kind: open
  question: "Почему cross-encoder точнее bi-encoder, но в поиске по большому корпусу его используют только вторым этапом?"
  answer: >
    В cross-encoder токены запроса и документа видят друг друга во всех слоях: модель сравнивает конкретные слова,
    отрицания и числа. Bi-encoder сжимает каждый текст в один вектор заранее, не зная запроса, и сравнивает только
    эти векторы, а детали теряются. Но cross-encoder нужно прогонять на каждой паре (запрос, документ): для
    миллиона документов — миллион прогонов на каждый запрос. Документы для bi-encoder считают один раз, а поиск —
    это одно умножение или ANN-индекс. Поэтому сначала bi-encoder (или BM25) отбирает 50–200 кандидатов, а потом
    cross-encoder переставляет только их.
  source: course
- id: embed-bi-cross-cost-01
  topic: embeddings
  tasks: [B18-sentence-embeddings, B-P4-sbert-modernbert-e5]
  difficulty: easy
  kind: mcq
  question: "Нужно найти самую похожую пару среди n = 10 000 предложений. Сколько прогонов энкодера потребуется cross-encoder'у и bi-encoder'у?"
  options:
    - "10 000 и 10 000"
    - "≈ 50 млн и 10 000"
    - "≈ 100 млн и 20 000"
    - "≈ 50 млн и ≈ 50 млн"
  correct: 1
  answer: >
    Cross-encoder оценивает каждую пару отдельно: n(n − 1)/2 ≈ 5 · 10⁷ прогонов (в статье Sentence-BERT — около 65
    часов на V100). Bi-encoder кодирует каждое предложение один раз (10 000 прогонов), а дальше считает матрицу
    косинусов 10 000 × 10 000 одним умножением, около 5 секунд.
  source: course
- id: contrastive-in-batch-01
  topic: embeddings
  tasks: [B19-infonce]
  difficulty: easy
  kind: open
  question: "Что такое in-batch негативы и почему для контрастивного обучения эмбеддингов важен большой батч?"
  answer: >
    В батче N пар (запрос, документ). Для запроса i позитив — его документ, а документы остальных N − 1 пар
    считаются негативами. Их не надо отдельно размечать и даже отдельно кодировать: эмбеддинги уже посчитаны, и лосс —
    это cross-entropy по строкам матрицы N × N. Чем больше батч, тем больше негативов на запрос и тем вероятнее среди
    них трудные, близкие к позитиву. Поэтому E5 предобучали с батчем 32 768 (по таблице 5 их статьи рост батча с 1K до
    32K стабильно улучшал поиск), а DPR — с батчем 128 и одним BM25-негативом на вопрос. Маленький батч частично
    заменяют hard negatives: дополнительные документы, найденные BM25 или другой моделью.
  source: course
- id: contrastive-temperature-01
  topic: embeddings
  tasks: [B19-infonce]
  difficulty: medium
  kind: mcq
  question: "Зачем в InfoNCE косинусы делят на температуру τ ≈ 0.01–0.05?"
  options:
    - "чтобы лосс был неотрицательным"
    - "косинусы лежат в [−1, 1], и без τ softmax почти равномерный: разница позитива и негатива почти не влияет на лосс"
    - "чтобы эмбеддинги имели единичную норму"
    - "τ — регуляризация, она уменьшает переобучение"
  correct: 1
  answer: >
    Без τ разница косинусов 0.9 и 0.8 даёт отношение вероятностей e^0.1 ≈ 1.1, и softmax по сотням документов
    почти плоский: лосс близок к log M, а градиент слабый. Деление на τ = 0.05 растягивает ту же разницу до 2 (отношение
    e² ≈ 7.4), и градиент сосредотачивается на трудных негативах. Слишком малая τ делает обучение жёстким к «ложным»
    негативам: подходящий документ, случайно оказавшийся в батче, штрафуется почти как настоящий неверный. В E5 τ =
    0.01, в SimCSE 0.05, у CLIP τ обучается.
  source: course
- id: contrastive-false-negatives-01
  topic: embeddings
  tasks: [B19-infonce, B20-mini-search]
  difficulty: medium
  kind: open
  question: "Что такое ложные негативы в in-batch контрастивном обучении и как с ними борются?"
  answer: >
    In-batch схема считает негативом каждый чужой документ батча. Но среди них может оказаться документ, который тоже
    отвечает на запрос: дубль, тот же абзац в другой формулировке, соседний кусок того же текста. Лосс отталкивает от
    него запрос, и модель учится различать то, что различать не нужно. Чем больше батч и меньше τ, тем больнее. Борются
    так: дедуплицируют данные и не кладут в один батч куски одного документа; фильтруют пары (у E5 — consistency
    filter: из 1.3 млрд пар оставили ≈ 270 млн тех, что сама модель ставит в top-2 среди миллиона случайных); маскируют
    в логитах известные дубли; дистиллируют мягкие оценки cross-encoder'а (E5, этап дообучения).
  source: course
- id: contrastive-symmetric-01
  topic: embeddings
  tasks: [B19-infonce]
  difficulty: easy
  kind: open
  question: "Чем симметричный InfoNCE отличается от обычного и когда его используют?"
  answer: >
    Обычный считает cross-entropy по строкам матрицы S = Q Dᵀ / τ: запрос выбирает свой документ среди документов
    батча. Симметричный добавляет CE по столбцам, где документ выбирает свой запрос среди запросов, и берёт среднее.
    Его используют, когда стороны пары равноправны (CLIP: картинка и подпись; пары парафраз) или когда обе стороны
    потом будут запросами. Для поиска «короткий запрос → длинный документ» часто хватает одного направления.
  source: course
