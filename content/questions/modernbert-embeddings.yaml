# Вопросы курса к блоку B, модуль 4 (ModernBERT и эмбеддинги текста): слой ModernBERT, unpadding, sentence-эмбеддинги,
# контрастивное обучение, мини-поиск. Ответы написаны авторами курса. Квиз B-Q4 собирает весь файл.
- id: modernbert-layer-diff-01
  topic: architecture
  tasks: [B16-modernbert-layer]
  difficulty: easy
  kind: open
  question: "Что ModernBERT взял у современных декодеров и что в нём осталось от BERT?"
  answer: >
    От декодеров: RoPE вместо таблицы позиций, GeGLU вместо обычного FFN, Pre-LN с финальной нормой, линейные слои и
    нормы без bias, чередование локального attention (окно) и глобального. От BERT: двунаправленное внимание, цель
    MLM (без NSP, как у RoBERTa), спецтокены [CLS] / [SEP] / [MASK] и MLM-голова со связанной матрицей. Окно у
    ModernBERT симметричное, ±64 токена, а не «только назад», как в Gemma или Mistral.
  source: course
- id: modernbert-layer-window-01
  topic: attention
  tasks: [B16-modernbert-layer]
  difficulty: medium
  kind: mcq
  question: "У ModernBERT-base local_attention = 128, global_attn_every_n_layers = 3. Сколько ключей видит запрос в середине длинного текста в слое 4?"
  options:
    - "128"
    - "129"
    - "все 8192: слой 4 глобальный"
    - "65"
  correct: 1
  answer: >
    Глобальные слои — 0, 3, 6, …, так что слой 4 локальный. Окно 128 — это ширина в обе стороны, по 64: условие
    |i − j| ≤ 64 даёт 64 ключа слева, сам токен и 64 справа, всего 129. Ответ 65 верен только у края текста.
  source: course
- id: modernbert-layer-theta-01
  topic: positional-encoding
  tasks: [B16-modernbert-layer]
  difficulty: medium
  kind: open
  question: "Почему у глобальных слоёв ModernBERT θ RoPE = 160 000, а у локальных — 10 000?"
  answer: >
    θ задаёт самую медленную частоту RoPE. Чем больше θ, тем дольше самые медленные пары не делают полного оборота,
    и тем лучше модель различает далёкие позиции. Глобальный слой смотрит на весь контекст 8192, ему нужен большой
    θ (тот же приём, что у Llama 3 с θ = 500 000). Локальный слой видит не дальше 64 токенов: различать дальние
    позиции ему не нужно, и обычных 10 000 хватает. Так в одной модели две θ, своя у каждого типа слоя.
  source: course
- id: modernbert-layer-finfo-01
  topic: attention
  tasks: [B16-modernbert-layer]
  difficulty: medium
  kind: code-reading
  question: >
    В локальном слое закрытые ключи заполнены так: scores.masked_fill(~mask, float("-inf")). На батче с длинным
    паддингом весь выход модели — nan, хотя без паддинга всё работает. Почему?
  answer: >
    PAD-запрос в конце длинного хвоста видит в своём окне ±64 только PAD-ключи, и все они закрыты. Его строка scores
    целиком −inf, softmax даёт 0/0 = nan. В следующем слое этот nan оказывается в ключах и значениях PAD-позиций. Маска
    закрывает их в scores, но веса 0 умножаются на v = nan, а 0 · nan = nan, и nan расходится по всем токенам.
    Лечится заполнением torch.finfo(dtype).min: строка без видимых ключей даёт равномерные веса, но конечные. Другой
    способ — обнулять выходы PAD-позиций или вообще убрать PAD (unpadding, B17).
  source: course
- id: modernbert-layer-noprenorm-01
  topic: architecture
  tasks: [B16-modernbert-layer]
  difficulty: easy
  kind: open
  question: "Почему у первого слоя ModernBERT attn_norm = Identity?"
  answer: >
    Эмбеддинги ModernBERT сразу проходят через LayerNorm, так что вход слоя 0 уже нормирован. Вторая норма подряд
    ничего не добавила бы, кроме лишнего вектора весов. В остальных слоях вход attention — сумма остатков, и норма
    перед подслоем нужна (Pre-LN).
  source: course
- id: unpadding-why-01
  topic: efficiency
  tasks: [B17-unpadding]
  difficulty: easy
  kind: open
  question: "Что такое unpadding (упаковка батча) и что он экономит?"
  answer: >
    Вместо батча [B, T], где короткие тексты дополнены PAD, настоящие токены всех текстов кладутся подряд в одну
    строку [N], а границы текстов хранятся в cu_seqlens = [0, L₀, L₀ + L₁, …, N]. Линейные слои, нормы и FFN
    обрабатывают N токенов вместо B·T. Attention с ядром varlen (Flash Attention) считает только диагональные блоки:
    Σ L² пар вместо B·T². Чем сильнее разброс длин в батче, тем больше выигрыш. Если один текст длиной 512, а остальные
    около 80, на паддинг уходит около трёх четвертей работы.
  source: course
- id: unpadding-positions-01
  topic: positional-encoding
  tasks: [B17-unpadding]
  difficulty: medium
  kind: mcq
  question: "Батч упакован: тексты длины 3 и 2 идут подряд. Какие позиции RoPE нужны пяти токенам упаковки?"
  options:
    - "0 1 2 3 4"
    - "0 1 2 0 1"
    - "1 2 3 1 2"
    - "любые: RoPE относительный, сдвиг всех позиций ничего не меняет"
  correct: 1
  answer: >
    Позиции у каждого текста начинаются с нуля: 0 1 2 | 0 1. Скалярное произведение после RoPE зависит только от
    разности позиций внутри текста, поэтому сдвинуть все позиции одного текста на константу можно, и scores не
    изменятся. Но 0 1 2 3 4 — не такой сдвиг: в единой нумерации второй текст начинается с позиции 3, а для модели это
    уже другой вход, чем тот же текст в батче с паддингом. Например, пропадает связь «позиция 0 = [CLS]», а при
    абсолютных позициях BERT ответ поменялся бы явно. Значит, надёжно — позиции с нуля у каждого текста.
  source: course
- id: unpadding-mask-01
  topic: attention
  tasks: [B17-unpadding, B17d-cu-seqlens-debug]
  difficulty: medium
  kind: code-reading
  question: >
    Номер текста для токена упаковки считают так: seq_id = (pos[:, None] > cu_seqlens[None, 1:]).sum(-1), затем
    mask = seq_id[:, None] == seq_id[None, :]. Что не так и как это проявится?
  answer: >
    cu_seqlens[b + 1] — граница «после последнего токена» текста b, то есть это индекс первого токена текста b + 1.
    Токен n лежит в тексте b, если позади него ровно b концов, и сравнивать надо нестрого: pos ≥ cu. Со строгим «>»
    первый токен каждого текста (кроме нулевого) попадает в предыдущий текст. Он смотрит на чужой текст, а чужой
    текст смотрит на него. Формы и cu_seqlens верны, на батче из одного текста всё совпадает. Ошибку видно только по
    сравнению с батчем с паддингом или по тому, что эмбеддинг текста зависит от соседей по батчу.
  source: course
- id: unpadding-packing-sft-01
  topic: training
  tasks: [B17-unpadding]
  difficulty: medium
  kind: open
  question: "При обучении декодера короткие примеры склеивают в одну строку (packing). Что сломается, если не передать cu_seqlens (или position_ids) в attention?"
  answer: >
    Causal-маска на склеенной строке разрешит токенам второго примера смотреть на весь первый пример. Модель учится
    продолжать текст с учётом чужого, несвязанного примера, то есть получает перекрёстное загрязнение контекста. А
    позиции второго примера начинаются не с нуля, и при длинных строках модель видит позиции, которых на инференсе у
    короткого запроса не бывает. С cu_seqlens (или position_ids, по которым ядро восстанавливает границы) attention
    считается блочно-диагонально, и результат совпадает с обучением на отдельных примерах. Экономия от packing
    при этом сохраняется.
  source: course
