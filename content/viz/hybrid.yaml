id: hybrid
title: "Гибридные стеки: расписание слоёв и память по длине контекста"
description: >
  Полоса слоёв Llama 3 / Gemma 3 / Qwen3-Next (full, sliding, Gated DeltaNet) и кривая памяти инференса
  для одной и той же геометрии Qwen3-Next: все слои full, SWA 5 : 1 (слайдер окна) и гибрид 3 : 1.
  Видно, где гибрид начинает выигрывать (после 512 токенов) и к чему стремится (¼ от «все full»).
