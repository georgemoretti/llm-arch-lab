# Вопросы на понимание статей блока A. Ответы — пересказ идей своими словами, без цитат из статей.
- id: paper-backprop-hidden-01
  topic: autograd
  tasks: [A-P1-backprop]
  difficulty: medium
  kind: open
  question: "Rumelhart et al., 1986: какую проблему скрытых слоёв решает обратное распространение ошибки?"
  answer: >
    Для выходных нейронов ясно, каким должен быть ответ, а для скрытых — нет: никто не говорит, какие признаки им
    представлять. Старые правила обучения (перцептрон, дельта-правило) меняли только веса, для которых известна
    желаемая активация. Backprop выводит «ошибку» скрытого нейрона из ошибок следующего слоя по chain rule: это
    производная общего лосса по его активации. В результате все веса обучаются одной процедурой градиентного
    спуска, а скрытые нейроны сами находят полезные внутренние представления.
  source: course
- id: paper-backprop-init-01
  topic: autograd
  tasks: [A-P1-backprop]
  difficulty: easy
  kind: open
  question: "Почему веса нейросети инициализируют маленькими случайными числами, а не нулями?"
  answer: >
    Если все веса одинаковые (например, нули), нейроны одного слоя считают одно и то же и получают одинаковые
    градиенты. После каждого шага они остаются копиями друг друга, и слой из H нейронов работает как один. Случайная
    инициализация нарушает эту симметрию. Веса берут маленькими, чтобы сигмоиды и tanh не насыщались с первого шага.
    Как подобрать масштаб точнее, разберём в модуле 2 (Xavier/Kaiming).
  source: course
- id: paper-backprop-momentum-01
  topic: training
  tasks: [A-P1-backprop]
  difficulty: medium
  kind: open
  question: "Какое дополнительное слагаемое кроме −ε·∂E/∂w стоит в правиле обновления весов в статье 1986 года и зачем оно?"
  answer: >
    Слагаемое, пропорциональное предыдущему изменению веса: Δw(t) = −ε ∂E/∂w + α Δw(t−1). Это momentum. Шаг
    накапливает скорость в направлениях, где градиент стабильно одного знака, и гасит колебания там, где знак
    скачет, например поперёк узкого оврага функции потерь. Тот же приём живёт в SGD с momentum и в первом моменте
    Adam.
  source: course
- id: paper-autodiff-kinds-01
  topic: autograd
  tasks: [A-P1-backprop]
  difficulty: medium
  kind: open
  question: "Чем автоматическое дифференцирование отличается от численного и от символьного?"
  answer: >
    Численное дифференцирование (конечные разности, A02) приближённое, требует O(n) вызовов функции и страдает от
    ошибок округления. Символьное строит формулу производной. Выражения при этом разрастаются, и ему нужна функция
    в замкнутом виде, без циклов и ветвлений. AD применяет chain rule к последовательности элементарных операций,
    которые реально выполнились в программе. Результат точный до округления, работают любые циклы и условия, а
    стоимость — небольшая константа от стоимости самой функции.
  source: course
- id: paper-autodiff-cost-01
  topic: autograd
  tasks: [A-P1-backprop]
  difficulty: hard
  kind: open
  question: "Сколько стоит градиент в обратном режиме AD по времени и по памяти, если f: Rⁿ → R?"
  answer: >
    По времени — небольшое постоянное число вычислений f, не зависящее от n. Обратный проход повторяет граф в
    обратную сторону, и на каждую операцию приходится несколько операций с локальными производными. По памяти —
    пропорционально длине вычисления: нужно сохранить промежуточные значения прямого прохода (tape / граф), потому
    что от них зависят локальные производные. Прямой режим, наоборот, почти не требует памяти, но за проход даёт
    производную только по одному входу, то есть нужно n проходов.
  source: course
