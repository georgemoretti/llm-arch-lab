# Вопросы к статьям блока B (энкодеры). Модуль 1: Sutskever et al. 2014, Bahdanau et al. 2014, Vaswani et al. 2017
# (энкодер-декодер, регуляризация). Ответы написаны авторами курса.
- id: paper-seq2seq-bottleneck-01
  topic: architecture
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какое «бутылочное горлышко» было у seq2seq на RNN (Sutskever et al., 2014) и как его обходили в самой статье?"
  answer: >
    Энкодер-LSTM сжимает всё предложение в один вектор состояния фиксированного размера, и декодер разворачивает
    перевод только из него. Чем длиннее фраза, тем больше теряется. Авторы заметили, что подача исходного
    предложения в обратном порядке заметно улучшает качество: первые слова источника оказываются ближе к первым
    словам перевода, и зависимости становятся короче. Это обход, а не решение: вектор всё равно один.
  source: course
- id: paper-bahdanau-attention-01
  topic: attention
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Что предложили Bahdanau et al. (2014) и чем их attention отличается от scaled dot-product attention Transformer?"
  answer: >
    Декодер на каждом шаге строит свой вектор контекста — взвешенную сумму состояний энкодера по всем позициям,
    веса — softmax от оценок «насколько позиция источника подходит текущему шагу». Это убрало бутылочное горлышко
    одного вектора и дало выравнивание слов как побочный продукт. Оценка у них аддитивная: маленькая сеть
    vᵀ tanh(W s + U h). В Transformer — скалярное произведение q·k/√d: быстрее (матричное умножение) и при правильном
    масштабе не хуже. И главное: у Bahdanau attention — добавка к RNN, а в Transformer рекуррентности нет вовсе.
  source: course
- id: paper-aiayn-three-attentions-01
  topic: attention
  tasks: [B-P1-seq2seq-attention]
  difficulty: easy
  kind: open
  question: "Какие три применения multi-head attention описывает §3.2.3 статьи Transformer?"
  answer: >
    Cross-attention «энкодер-декодер»: запросы из предыдущего слоя декодера, ключи и значения — из выхода энкодера,
    каждая позиция декодера видит весь источник. Self-attention энкодера: Q, K, V из предыдущего слоя энкодера, каждая
    позиция видит все. Self-attention декодера: то же, но позиция видит только себя и прошлое — запрещённые связи
    получают −∞ до softmax. В задачах B01, B03 и B04 это три маски: padding, causal + padding, padding источника.
  source: course
- id: paper-aiayn-regularization-01
  topic: training
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какие два способа регуляризации использует Transformer (§5.4) и какой из них ухудшает перплексию?"
  answer: >
    Residual dropout: dropout на выходе каждого подслоя перед сложением с остатком и на сумме эмбеддингов и позиций
    (P = 0.1 у базовой модели). И label smoothing с ε = 0.1: он делает модель менее уверенной и потому ухудшает
    перплексию, но улучшает точность и BLEU. В курсе dropout выключен (детерминированные тесты), label smoothing
    реализован в B05.
  source: course
- id: paper-aiayn-shared-embeddings-01
  topic: embeddings
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какие матрицы весов Transformer делит между собой (§3.4) и что для этого нужно от токенизации?"
  answer: >
    Одна матрица служит эмбеддингом входа энкодера, эмбеддингом входа декодера и (транспонированной) матрицей
    выходного слоя перед softmax; в слоях эмбеддингов её умножают на √d_model. Чтобы источник и цель могли делить
    одну таблицу, у них должен быть общий словарь: для англо-немецкого перевода — общий BPE примерно на 37 тысяч
    токенов. Так экономятся параметры, а одинаковые подслова (имена, числа) в двух языках получают одно
    представление.
  source: course
# Модуль 2: BERT (Devlin et al. 2018), RoBERTa (Liu et al. 2019).
- id: paper-bert-pretraining-01
  topic: training
  tasks: [B-P2-bert-roberta]
  difficulty: medium
  kind: open
  question: "Какие две задачи предобучения были у BERT и на каких данных его учили?"
  answer: >
    Masked LM (15 % токенов, схема 80/10/10) и Next Sentence Prediction: для пары сегментов предсказать, идёт ли B
    сразу за A в тексте (50 % — настоящая следующая часть, 50 % — случайная из корпуса); NSP решается по pooled-выходу
    [CLS]. Данные — BooksCorpus (около 800 млн слов) и английская Википедия (около 2.5 млрд слов, только текст статей).
    Важно брать документы целиком, а не перемешанные предложения, чтобы были длинные связные последовательности.
  source: course
- id: paper-bert-sizes-01
  topic: architecture
  tasks: [B-P2-bert-roberta]
  difficulty: easy
  kind: open
  question: "Чем отличаются BERT-base и BERT-large и почему base имеет размер GPT-1?"
  answer: >
    BERT-base: 12 слоёв, hidden 768, 12 голов, ~110 М параметров. BERT-large: 24 слоя, hidden 1024, 16 голов, ~340 М.
    Размер base выбран равным OpenAI GPT, чтобы честно сравнить двунаправленный энкодер с однонаправленным декодером при
    том же числе параметров. На всех задачах GLUE large лучше base, даже на маленьких датасетах.
  source: course
- id: paper-bert-ablation-01
  topic: training
  tasks: [B-P2-bert-roberta]
  difficulty: medium
  kind: open
  question: "Что показали абляции статьи BERT про NSP и направленность модели (раздел 5.1)?"
  answer: >
    Без NSP качество падало на задачах с парами (QNLI, MNLI, SQuAD). Модель «слева направо» без NSP была заметно хуже
    на всех задачах, особенно на SQuAD, где важен правый контекст; добавление BiLSTM сверху помогало частично. Вывод
    авторов: главное — глубокая двунаправленность через MLM. Позже RoBERTa показала, что выигрыш от NSP связан с
    форматом входа, а сама задача не нужна.
  source: course
- id: paper-roberta-changes-01
  topic: training
  tasks: [B-P2-bert-roberta]
  difficulty: medium
  kind: open
  question: "Что изменила RoBERTa по сравнению с BERT, не трогая архитектуру?"
  answer: >
    Убрала NSP и подаёт полные последовательности из подряд идущих предложений (до 512 токенов); маска выбирается
    динамически; батчи больше (8 тысяч последовательностей); данных в ~10 раз больше (160 ГБ: книги, Википедия,
    новости CC-News, OpenWebText, Stories); обучение дольше; словарь — byte-level BPE на 50 тысяч, как у GPT-2. Вывод
    статьи: BERT был сильно недообучен, и рецепт обучения важен не меньше архитектуры.
  source: course
- id: paper-roberta-nsp-01
  topic: training
  tasks: [B-P2-bert-roberta]
  difficulty: hard
  kind: open
  question: "Почему RoBERTa отказалась от NSP, хотя абляции BERT говорили, что NSP помогает?"
  answer: >
    В абляции BERT без NSP менялся и формат входа: модель обучали на парах коротких сегментов. RoBERTa развела эти
    эффекты: сравнила пары сегментов с NSP, пары предложений с NSP, полные последовательности без NSP (FULL-SENTENCES)
    и куски одного документа без NSP (DOC-SENTENCES). Варианты без NSP на длинных последовательностях оказались не хуже
    или лучше. Значит, пользу давали длинные связные входы, а сама задача NSP слишком лёгкая (часто решается по теме) и
    не нужна.
  source: course
# Модуль 3: дистилляция (Hinton et al. 2015), DistilBERT (Sanh et al. 2019), T5 (Raffel et al. 2019).
- id: paper-hinton-dark-knowledge-01
  topic: training
  tasks: [B-P3-distil-t5]
  difficulty: medium
  kind: open
  question: "Какой опыт с MNIST в статье Hinton et al. (2015) показывает, что мягкие метки переносят знание, которого нет в данных ученика?"
  answer: >
    Из набора, на котором учился ученик, убрали все примеры цифры 3 и дистиллировали его по мягким меткам учителя.
    Ученик ни разу не видел тройку, но на тесте ошибся только на 133 тройках из 1010. Большая часть ошибок — из-за
    слишком низкого bias класса 3; после его поправки ученик распознал 98.6 % троек. О том, как выглядит 3, он узнал
    из вероятностей, которые учитель давал тройке на других цифрах. Вывод: в распределении по неправильным классам
    закодировано сходство классов, и дистилляция его передаёт.
  source: course
- id: paper-hinton-ensemble-01
  topic: training
  tasks: [B-P3-distil-t5]
  difficulty: hard
  kind: open
  question: "Зачем в статье Hinton et al. дистилляция ансамбля и что такое «модели-специалисты»?"
  answer: >
    Ансамбль из многих моделей точнее одной, но дорог на инференсе. Дистилляция переносит его качество в одну модель
    того же размера: на распознавании речи одиночный ученик получил больше 80 % прироста точности, который давал
    ансамбль из 10 моделей. Специалисты — вторая идея статьи: для огромного числа классов (JFT, 100 млн картинок,
    15 000 классов) вместо полного ансамбля к общей модели добавляют много «специалистов» по группам легко путаемых
    классов. Специалист различает только свои классы и один класс «всё остальное», а начинает с весов общей модели.
    Главная беда специалистов — они легко переобучаются, и авторы предлагают лечить это мягкими метками.
  source: course
- id: paper-distilbert-ablation-01
  topic: training
  tasks: [B-P3-distil-t5]
  difficulty: medium
  kind: open
  question: "Какие части лосса и инициализации DistilBERT важнее всего по абляции статьи?"
  answer: >
    Абляция (таблица 4 статьи), изменение среднего балла GLUE: случайная инициализация вместо слоёв учителя — −3.69,
    без дистилляционного лосса L_ce — −2.96, без cosine-loss — −1.46, без MLM — всего −0.31. Ключевое — знание
    учителя: в инициализации и в двух дистилляционных лоссах. Обычная MLM-цель почти ничего не добавляет.
  source: course
- id: paper-t5-design-01
  topic: architecture
  tasks: [B-P3-distil-t5]
  difficulty: medium
  kind: open
  question: "Какие архитектуры сравнивали авторы T5 и почему выбрали энкодер-декодер?"
  answer: >
    Сравнивали энкодер-декодер, языковую модель (только декодер, causal-маска) и prefix LM (декодер, где по префиксу
    внимание двунаправленное). Энкодер-декодер с L + L слоями имеет примерно столько же параметров, сколько декодер на
    2L слоёв, а вычислений — как декодер на L слоёв: энкодер обрабатывает только вход, декодер — только выход, а слои
    LM проходят по обоим. С denoising-целью энкодер-декодер оказался лучшим; вариант с общими параметрами энкодера и
    декодера — чуть хуже, но лучше prefix LM. Вывод сделан для схемы «предобучение + дообучение под задачу».
  source: course
- id: paper-t5-c4-01
  topic: training
  tasks: [B-P3-distil-t5]
  difficulty: easy
  kind: open
  question: "Что такое C4 и как его фильтровали?"
  answer: >
    Colossal Clean Crawled Corpus — около 750 ГБ английского текста из Common Crawl (апрель 2019), очищенного
    эвристиками: оставить строки, которые кончаются знаком конца предложения и содержат не меньше 5 слов; выкинуть
    страницы короче 3 предложений, страницы со словами из списка нецензурных, с фигурной скобкой (код) и с «lorem
    ipsum»; убрать строки про JavaScript и про cookie / privacy policy; из повторяющихся кусков в три предложения
    оставить один; оставить только страницы, которые langdetect считает английскими с вероятностью ≥ 0.99. В разделе 3.4
    показано, что чистка помогает, а многократный повтор маленького набора данных вредит.
  source: course
- id: paper-t5-scaling-01
  topic: training
  tasks: [B-P3-distil-t5]
  difficulty: medium
  kind: open
  question: "Если вычислений в 4 раза больше, как их лучше потратить — по выводам раздела 3.6 статьи T5?"
  answer: >
    Сравнивали: учить в 4 раза дольше, батч в 4 раза больше, модель вдвое больше и вдвое дольше, модель вчетверо
    больше, ансамбль из 4 отдельно предобученных моделей (и дешёвый вариант: 4 дообучения одной предобученной). Всё
    помогало. «Дольше» и «больший батч» дали примерно одинаково, увеличение модели — заметно больше; «2× модель на 2×
    шагов» и «4× модель» почти не различались. Ансамбль — отдельный, дополняющий способ: на CNN/DM и WMT En-De / En-Ro
    ансамбль 4 моделей обогнал все остальные варианты. Итоговые модели T5 масштабируют и размер, и обучение, вплоть до
    T5-11B.
  source: course
# Модуль 4: Sentence-BERT (Reimers, Gurevych 2019), DPR (Karpukhin et al. 2020), E5 (Wang et al. 2022), ModernBERT
# (Warner et al. 2024).
- id: paper-sbert-objective-01
  topic: embeddings
  tasks: [B-P4-sbert-modernbert-e5]
  difficulty: medium
  kind: open
  question: "Как Sentence-BERT обучали на NLI и почему на инференсе классификатор выбрасывают?"
  answer: >
    Два предложения независимо проходят через один и тот же BERT (сиамская сеть), из выходов берут mean pooling —
    векторы u и v. Для обучения на SNLI + MultiNLI (≈ 570 тыс. + 430 тыс. пар) поверх них ставили softmax-
    классификатор на три класса (entailment / neutral / contradiction) по склейке (u, v, |u − v|). Одна эпоха, батч 16,
    Adam 2e-5 с прогревом на 10 % данных. Классификатор нужен только как задача, которая заставляет векторы похожих
    по смыслу предложений сближаться. На инференсе сравнивают сами u и v косинусом. По абляции (раздел 6) важнее всего
    компонента |u − v|, а добавление u ∗ v, как в InferSent, качество даже ухудшало.
  source: course
- id: paper-sbert-raw-bert-01
  topic: embeddings
  tasks: [B-P4-sbert-modernbert-e5, B18-sentence-embeddings]
  difficulty: easy
  kind: open
  question: "Что показала таблица 1 статьи Sentence-BERT про эмбеддинги «голого» BERT?"
  answer: >
    На семи STS-задачах (корреляция Спирмена между косинусом и оценкой людей) вектор [CLS] голого BERT дал в среднем
    около 29, среднее его выходов — около 55, а простое среднее эмбеддингов GloVe — около 61. Голый BERT оказался хуже
    усреднения статических векторов слов. SBERT, обученный на NLI, дал около 75. Вывод: MLM-предобучение не делает
    пространство выходов пригодным для косинуса, нужна отдельная (контрастивная или сиамская) донастройка.
  source: course
- id: paper-sbert-smart-batching-01
  topic: inference
  tasks: [B-P4-sbert-modernbert-e5, B17-unpadding]
  difficulty: medium
  kind: open
  question: "Что такое smart batching из раздела 7 Sentence-BERT и как он связан с unpadding в ModernBERT?"
  answer: >
    Smart batching: перед кодированием предложения сортируют по длине и режут на батчи из похожих по длине текстов.
    Тогда паддинг в каждом батче минимален, и меньше работы тратится на PAD. В статье это ускорило SBERT на 89 % на CPU
    и на 48 % на GPU. Unpadding (B17) решает ту же проблему радикальнее: PAD убирают вовсе, тексты склеивают в одну
    строку с cu_seqlens, и сортировка не нужна. Этот выигрыш виден в таблице скоростей ModernBERT на входах разной
    длины. Сортировка по длине всё ещё полезна и для unpadding: она выравнивает число токенов в батчах.
  source: course
- id: paper-dpr-negatives-01
  topic: embeddings
  tasks: [B-P4-sbert-modernbert-e5, B19-infonce]
  difficulty: medium
  kind: open
  question: "Какие негативы сравнивали в DPR и какой рецепт выбрали?"
  answer: >
    Три вида: случайные абзацы корпуса, абзацы из выдачи BM25 (содержат слова вопроса, но не ответ) и «gold» —
    правильные абзацы других вопросов. Трюк in-batch: правильные абзацы остальных вопросов батча служат негативами
    бесплатно, так что из батча B получается B² пар почти без дополнительных вычислений. Лучший вариант — in-batch
    (батч 128) плюс один BM25-негатив на вопрос. Score — скалярное произведение без нормировки и температуры, лосс —
    отрицательное лог-правдоподобие позитива. Итог: на top-20 DPR обогнал BM25 на 9–19 пунктов, а обогнать BM25
    удалось уже при обучении на тысяче примеров.
  source: course
- id: paper-e5-ccpairs-01
  topic: embeddings
  tasks: [B-P4-sbert-modernbert-e5]
  difficulty: medium
  kind: open
  question: "Как собирали и чистили CCPairs для E5 и зачем нужен consistency-based фильтр?"
  answer: >
    Пары собирали автоматически: Reddit (пост — комментарий), Stack Exchange (вопрос — принятый ответ), Википедия
    (сущность и раздел — абзац), научные статьи (название — аннотация, цитирования), Common Crawl и новости (заголовок —
    текст). После эвристик осталось около 1.3 млрд шумных пар. Потом на них обучили модель и оставили только пары, где
    модель ставит свой документ в top-2 среди миллиона случайных: около 270 млн. Идея — сеть сначала запоминает чистые
    закономерности, а шум выучивает позже, поэтому её ранжирование отделяет плохие пары. Предобучение: батч 32 768,
    in-batch негативы, τ = 0.01, префиксы «query:» и «passage:». По абстракту, это первая модель, которая без
    размеченных данных обогнала BM25 на BEIR.
  source: course
- id: paper-e5-prefix-01
  topic: embeddings
  tasks: [B-P4-sbert-modernbert-e5]
  difficulty: easy
  kind: mcq
  question: "Зачем E5 добавляет к входам префиксы «query: » и «passage: », если энкодер у них общий?"
  options:
    - "чтобы токенизатор не путал регистр"
    - "чтобы одна модель кодировала запрос и документ по-разному: задача поиска асимметрична"
    - "чтобы уложиться в 512 токенов"
    - "это нужно только для классификации"
  correct: 1
  answer: >
    Одна сеть кодирует обе стороны, и без меток вектор запроса и вектор его парафраза в корпусе были бы почти
    одинаковы. Тогда поиск находил бы похожие вопросы, а не ответы. Префикс ломает симметрию: модель знает, что
    кодирует (короткий запрос или абзац-ответ), и может представлять их по-разному. Авторы пишут, что это важно для
    задач, где в корпусе есть парафразы запроса. Для пар без ясного «запроса» сторону выбирали случайно, а для
    кластеризации и STS используют префикс «query: ».
  source: course
- id: paper-modernbert-recipe-01
  topic: training
  tasks: [B-P4-sbert-modernbert-e5, B16-modernbert-layer]
  difficulty: medium
  kind: open
  question: "Чем рецепт предобучения ModernBERT отличается от BERT, кроме архитектуры?"
  answer: >
    Данных намного больше: 2 трлн токенов, в основном английский веб, код и научные тексты (у BERT — около 3.3 млрд слов
    книг и Википедии). Токенизатор — современный BPE на основе токенизатора OLMo, словарь 50 368 (кратен 64) с теми же
    спецтокенами, что у BERT. Цель — только MLM, без NSP, и маскируют 30 % токенов, а не 15 %. Оптимизатор — StableAdamW,
    расписание трапециевидное (warmup — константа — спад 1 − √). Последовательности упакованы (sequence packing) поверх
    unpadding. Контекст удлиняют в конце: 1.7 трлн токенов при длине 1024 и θ = 10 000, затем θ глобальных слоёв 160 000,
    длина 8192 и ещё 300 млрд токенов.
  source: course
- id: paper-modernbert-speed-01
  topic: inference
  tasks: [B-P4-sbert-modernbert-e5, B17-unpadding]
  difficulty: medium
  kind: open
  question: "За счёт чего ModernBERT быстрее других энкодеров на длинных входах и на входах разной длины?"
  answer: >
    На длинных входах помогает локальное attention: в двух слоях из трёх запрос видит 128 ключей, а не 8192, и
    квадратичная часть почти исчезает. ModernBERT-base обрабатывал документы длиной 8192 в 2.65 раза быстрее
    следующего по скорости энкодера своего размера. На входах разной длины главное — unpadding по всей модели: PAD
    удаляют до эмбеддингов, а Flash Attention считает attention по cu_seqlens. Плюс Flash Attention 2/3 и
    torch.compile, и форма модели («глубокая и узкая», размеры кратны тайлам GPU) подобрана под типичные GPU для
    инференса. На коротких входах фиксированной длины 512 оригинальный BERT всё ещё быстрее: он мельче.
  source: course
