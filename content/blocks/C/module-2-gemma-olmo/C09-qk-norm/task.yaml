questions: [qk-norm-*]
# Источники: Olmo2Attention (modeling_olmo2.py): q_norm = RMSNorm(num_attention_heads * head_dim),
# k_norm = RMSNorm(num_key_value_heads * head_dim), применяются к выходу q_proj/k_proj до view и RoPE.
# config.json allenai/OLMo-2-1124-7B: num_attention_heads = 32, num_key_value_heads = 32 (MHA),
# hidden_size = 4096, rope_theta = 500 000.
viz: [qk-norm]
arch:
  olmo-2:
    attention: "MHA (7B: 32 / 32 головы) + QK-Norm по всей проекции q и k до RoPE"
    position: "RoPE, θ = 500 000, во всех слоях"
