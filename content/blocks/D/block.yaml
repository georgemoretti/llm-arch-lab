id: D
title: "После предобучения: дообучение, выравнивание, быстрый инференс"
description: >
  Блоки A–C заканчиваются предобученной моделью: она продолжает текст, но не отвечает на вопросы, не держит формат и
  медленно генерирует. Блок D проходит путь от такой модели до ассистента в проде: SFT на диалогах, дешёвое
  дообучение (LoRA) и квантизация, выравнивание по предпочтениям (reward model, DPO) и RL с проверяемой наградой
  (GRPO), быстрый инференс (батчи, speculative decoding, paged KV-cache, continuous batching). Опирается на модель
  Llama-типа из C06, KV-cache из C05, сэмплирование из C25a и цикл обучения из A09.
modules:
  - id: module-1-sft
    title: "SFT: от продолжения текста к диалогу"
    description: "Chat-шаблон, маска лосса только на ответе, упаковка диалогов, накопление градиентов, SFT игрушечной модели."
baselines:
  pretrained-lm:
    title: "Предобученная модель (base)"
    path: llmlab/core/model.py
    description: >
      Модель после предобучения на сыром тексте (C06, C25, A18): предсказывает следующий токен любого текста. Ролей,
      ходов диалога и места, где нужно остановиться, она не знает. Лосс — по всем токенам подряд.
