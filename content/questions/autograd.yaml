# Вопросы курса к блоку A, модуль 1 (Autograd): Value, проверка градиентов, MLP на скалярах,
# backprop по тензорам, backward LayerNorm. Ответы написаны авторами курса. Квиз A-Q1 собирает весь файл.
- id: autograd-reverse-mode-01
  topic: autograd
  tasks: [A01-value]
  difficulty: medium
  kind: open
  question: "Почему в нейросетях используют обратный режим автодифференцирования (reverse mode), а не прямой (forward mode)?"
  answer: >
    Прямой режим за один проход даёт производные всех выходов по одному входу. Обратный режим за один проход
    даёт производные одного выхода по всем входам. У нейросети выход один (скалярный лосс), а входов-параметров
    миллионы. Поэтому обратный режим получает весь градиент примерно за стоимость одного прямого прохода, а
    прямому понадобилось бы столько проходов, сколько параметров. Цена обратного режима — память: нужно хранить
    промежуточные значения прямого прохода до обратного.
  source: course
- id: autograd-accumulate-01
  topic: autograd
  tasks: [A01-value, A01d-value-debug]
  difficulty: easy
  kind: mcq
  question: "Узел x используется в двух операциях: y = x·x + x. Что происходит с x.grad при обратном проходе?"
  options:
    - "Берётся вклад последней обработанной операции"
    - "Вклады всех операций, где участвует x, складываются: 2x + 1"
    - "Вклады перемножаются"
    - "Берётся максимум из вкладов"
  correct: 1
  answer: >
    Складываются. Это многомерный chain rule: малое изменение x влияет на выход по всем путям сразу, и полная
    производная — сумма производных по путям. Поэтому в коде grad += …, а PyTorch по той же причине копит
    градиенты в .grad между вызовами backward, пока их не обнулят.
  source: course
- id: autograd-topo-01
  topic: autograd
  tasks: [A01-value]
  difficulty: medium
  kind: open
  question: "Зачем обратному проходу топологическая сортировка? Что сломается, если обходить граф в произвольном порядке?"
  answer: >
    Узел передаёт вклад своим входам по формуле локальная производная × его собственный grad. Этот grad должен
    быть полным, то есть все потребители узла уже должны были отдать ему свои вклады. Обратный топологический
    порядок (каждый узел после всех, кто его использует) это гарантирует. При произвольном порядке узел
    может раздать вклады, пока его градиент ещё неполный. Тогда опоздавшие вклады до входов уже не дойдут, и
    градиенты получатся заниженными или неверными.
  source: course
- id: autograd-memory-01
  topic: autograd
  tasks: [A01-value]
  difficulty: medium
  kind: open
  question: "Почему обучение требует намного больше памяти, чем инференс той же модели?"
  answer: >
    Для обратного прохода нужны значения прямого прохода: локальные производные зависят от входов операций
    (у умножения — от другого множителя, у tanh — от результата). Поэтому autograd хранит активации всех
    слоёв до конца backward. При инференсе их можно выбрасывать сразу после использования. К этому добавляются
    градиенты и состояния оптимизатора (у Adam — два буфера на каждый параметр). Gradient checkpointing
    экономит память, пересчитывая часть активаций при обратном проходе.
  source: course
- id: autograd-relu-zero-01
  topic: autograd
  tasks: [A01-value]
  difficulty: easy
  kind: mcq
  question: "У ReLU нет производной в нуле. Что делают autograd-фреймворки, например PyTorch?"
  options:
    - "Выбрасывают ошибку"
    - "Возвращают NaN"
    - "Берут одну из односторонних производных по соглашению — в PyTorch это 0"
    - "Сдвигают точку на eps"
  correct: 2
  answer: >
    Используют соглашение: в нуле берут субградиент, в PyTorch для relu это 0. На практике точный ноль на входе
    ReLU встречается редко и на обучение не влияет. Важно лишь, чтобы правило было фиксированным: тогда
    результаты воспроизводимы, а проверка градиентов в такой точке не имеет смысла.
  source: course
- id: gradcheck-central-01
  topic: autograd
  tasks: [A02-gradcheck]
  difficulty: medium
  kind: open
  question: "Почему для проверки градиентов берут центральную разность и h ≈ 1e-5, а не просто очень маленький h?"
  answer: >
    У центральной разности (f(x+h) − f(x−h)) / 2h член второго порядка ряда Тейлора сокращается, поэтому ошибка
    формулы ~h², а у односторонней ~h. Но уменьшать h без конца нельзя: f(x+h) и f(x−h) становятся почти равны, при
    вычитании пропадают значащие цифры, и ошибка округления растёт как ε_маш/h. Сумма двух ошибок минимальна при h
    порядка кубического корня из машинного эпсилона. В float64 это примерно 1e-5…1e-6, и тогда точность около 1e-10.
  source: course
- id: gradcheck-float64-01
  topic: autograd
  tasks: [A02-gradcheck]
  difficulty: easy
  kind: mcq
  question: "Проверка градиентов в float32 показывает относительную ошибку 1e-3. Какой вывод правильный?"
  options:
    - "В backward точно есть ошибка"
    - "Этого мало, чтобы что-то утверждать: во float32 численная производная сама неточна, проверку нужно повторить в float64"
    - "Ошибка 1e-3 — нормальный результат, можно использовать float32 всегда"
    - "Нужно уменьшить h до 1e-12"
  correct: 1
  answer: >
    Во float32 машинный эпсилон ~1e-7, и лучшая достижимая точность центральной разности — около 1e-4…1e-3. На таком
    уровне ошибку в backward не отличить от погрешности самого метода. Проверку переводят в float64, где верный
    backward даёт 1e-9 и лучше, а ошибочный — заметно больше. Уменьшение h во float32 только усилит ошибку округления.
  source: course
- id: gradcheck-relative-01
  topic: autograd
  tasks: [A02-gradcheck]
  difficulty: easy
  kind: open
  question: "Почему градиенты сравнивают относительной ошибкой, а не абсолютной, и зачем eps в знаменателе?"
  answer: >
    Масштаб градиентов разный: у одних параметров они ~1, у других ~1e-7. Абсолютный порог 1e-6 пропустит ошибку в 100%
    для маленьких градиентов и забракует верные большие. Относительная ошибка |a − b| / max(|a|, |b|) не зависит от
    масштаба. eps в знаменателе нужен, когда оба числа нулевые: без него получится 0/0 = NaN.
  source: course
