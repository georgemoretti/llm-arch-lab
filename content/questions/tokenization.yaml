# Вопросы курса к блоку A, модуль 3 (Токенизация): обучение BPE, encode/decode, UTF-8, пре-токенизация, спецтокены,
# токенизатор GPT-2. Ответы написаны авторами курса. Квиз A-Q3 собирает весь файл.
- id: bpe-train-bytes-01
  topic: tokenization
  tasks: [A11-bpe-train]
  difficulty: easy
  kind: open
  question: "Почему современные BPE-токенизаторы начинают со словаря из 256 байтов, а не из символов?"
  answer: >
    Любой текст в UTF-8 — последовательность байтов, а значений байта ровно 256. Поэтому токенизатор может
    закодировать любую строку, и неизвестного токена (UNK) не бывает: незнакомый символ просто распадётся на свои
    байты. Символов Unicode больше 150 тысяч, и стартовый словарь из символов был бы огромным или неполным. Цена
    байтового старта — первые слияния уходят на сборку многобайтовых символов (кириллица, иероглифы), и токен может
    оказаться половиной символа.
  source: course
- id: bpe-train-step-01
  topic: tokenization
  tasks: [A11-bpe-train]
  difficulty: easy
  kind: mcq
  question: "Что делает один шаг обучения BPE?"
  options:
    - "Удаляет из словаря самый редкий токен"
    - "Находит самую частую пару соседних токенов, добавляет её склейку в словарь и заменяет все её вхождения"
    - "Выбирает разбиение слова с максимальной вероятностью"
    - "Объединяет два самых похожих по эмбеддингу токена"
  correct: 1
  answer: >
    BPE жадно растит словарь снизу вверх: считает частоты всех соседних пар в текущем разбиении корпуса, самую частую
    пару делает новым токеном и заменяет её во всём корпусе. Шаг повторяется, пока словарь не достигнет нужного
    размера. Удаление токенов из большого словаря — это Unigram LM (SentencePiece), выбор пары по приросту
    правдоподобия — WordPiece.
  source: course
- id: bpe-train-vocab-size-01
  topic: tokenization
  tasks: [A11-bpe-train, A14-gpt2-tokenizer]
  difficulty: medium
  kind: open
  question: "Как размер словаря токенизатора влияет на модель? Почему не взять словарь в миллион токенов?"
  answer: >
    Больший словарь короче кодирует текст: в контекст помещается больше смысла, генерация требует меньше шагов,
    attention дешевле. Но матрица эмбеддингов и выходной слой растут как V × d_model, и у маленькой модели они
    съедают заметную долю параметров, а softmax по словарю дорожает. Ещё хуже редкие токены: в обучающих данных они
    встречаются мало, их эмбеддинги недообучены, и модель ведёт себя на них странно. Поэтому выбирают компромисс:
    около 50 тысяч у GPT-2, 128 тысяч у Llama 3, больше у многоязычных моделей.
  source: course
- id: bpe-train-cyrillic-01
  topic: tokenization
  tasks: [A11-bpe-train]
  difficulty: medium
  kind: mcq
  question: "Byte-level BPE учится на русском тексте. Что окажется среди первых слияний?"
  options:
    - "Частые русские слова целиком: «и», «в», «не»"
    - "Пары байтов, из которых состоят кириллические буквы, и пробел с первым байтом буквы"
    - "Пары пробелов"
    - "Ничего: BPE не работает с кириллицей"
  correct: 1
  answer: >
    Кириллическая буква в UTF-8 занимает два байта (например, «о» = D0 BE), и пары «D0 + второй байт» — самые частые
    в русском тексте. Поэтому первые слияния собирают из байтов сами буквы. На корпусе курса самым первым выучивается
    «пробел + D0»: это даже не символ. Целые слова появляются позже, когда буквы уже стали токенами.
  source: course
- id: bpe-encode-rank-01
  topic: tokenization
  tasks: [A12-bpe-encode, A12d-bpe-encode-debug]
  difficulty: medium
  kind: open
  question: "Почему при кодировании нового текста слияния применяются по рангу (порядку обучения), а не по частоте пар в этом тексте?"
  answer: >
    Токенизатор должен быть детерминированным и согласованным с обучением: один и тот же кусок текста всегда даёт
    одинаковые токены, а обучающий текст — ровно ту последовательность, что получилась при обучении. Порядок слияний
    задаёт, какие промежуточные токены существуют. Если сливать по частоте в текущем тексте, разбиение слова будет
    зависеть от соседних предложений, и модель увидит одно слово как разные последовательности id, хотя
    decode(encode(s)) по-прежнему вернёт исходную строку.
  source: course
- id: bpe-encode-speed-01
  topic: tokenization
  tasks: [A12-bpe-encode, A13-pretokenize]
  difficulty: hard
  kind: open
  question: "Наивный encode пересчитывает пары после каждого слияния. Как быстрые токенизаторы (tiktoken, tokenizers) кодируют гигабайты текста?"
  answer: >
    Во-первых, пре-токенизация режет текст на короткие куски (слова), и BPE работает только внутри куска, поэтому
    длина каждой задачи маленькая. Во-вторых, одинаковые куски встречаются постоянно, и их разбиение кешируется:
    слово « the» кодируется один раз. В-третьих, внутри куска пары с рангами хранят в приоритетной очереди или
    обновляют только соседей слитой пары, а не пересчитывают всё заново. Плюс реализация на Rust и параллелизм по
    документам.
  source: course
- id: utf8-decode-01
  topic: tokenization
  tasks: [A12-bpe-encode, A13-pretokenize, A13d-decode-debug]
  difficulty: medium
  kind: open
  question: "Почему нельзя декодировать токены byte-level BPE по одному и склеивать строки? Как тогда выводить текст при потоковой генерации?"
  answer: >
    Токен — последовательность байтов, и граница токена может пройти посередине многобайтового символа UTF-8. Такая
    половинка по отдельности не декодируется и превращается в «�». Правильно склеить байты всех токенов и
    декодировать один раз. При потоковой генерации держат буфер байтов: печатают только завершённые символы, а
    неполный хвост ждёт следующих токенов (так делают TextStreamer в transformers и инкрементальные декодеры UTF-8).
  source: course
- id: utf8-bytes-01
  topic: tokenization
  tasks: [A12-bpe-encode]
  difficulty: easy
  kind: mcq
  question: "Сколько байтов в UTF-8 занимают «z», «я», «汉» и «🙂»?"
  options:
    - "1, 1, 1, 1"
    - "1, 2, 3, 4"
    - "2, 2, 2, 4"
    - "1, 2, 2, 2"
  correct: 1
  answer: >
    UTF-8 — кодировка переменной длины: ASCII занимает 1 байт, кириллица и большинство европейских алфавитов — 2,
    иероглифы основной плоскости — 3, эмодзи и прочие символы за пределами BMP — 4. Первый байт по старшим битам
    сообщает длину символа, следующие начинаются с битов 10. Поэтому одиночный байт 0xD0 без продолжения —
    некорректная строка.
  source: course
- id: pretok-why-01
  topic: tokenization
  tasks: [A13-pretokenize]
  difficulty: medium
  kind: open
  question: "Зачем BPE нужна пре-токенизация регулярным выражением и почему в GPT-2 пробел приклеен к началу слова?"
  answer: >
    Без пре-токенизации слияния идут по всему тексту и выучивают случайные сочетания соседей: «слово + точка»,
    «конец слова + пробел + начало следующего». Словарь тратится на мусор, а одно слово получает разные токены в
    зависимости от того, что стоит рядом. Регулярка режет текст на слова, числа, пунктуацию и пробелы, и слияния
    работают только внутри куска. Пробел идёт в начало слова, чтобы слово в середине предложения всегда выглядело
    одинаково: « world» — один токен, независимо от того, что было до него.
  source: course
- id: pretok-regex-01
  topic: tokenization
  tasks: [A13-pretokenize]
  difficulty: hard
  kind: mcq
  question: "Зачем в регулярке GPT-2 альтернатива \\s+(?!\\S) перед просто \\s+?"
  options:
    - "Чтобы удалять лишние пробелы"
    - "Чтобы последний пробел перед словом остался ему: «a␣␣b» → «a», «␣», «␣b»"
    - "Чтобы переводы строк не попадали в токены"
    - "Она нужна только для табуляции"
  correct: 1
  answer: >
    \s+(?!\S) забирает пробелы, после которых не идёт непробельный символ. Перед словом движок откатывается на один
    пробел назад, и этот пробел достаётся следующей альтернативе « ?\p{L}+» вместе со словом. Так слово после
    нескольких пробелов всё равно кодируется привычным токеном « b». Пробелы в конце строки целиком забирает та же
    альтернатива, остальные случаи — \s+.
  source: course
- id: pretok-digits-01
  topic: tokenization
  tasks: [A13-pretokenize]
  difficulty: medium
  kind: open
  question: "Как токенизация чисел влияет на арифметику LLM и что изменили в новых токенизаторах?"
  answer: >
    В GPT-2 число целиком попадает в один кусок \p{N}+, и BPE режет его по частотным кускам: 1234 может стать
    «12» + «34», а 1235 — «123» + «5». Одинаковые разряды оказываются в разных токенах, и модели трудно выучить
    сложение столбиком. Llama 3 и токенизатор GPT-4 режут цифры группами не длиннее трёх (\p{N}{1,3}), некоторые
    модели — по одной цифре. Разбиение становится регулярным, и арифметика заметно улучшается.
  source: course
- id: special-tokens-01
  topic: tokenization
  tasks: [A13-pretokenize, A14-gpt2-tokenizer]
  difficulty: medium
  kind: open
  question: "Зачем нужны спецтокены вроде <|endoftext|> и почему их не должен порождать обычный текст пользователя?"
  answer: >
    Спецтокены размечают структуру: <|endoftext|> разделяет документы в обучающих данных и служит сигналом
    остановки генерации, служебные токены чата отмечают реплики системы, пользователя и ассистента. Модель обучена
    придавать им особый смысл. Если строка «<|endoftext|>» из текста пользователя превратится в настоящий спецтокен,
    пользователь сможет оборвать контекст или подделать системную реплику — это разновидность prompt injection.
    Поэтому при кодировании недоверенного текста спецтокены выключают (allowed_special=False в A14 и в tiktoken), и
    строка кодируется как обычные символы.
  source: course
- id: special-eot-01
  topic: tokenization
  tasks: [A13-pretokenize]
  difficulty: easy
  kind: mcq
  question: "Как <|endoftext|> используют при предобучении GPT-подобных моделей?"
  options:
    - "Им заменяют неизвестные слова"
    - "Документы склеиваются в один поток через <|endoftext|>, и модель учится, что после него начинается новый текст"
    - "Им дополняют последовательности до одной длины, и лосс по нему не считают"
    - "Он стоит в начале каждого предложения"
  correct: 1
  answer: >
    Обучающие документы склеивают в длинную ленту, разделяя <|endoftext|>, и режут её на окна фиксированной длины.
    Модель видит разделитель и учится, что после него контекст предыдущего документа не нужен. При генерации тот же
    токен означает «текст закончен». У GPT-2 нет отдельного токена для дополнения, поэтому при батчинге им часто
    заполняют и паддинг, но это уже соглашение, а не смысл токена.
  source: course
- id: gpt2tok-bytes-to-unicode-01
  topic: tokenization
  tasks: [A13-pretokenize, A14-gpt2-tokenizer]
  difficulty: medium
  kind: open
  question: "Зачем GPT-2 отображает байты в символы Unicode (пробел → «Ġ») и откуда в её словаре токены вроде «Ġworld»?"
  answer: >
    Словарь и правила слияний хранятся в текстовых файлах (vocab.json, merges.txt), а токены — произвольные байты:
    пробел, перевод строки, управляющие символы, половинки символов UTF-8. Записать их как есть нельзя: пробел
    разделяет части правила, а невидимые байты ломают файлы. Поэтому каждый из 256 байтов обратимо отображают в
    печатный символ: видимые байты — сами в себя, остальные — в символы с кодами от 256. Пробел становится «Ġ»,
    перевод строки — «Ċ», и « world» записывается как «Ġworld». Это только запись: сам BPE работает с байтами.
  source: course
- id: gpt2tok-multilingual-01
  topic: tokenization
  tasks: [A14-gpt2-tokenizer]
  difficulty: medium
  kind: open
  question: "Почему один и тот же текст на русском занимает у GPT-2 в несколько раз больше токенов, чем на английском, и чем это плохо?"
  answer: >
    Слияния выучены на преимущественно английском корпусе, и у кириллицы их мало: русское слово разбивается почти по
    байтам, больше одного токена на символ. На тексте курса английская фраза занимает 28 токенов, русская того же
    смысла — 152. Следствия: в контекст помещается в разы меньше текста, генерация в разы дольше, API с оплатой за
    токены дороже, а модель хуже учится на таких языках, потому что смысловые единицы размазаны по многим токенам.
    Многоязычные модели обучают токенизатор на смеси языков и берут словарь больше.
  source: course
- id: gpt2tok-size-01
  topic: tokenization
  tasks: [A14-gpt2-tokenizer]
  difficulty: easy
  kind: mcq
  question: "Из чего складывается словарь GPT-2 из 50 257 токенов?"
  options:
    - "50 257 самых частых английских слов"
    - "256 байтов + 50 000 слияний BPE + спецтокен <|endoftext|>"
    - "50 000 слов + 257 знаков пунктуации"
    - "65 536 символов Unicode минус неиспользуемые"
  correct: 1
  answer: >
    Стартовый словарь — 256 байтов, обучение BPE добавило 50 000 токенов (по одному на строку merges.txt), и последний
    id 50 256 занимает <|endoftext|>. Это видно прямо из файлов модели на Hugging Face. Размер выходного слоя GPT-2
    — тоже 50 257.
  source: course
- id: gpt2tok-glitch-01
  topic: tokenization
  tasks: [A14-gpt2-tokenizer]
  difficulty: hard
  kind: open
  question: "Что такое «глючные» (недообученные) токены и почему они появляются?"
  answer: >
    Токенизатор и модель обучают на разных данных. Если строка часто встречалась в корпусе токенизатора (например,
    имя пользователя с форума или служебная строка сайта), она стала отдельным токеном. В данных модели её почти не
    было, и эмбеддинг такого токена почти не менялся от инициализации. На таких токенах модель ведёт себя
    непредсказуемо: не может повторить строку, путает её с другими. Известный пример — токен « SolidGoldMagikarp»
    у моделей GPT-2/GPT-3. Лечение — обучать токенизатор на данных, похожих на данные модели, и проверять
    эмбеддинги с аномально малой нормой.
  source: course
