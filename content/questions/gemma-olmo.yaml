# Вопросы курса к модулю 2 (Gemma 3 / OLMo 2 / SmolLM3): SWA, размещение норм, QK-Norm, NoPE,
# KV-cache для SWA. Ответы написаны авторами курса. Квиз модуля C-Q2 собирает все вопросы файла.
- id: swa-window-01
  topic: attention
  tasks: [C07-swa, C07d-swa-debug]
  difficulty: easy
  kind: mcq
  question: "Окно SWA W = 4. Какие ключи видит запрос на позиции 10?"
  options:
    - "6, 7, 8, 9, 10"
    - "7, 8, 9, 10"
    - "7, 8, 9, 10, 11, 12, 13"
    - "только 6, 7, 8, 9 — себя токен не видит"
  correct: 1
  answer: >
    Окно из W позиций включает сам токен: разрешены расстояния 0..W−1, то есть ключи 7, 8, 9, 10.
    Вариант с пятью ключами — классическая ошибка на единицу (условие p − j ≤ W вместо < W); будущее
    (11+) запрещено causal-частью маски.
  source: course
- id: swa-cost-01
  topic: attention
  tasks: [C07-swa]
  difficulty: medium
  kind: open
  question: "Что экономит sliding window attention и чем за это платят?"
  answer: >
    Каждый запрос смотрит не на всю историю, а на последние W токенов: вычисления attention
    O(T·W) вместо O(T²), и в KV-cache слоя достаточно хранить W последних токенов — память не растёт
    с контекстом. Платят тем, что слой напрямую не видит дальше окна; дальние зависимости либо
    передаются через стек слоёв (L слоёв видят на L·(W−1) назад, но информация «сжимается» по пути),
    либо через отдельные глобальные слои с полным attention.
  source: course
- id: swa-receptive-field-01
  topic: attention
  tasks: [C07-swa]
  difficulty: medium
  kind: open
  question: >
    Модель из 32 слоёв, во всех слоях SWA с окном 4096 (как Mistral 7B). Может ли токен на
    позиции 20 000 зависеть от токена на позиции 0? Почему?
  answer: >
    Да. Каждый слой расширяет поле зрения на W − 1 позиций: выход слоя в позиции t уже несёт
    информацию о t − W + 1, и следующий слой смотрит на эти смешанные представления. 32 слоя
    достигают 32·4095 ≈ 131 тысячи позиций назад, так что формально токен 0 влияет на 20 000.
    Но влияние идёт через цепочку из ≥ 5 слоёв, и насколько хорошо модель им пользуется, — вопрос
    обучения: прямого attention к токену 0 нет.
  source: course
- id: local-global-pattern-01
  topic: attention
  tasks: [C07-swa]
  difficulty: medium
  kind: open
  question: "Как устроено чередование local и global слоёв в Gemma 2 и Gemma 3 и зачем его поменяли?"
  answer: >
    В Gemma 2 sliding и full слои чередуются 1:1, окно 4096. В Gemma 3 на каждые 5 sliding-слоёв
    приходится 1 full (каждый 6-й слой), окно уменьшено до 1024. Цель — KV-cache на длинном
    контексте: память sliding-слоя ограничена окном, и почти весь кеш занимают full-слои; чем их
    меньше, тем меньше память на 128K токенов. Авторы сообщают, что качество от такой пропорции
    почти не страдает, а глобальные слои оставляют модели доступ к дальнему контексту.
  source: course
- id: local-global-index-01
  topic: attention
  tasks: [C07-swa]
  difficulty: easy
  kind: mcq
  question: "У Gemma 3 sliding_window_pattern = 6, слои нумеруются с 0. Какие слои — full attention?"
  options:
    - "0, 6, 12, …"
    - "5, 11, 17, …"
    - "Последние 1/6 слоёв подряд"
    - "Случайные, выбираются при обучении"
  correct: 1
  answer: >
    Слой i — full, когда (i + 1) делится на 6: это последний слой каждой группы из шести, то есть
    5, 11, 17, … Слой 0 всегда sliding. Перепутать с i % 6 == 0 — частая ошибка при загрузке весов.
  source: course
