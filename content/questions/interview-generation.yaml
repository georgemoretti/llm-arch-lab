# Вопросы с собеседований пользователя (source: user-db), переформулированные своими словами, с эталонными
# ответами курса. Тема: генерация и сэмплирование, структурированный вывод, авторегрессия, квантизация.
# Правила — docs/QUESTIONS_IMPORT.md.
- id: iv-generation-01
  topic: generation
  tags: [sampling]
  difficulty: easy
  kind: open
  question: "Что делают temperature, top-k и top-p при выборе следующего токена?"
  answer: >
    Модель выдаёт логиты по словарю. Temperature T делит логиты перед softmax: T < 1 обостряет распределение
    (ближе к жадному выбору), T > 1 сглаживает (больше разнообразия), T → 0 — argmax. Top-k оставляет k самых
    вероятных токенов, остальным ставит −∞, перенормирует и сэмплирует из оставшихся. Top-p (nucleus) оставляет
    минимальный набор самых вероятных токенов, чья суммарная вероятность ≥ p, — размер набора подстраивается под
    уверенность модели: при уверенном распределении остаётся 1–2 токена, при размытом — много. Применяют их при
    генерации в чат-ботах, креативных задачах и при сэмплировании нескольких вариантов ответа.
  source: user-db
  source_ref: [ee0246d866, 8066b52c27, ae80ca3405, db97737675, c1e507a724]
- id: iv-generation-02
  topic: generation
  tags: [sampling]
  difficulty: medium
  kind: mcq
  question: >
    Логиты двух токенов: 2 и 0. Как изменится вероятность первого токена при температуре 0.5 по сравнению с T = 1?
  options:
    - "Не изменится — температура влияет только на редкие токены"
    - "Вырастет: при T = 1 p ≈ 0.88, при T = 0.5 логиты становятся 4 и 0, p ≈ 0.98"
    - "Упадёт до 0.5, распределение станет равномерным"
    - "Вырастет ровно в 2 раза"
  correct: 1
  answer: >
    softmax(z / T): при T = 1 — e²/(e² + 1) ≈ 0.88; при T = 0.5 логиты удваиваются, e⁴/(e⁴ + 1) ≈ 0.98.
    Отношение вероятностей двух токенов равно exp((z₁ − z₂)/T): уменьшение T увеличивает разрыв, распределение
    становится острее; увеличение T приближает его к равномерному.
  source: user-db
  source_ref: [c62afecc6e, 9ae8f387b3, 71c51cd52d]
- id: iv-generation-03
  topic: generation
  tags: [sampling]
  difficulty: medium
  kind: open
  question: >
    При top-k = 50 и top-k = 100 первым (самым вероятным) кандидатом будет один и тот же токен? И как именно
    выбирается токен из оставшихся 50?
  answer: >
    Да: top-k лишь отрезает хвост, порядок кандидатов задают логиты, и самый вероятный токен один и тот же. Разница
    — в остальных: при k = 100 в кандидатах больше маловероятных токенов. Выбор не «лучший из 50», а случайный:
    вероятности оставшихся k токенов перенормируют, чтобы сумма была 1 (softmax по ним), и из этого распределения
    сэмплируют. Поэтому самый вероятный токен выпадает чаще, но не всегда; жадный выбор — это k = 1 или T → 0.
  source: user-db
  source_ref: [b9a3ef8cd0, 0f9bafcda1]
- id: iv-generation-04
  topic: generation
  tags: [sampling]
  difficulty: medium
  kind: open
  question: "Можно ли включить top-k и top-p одновременно, что тогда происходит и почему так часто не советуют?"
  answer: >
    Можно: в большинстве библиотек фильтры применяются последовательно (обычно сначала temperature, потом top-k,
    потом top-p по оставшимся), и в итоге остаётся пересечение — меньший из двух наборов. Проблема в том, что
    эффект становится трудно предсказать и настраивать: какой из фильтров «сработал», зависит от формы
    распределения на каждом шаге, а порядок применения отличается между библиотеками и API. Поэтому обычно
    фиксируют один механизм (чаще top-p вместе с temperature), а второй оставляют нейтральным.
  source: user-db
  source_ref: [d88f3f5df0, 6d7e0adff7, f3c8170c76]
- id: iv-generation-05
  topic: generation
  tags: [structured-output]
  difficulty: medium
  kind: open
  question: "Как заставить LLM возвращать строго структурированный (типизированный) ответ, например JSON по схеме?"
  answer: >
    По возрастанию надёжности: (1) инструкция и примеры в промпте + валидация и повтор при ошибке (Pydantic,
    instructor); (2) JSON mode / tool calling у провайдера — модель обучена выдавать аргументы функции по схеме;
    (3) structured outputs / constrained decoding: на каждом шаге генерации маскируются токены, недопустимые
    грамматикой или JSON Schema (Outlines, XGrammar, llama.cpp grammars, guided decoding в vLLM), — вывод
    гарантированно парсится. Даже с ограничениями стоит проверять смысловую валидность значений и держать поле
    для «не знаю».
  source: user-db
  source_ref: [4093760c2c, 7d62e3ebda]
- id: iv-generation-06
  topic: inference
  tags: [cost]
  difficulty: medium
  kind: open
  question: "Как сократить расход токенов (и деньги) при работе с платными LLM API?"
  answer: >
    Короче вход: сжимать и чистить контекст, в RAG давать меньше, но точнее найденных чанков (reranker), убирать
    историю диалога или суммаризировать её. Кешировать: prompt caching у провайдера для неизменного префикса
    (системный промпт, инструкции, документы — ставить в начало), семантический кеш готовых ответов. Короче
    выход: лимит max_tokens, структурированный ответ без «воды». Выбирать модель по задаче: дешёвую для простых
    шагов и маршрутизации, дорогую только где нужно; batch API для офлайн-задач.
  source: user-db
  source_ref: [adb347b743]
- id: iv-generation-07
  topic: training
  tags: [autoregression]
  difficulty: medium
  kind: open
  question: "На какой задаче предобучают LLM и чем плоха авторегрессия как способ генерации?"
  answer: >
    Предобучение — предсказание следующего токена (кросс-энтропия по всем позициям с causal-маской). Минусы
    авторегрессии: генерация последовательна (T шагов, нельзя распараллелить, отсюда KV-cache и спекулятивное
    декодирование); при обучении модель видит правильный префикс, а при генерации — свой (exposure bias), так что
    ошибки накапливаются; модель «обязана» выбрать токен сейчас и не может вернуться и исправить; планирование
    наперёд неявное. Частично это смягчают MTP (C17), beam search, reasoning, самопроверка.
  source: user-db
  tasks: [C17-mtp]
  source_ref: [fa8f33a025, 62fb299376, 0b6fff290a]
- id: iv-generation-08
  topic: training
  tags: [autoregression]
  difficulty: medium
  kind: mcq
  question: >
    Модель генерирует по шагам и на каждом шаге ошибается с вероятностью 1 % независимо от прошлого. Какова
    вероятность хотя бы одной ошибки за 10 шагов?
  options: ["1 %", "≈ 9.6 %", "10 %", "≈ 63 %"]
  correct: 1
  answer: >
    Вероятность пройти все 10 шагов без ошибок — 0.99¹⁰ ≈ 0.904, значит хотя бы одна ошибка ≈ 9.6 %. Для 100
    шагов уже 1 − 0.99¹⁰⁰ ≈ 63 %. На деле хуже: ошибка меняет префикс, модель попадает в непривычное состояние
    (exposure bias), и вероятность следующих ошибок растёт.
  source: user-db
  source_ref: [03dbdd1d0e]
- id: iv-generation-09
  topic: training
  tags: [autoregression]
  difficulty: hard
  kind: open
  question: "Как накапливается ошибка при авторегрессионном прогнозе, особенно когда модель предсказывает числа шаг за шагом?"
  answer: >
    Каждый шаг использует собственные предыдущие прогнозы как вход. Небольшая ошибка сдвигает вход от
    распределения, на котором модель училась, и следующая ошибка уже больше: в худшем случае рост
    экспоненциальный, а не линейный. Для чисел токенами добавляется дискретизация: число режется на куски, ошибка
    в старшем куске катастрофична, а модель не «чувствует» близость значений (12 и 13 — разные токены без
    метрики между ними). Для рядов при многошаговом прогнозе ошибка дрейфует: прогноз смещается или сглаживается
    к среднему. Помогают прямой многошаговый прогноз (сразу на горизонт), обучение на собственных прогнозах
    (scheduled sampling), вероятностный выход.
  source: user-db
  source_ref: [0ac6fc89c6, 019645c59a, 525703bc4e]
- id: iv-generation-10
  topic: other
  tags: [time-series]
  difficulty: medium
  kind: open
  question: "Подходит ли трансформер для прогноза временного ряда (например, температуры по дням)?"
  answer: >
    Да, но не «как текст». Значения нормируют и подают патчами через линейную проекцию (PatchTST) или квантуют в
    токены (Chronos), используют энкодер или декодер с маской; есть готовые foundation-модели для рядов (Chronos,
    TimesFM, Moirai). Важно сравнивать с простыми базовыми методами (сезонная наивная модель, ETS, градиентный
    бустинг на лагах): на коротких одномерных рядах они часто не хуже. Плюсы трансформера — длинный контекст и
    много рядов сразу; минусы — данные, стоимость, накопление ошибки при авторегрессионном прогнозе.
  source: user-db
  source_ref: [a1cabbdb90]
- id: iv-quantization-01
  topic: inference
  tags: [quantization]
  difficulty: easy
  kind: open
  question: "Что такое квантизация модели, какие бывают её виды и что именно квантуют?"
  answer: >
    Хранение и вычисление в меньшей разрядности: вместо bf16 — int8, int4, fp8 и т. д., с масштабом (scale), а
    иногда сдвигом на группу значений. По времени: post-training quantization (без дообучения: GPTQ, AWQ,
    bitsandbytes, GGUF-форматы) и quantization-aware training (квантизация имитируется при обучении). По
    объекту: только веса (weight-only, W4A16), веса и активации (W8A8), KV-cache, градиенты и состояния
    оптимизатора при обучении. По гранулярности масштаба: на тензор, на канал, на группу из 64–128 весов.
  source: user-db
  source_ref: [7a28e7b613, 5d975bad94, fa2dfdbd1a]
- id: iv-quantization-02
  topic: inference
  tags: [quantization]
  difficulty: medium
  kind: open
  question: "Насколько квантизация ускоряет модель и от чего зависит выигрыш?"
  answer: >
    Гарантированно сокращается память: int8 — в 2 раза относительно bf16, int4 — примерно в 4 (плюс масштабы).
    Скорость зависит от режима. Генерация по одному токену ограничена чтением весов из памяти, поэтому
    weight-only int4 ускоряет декодинг почти пропорционально уменьшению байтов (часто в 2–3 раза). На prefill и
    больших батчах узкое место — вычисления, и ускорение есть, только если активации тоже квантованы и железо
    умеет int8/fp8 матричные умножения; иначе веса деквантуются на лету и выигрыша почти нет. Качество обычно
    почти не падает до 8 бит, на 4 битах — заметно для маленьких моделей.
  source: user-db
  source_ref: [b34a40c5eb]
