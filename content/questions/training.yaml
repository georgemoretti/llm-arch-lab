# Вопросы курса к блоку A, модуль 2 (Обучение нейросети): инициализация, оптимизаторы, расписание LR,
# тренировочный цикл, языковая модель на символах. Ответы написаны авторами курса. Квиз A-Q2 собирает весь файл.
- id: init-variance-01
  topic: training
  tasks: [A06-init]
  difficulty: medium
  kind: open
  question: "Откуда берётся формула Kaiming-инициализации std = √(2 / fan_in)?"
  answer: >
    Выход нейрона без bias — сумма fan_in слагаемых wᵢxᵢ. При независимых весах с нулевым средним его дисперсия равна
    fan_in · Var(w) · E[x²]. Чтобы масштаб сигнала не менялся от слоя к слою, это произведение должно равняться
    дисперсии предыдущего слоя. ReLU обнуляет половину симметричного входа и вдвое уменьшает E[x²], и это компенсирует
    Var(w) = 2/fan_in. Без двойки сигнал в глубокой ReLU-сети затухает как (1/√2)^L.
  source: course
- id: init-zero-01
  topic: training
  tasks: [A06-init]
  difficulty: easy
  kind: mcq
  question: "Что будет, если инициализировать все веса MLP нулями?"
  options:
    - "Сеть обучится, просто медленнее"
    - "Нейроны одного слоя получат одинаковые градиенты и останутся копиями друг друга: слой будет работать как один нейрон"
    - "Градиенты станут бесконечными"
    - "Ничего: bias всё равно разные"
  correct: 1
  answer: >
    Одинаковые веса дают одинаковые выходы и одинаковые градиенты у всех нейронов слоя, поэтому после каждого шага они
    остаются равными. Симметрию ломает только случайная инициализация. При нулевых весах вдобавок градиенты по весам
    скрытых слоёв равны нулю: выход не зависит от входа. Bias при этом обычно и так инициализируют нулями.
  source: course
- id: init-llm-01
  topic: training
  tasks: [A06-init]
  difficulty: medium
  kind: open
  question: "Почему LLM вроде GPT-2 и Llama инициализируют простым N(0, 0.02²), а не Kaiming, и что делают с residual-проекциями?"
  answer: >
    В трансформере масштаб сигнала держат нормализации (LayerNorm/RMSNorm перед каждым блоком), поэтому точный
    подбор дисперсии по fan_in не так важен, и берут фиксированное небольшое std = 0.02 (initializer_range в
    config.json). Есть другая проблема: каждый блок прибавляет свой выход к residual-потоку, и после N блоков дисперсия
    потока растёт пропорционально N. Поэтому GPT-2 уменьшает начальные веса выходных проекций блоков (c_proj)
    в √N раз, где N — число residual-слоёв.
  source: course
- id: optim-adamw-vs-l2-01
  topic: training
  tasks: [A07-optimizers, A07d-adamw-debug]
  difficulty: medium
  kind: open
  question: "Чем AdamW отличается от Adam с L2-регуляризацией (weight_decay в torch.optim.Adam)?"
  answer: >
    В Adam с L2 слагаемое λθ прибавляется к градиенту, попадает в моменты m и v и делится на √v̂. Для параметров с
    большими и шумными градиентами √v̂ велик, и регуляризация почти не действует. Для параметров с маленькими
    градиентами она, наоборот, усиливается. В SGD L2 и weight decay эквивалентны, а в Adam — нет. AdamW применяет
    decay отдельно: θ ← θ(1 − ηλ), а затем делает обычный шаг Adam по исходному градиенту. Так у всех параметров
    одинаковая относительная регуляризация, и в экспериментах Loshchilov и Hutter это давало лучшее обобщение.
  source: course
- id: optim-bias-correction-01
  topic: training
  tasks: [A07-optimizers]
  difficulty: medium
  kind: mcq
  question: "Зачем в Adam делят m и v на (1 − β^t)?"
  options:
    - "Чтобы learning rate уменьшался со временем"
    - "m и v стартуют с нуля, поэтому первые оценки занижены; деление на (1 − β^t) их несмещает"
    - "Чтобы избежать деления на ноль"
    - "Это регуляризация весов"
  correct: 1
  answer: >
    Экспоненциальное среднее, начатое с нуля, после t шагов имеет вес (1 − β^t) на реальных градиентах, а остальное
    приходится на нулевую инициализацию. При β2 = 0.999 после первого шага v = 0.001·g², то есть v занижено в 1000
    раз. Без поправки отношение m/√v на первых шагах искажено. Деление на 1 − β^t снимает смещение, и на первом шаге
    m̂ = g, v̂ = g².
  source: course
- id: optim-memory-01
  topic: training
  tasks: [A07-optimizers]
  difficulty: easy
  kind: open
  question: "Сколько памяти занимает состояние Adam и почему для больших моделей это важно?"
  answer: >
    Два буфера (m и v) той же формы, что параметры, обычно в fp32: 8 байт на параметр. С fp32-копией весов и
    градиентом при mixed precision это около 16 байт на параметр, а для модели на 7B — больше 100 ГБ ещё до
    активаций. Поэтому состояния оптимизатора шардируют между GPU (ZeRO, FSDP), хранят в пониженной точности
    (8-bit Adam) или выбирают оптимизаторы с меньшим состоянием (Adafactor, Lion).
  source: course
- id: optim-momentum-01
  topic: training
  tasks: [A07-optimizers]
  difficulty: easy
  kind: open
  question: "Что делает momentum и в какой ситуации он помогает больше всего?"
  answer: >
    Momentum копит экспоненциальное среднее прошлых шагов («скорость») и двигается по нему, а не по текущему
    градиенту. Больше всего он помогает в оврагах, где по одному направлению лосс крутой, а по другому пологий.
    Поперёк оврага градиенты меняют знак и в среднем гасятся, вдоль оврага складываются, и движение разгоняется.
    Чистый SGD в такой ситуации прыгает со стенки на стенку и почти не продвигается вдоль дна.
  source: course
- id: schedule-warmup-01
  topic: training
  tasks: [A08-lr-schedule]
  difficulty: medium
  kind: open
  question: "Зачем при обучении трансформеров нужен warmup learning rate?"
  answer: >
    В начале обучения веса случайные, градиенты большие и шумные, а оценки моментов Adam (особенно v) накоплены по
    нескольким шагам и ненадёжны. Полный lr на первых шагах может сделать огромный шаг, увести модель в плохую область
    или раздуть активации до nan. Особенно этому подвержены Post-LN трансформеры. Warmup поднимает lr постепенно, за
    сотни или тысячи шагов, пока статистики не стабилизируются. После этого можно держать большой пиковый lr.
  source: course
- id: schedule-cosine-01
  topic: training
  tasks: [A08-lr-schedule]
  difficulty: easy
  kind: mcq
  question: "Чему равен lr ровно в середине cosine decay от max_lr до min_lr?"
  options:
    - "max_lr / 2"
    - "(max_lr + min_lr) / 2"
    - "min_lr"
    - "max_lr · cos(π/2) = 0"
  correct: 1
  answer: >
    В середине progress = 0.5, cos(π·0.5) = 0, и множитель (1 + cos)/2 = 1/2. Получается min + (max − min)/2 =
    (max + min)/2. Ответ max/2 был бы верен только при min_lr = 0.
  source: course
- id: clip-global-01
  topic: training
  tasks: [A08-lr-schedule]
  difficulty: medium
  kind: open
  question: "Почему gradient clipping делают по глобальной норме всех градиентов, а не по каждому тензору отдельно?"
  answer: >
    Глобальная норма даёт один коэффициент для всех параметров: шаг укорачивается, но направление не меняется, и мы
    по-прежнему движемся по антиградиенту. Если обрезать каждый тензор отдельно, тензоры с большими градиентами
    уменьшатся сильнее остальных, и шаг повернётся в сторону, которую не указывал ни один градиент. Норму до обрезки
    логируют: её всплески часто предшествуют расходимости обучения.
  source: course
- id: loop-order-01
  topic: training
  tasks: [A09-training-loop, A09d-training-loop-debug]
  difficulty: easy
  kind: mcq
  question: "Какой порядок операций в шаге обучения правильный?"
  options:
    - "backward → zero_grad → clip → step"
    - "zero_grad → backward → step → clip"
    - "zero_grad → backward → clip → step"
    - "step → zero_grad → backward → clip"
  correct: 2
  answer: >
    Сначала обнуляем градиенты прошлого шага, затем backward считает новые. Clipping меняет уже посчитанные градиенты
    и обязан стоять до step(), иначе он ни на что не влияет. Шаг оптимизатора — последний. zero_grad можно поставить
    и сразу после step() предыдущей итерации: главное, чтобы к backward градиенты были чистыми.
  source: course
- id: loop-eval-mode-01
  topic: training
  tasks: [A09-training-loop]
  difficulty: medium
  kind: open
  question: "Зачем перед валидацией вызывают model.eval() и torch.no_grad(), и что будет, если забыть вернуть model.train()?"
  answer: >
    model.eval() переключает слои, которые ведут себя по-разному при обучении и инференсе. Dropout выключается
    (иначе лосс на валидации случайный и завышен), BatchNorm берёт накопленные средние вместо статистик батча.
    torch.no_grad() не строит граф: меньше памяти и быстрее, а градиенты для валидации не нужны. Если не вернуть
    model.train(), дальнейшее обучение пойдёт без dropout. Ошибки не будет, просто тихо пропадёт регуляризация, и
    модель начнёт сильнее переобучаться.
  source: course
- id: loop-overfit-batch-01
  topic: training
  tasks: [A09-training-loop, A09d-training-loop-debug]
  difficulty: easy
  kind: open
  question: "Зачем при отладке новой модели сначала пытаются переобучиться на одном маленьком батче?"
  answer: >
    Это самый дешёвый способ проверить, что работает вся цепочка: данные, forward, лосс, backward и шаг
    оптимизатора. Модель с тысячами параметров обязана запомнить десяток примеров почти до нулевого лосса. Если
    этого не происходит, ошибка в коде (не обнуляются градиенты, перепутаны метки, лосс считается не по тем
    логитам, параметры не переданы оптимизатору), а не в гиперпараметрах. На полном датасете такие ошибки
    маскируются, потому что обучение как-то идёт.
  source: course
- id: charlm-perplexity-01
  topic: training
  tasks: [A10-char-lm]
  difficulty: easy
  kind: open
  question: "Что такое перплексия языковой модели и как её интерпретировать?"
  answer: >
    Перплексия — экспонента средней cross-entropy на тексте: exp(−mean log p(следующий токен)). Её читают как
    эффективное число вариантов, между которыми модель в среднем выбирает. У модели, которая всем токенам даёт
    одинаковую вероятность, перплексия равна размеру словаря V, у идеальной — 1. Сравнивать перплексии можно только
    при одинаковой токенизации и одинаковом тексте: модель на символах и модель на BPE-токенах считают её в разных
    единицах.
  source: course
- id: charlm-embeddings-01
  topic: training
  tasks: [A10-char-lm]
  difficulty: medium
  kind: open
  question: "Почему нейросетевая языковая модель с эмбеддингами обобщает лучше, чем таблица частот n-грамм?"
  answer: >
    Таблица n-грамм хранит отдельное число для каждого сочетания и ничего не знает о сочетаниях, которых не видела.
    Таких большинство, и их число растёт экспоненциально с n. В нейросетевой модели каждый символ или слово получает
    вектор, а предсказание — гладкая функция от склеенных векторов. Похожие единицы получают похожие векторы, поэтому
    знание о «кот спит» переносится на «пёс спит». Число параметров растёт линейно с длиной окна, а не экспоненциально.
    Это главный аргумент Bengio et al. (2003).
  source: course
- id: charlm-logits-01
  topic: training
  tasks: [A10-char-lm]
  difficulty: easy
  kind: mcq
  question: "Модель дала одинаковые логиты всем 67 символам словаря. Чему равны cross-entropy и перплексия?"
  options:
    - "CE = 0, PPL = 1"
    - "CE = log 67 ≈ 4.20, PPL = 67"
    - "CE = 1/67, PPL = e^(1/67)"
    - "Зависит от значения логитов"
  correct: 1
  answer: >
    Одинаковые логиты дают после softmax равномерное распределение p = 1/67 для любого символа. Cross-entropy равна
    −log(1/67) = log 67 ≈ 4.20 независимо от того, какой символ правильный, и от самого значения логитов. Перплексия
    равна exp(log 67) = 67. С этим числом удобно сравнивать стартовый лосс любой модели: случайно
    инициализированная LM должна начинать около log V.
  source: course
