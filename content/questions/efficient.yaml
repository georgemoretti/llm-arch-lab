# Вопросы курса к модулю 4 (эффективное внимание), часть 1: sparse attention (DSA), gated attention,
# partial RoPE, линейное внимание. Ответы написаны авторами курса.
- id: sparse-dsa-basics-01
  topic: sparse-attention
  tasks: [C18-sparse-attention]
  difficulty: easy
  kind: open
  question: "Как устроено DeepSeek Sparse Attention и откуда берётся экономия?"
  answer: >
    Перед основным attention лёгкий индексатор оценивает каждую пару (запрос, прошлый ключ): несколько
    маленьких голов, один общий ключ на токен, ReLU вместо softmax, взвешенная сумма голов. Для каждого
    запроса берутся top-k ключей по этой оценке (2048 у DeepSeek-V3.2), и полноценное attention считается
    только по ним. Основная часть стоит O(T·k) вместо O(T²); индексатор остаётся квадратичным, но в разы
    дешевле на пару, чем основное attention с его 128 головами.
  source: course
- id: sparse-dsa-memory-01
  topic: sparse-attention
  tasks: [C18-sparse-attention]
  difficulty: medium
  kind: mcq
  question: "Что DSA экономит при генерации длинного текста по сравнению с плотным MLA той же модели?"
  options:
    - "Память KV-cache: в кеше остаются только top-k токенов"
    - "Вычисления основного attention: каждый запрос читает k ключей вместо всех"
    - "И память, и вычисления в одинаковой пропорции k / T"
    - "Ничего: top-k нужен только при обучении"
  correct: 1
  answer: >
    Выбор зависит от запроса, и любой прошлый токен может понадобиться следующему, поэтому KV-cache хранит
    всё (плюс ключи индексатора). Экономится чтение и вычисление: основное attention работает с k ключами.
    Память урезают другие механизмы — MLA (сжатие), SWA (окно), линейное внимание (фиксированное состояние).
  source: course
- id: sparse-topk-short-rows-01
  topic: sparse-attention
  tasks: [C18-sparse-attention]
  difficulty: medium
  kind: code-reading
  question: >
    Маску выбранных ключей построили так: `idx = scores.topk(k, -1).indices` и
    `keep = zeros.scatter_(-1, idx, True)`, где `scores` — оценки индексатора с −inf для будущих ключей.
    Что не так при k = 4 и в чём проявится ошибка?
  answer: >
    В первых строках (t < k − 1) допустимых ключей меньше k, и topk добирает недостающие из позиций с −inf,
    то есть из будущего. Запрос получит доступ к будущим токенам — утечка при обучении. Нужно пересечь маску
    с допустимыми позициями (`keep & isfinite(scores)` или с causal-маской).
  source: course
- id: sparse-indexer-training-01
  topic: sparse-attention
  tasks: [C18-sparse-attention]
  difficulty: hard
  kind: open
  question: "Как обучать индексатор, если через top-k градиент не проходит?"
  answer: >
    Отдельным лоссом: индексатор учат воспроизводить распределение внимания основной модели — KL-дивергенция
    между нормированными оценками индексатора и (суммированными по головам) весами плотного attention.
    DeepSeek сначала делает короткий прогрев с плотным attention, где обучается только индексатор, затем
    переходит в разреженный режим и учит всю модель; градиент основного лосса в индексатор не идёт.
  source: course
- id: gated-attn-why-01
  topic: attention
  tasks: [C19-gated-attention]
  difficulty: medium
  kind: open
  question: "Зачем Qwen3-Next ставит сигмоидный гейт на выход attention? Какие две проблемы он решает?"
  answer: >
    Первая — attention sink: softmax обязан раздать вес 1, и голова, которой нечего добавить, сбрасывает его
    на первый токен, раздувая там активации. Гейт σ(W_g x), свой у каждой головы и запроса, позволяет просто
    обнулить выход головы. Вторая — линейность пути V → O: W_V и W_O образуют низкоранговое линейное
    отображение, а гейт добавляет между ними нелинейность, зависящую от запроса. По отчёту авторов это
    стабилизирует обучение (больший learning rate) и улучшает длинный контекст.
  source: course
- id: gated-attn-layout-01
  topic: attention
  tasks: [C19-gated-attention]
  difficulty: medium
  kind: mcq
  question: >
    В Qwen3-Next `q_proj` выдаёт H·2D чисел на токен (запрос и гейт). Чекпойнт загрузили, гейт взяли как
    `q, g = q_proj(x).chunk(2, dim=-1)`. Что произойдёт?
  options:
    - "Ничего: какая половина — гейт, неважно, веса симметричны"
    - "Половина голов получит в качестве запросов строки гейтов других голов — модель выдаст мусор"
    - "Ошибка формы при view(B, T, H, D)"
    - "Гейт станет общим для всех голов"
  correct: 1
  answer: >
    Раскладка в чекпойнте — по головам: [q_0 | g_0 | q_1 | g_1 | …], разбиение делается после
    view(B, T, H, 2D). chunk по всей проекции отдаёт в «запросы» блоки [q_0, g_0, q_1, g_1] первых голов, а в
    «гейты» — оставшиеся. Формы совпадают, ошибки нет, но веса перепутаны.
  source: course
- id: partial-rope-01
  topic: positional-encoding
  tasks: [C19-gated-attention]
  difficulty: medium
  kind: open
  question: "Что такое partial RoPE и чем он похож на NoPE-слои и decoupled RoPE в MLA?"
  answer: >
    RoPE применяется лишь к первым R = D · factor каналам головы (у Qwen3-Next 64 из 256), остальные каналы
    сравнивают содержание без позиционной информации. Score раскладывается на позиционную часть (зависит от
    m − n) и содержательную (не зависит от позиций). Та же идея, что у NoPE-слоёв (часть слоёв без позиций),
    только внутри головы, и как в decoupled RoPE MLA, где позиция живёт в отдельной маленькой части q и k.
    Частоты считаются для размера R, а не берутся первыми R/2 частотами полного RoPE.
  source: course
- id: linear-attn-kernel-01
  topic: linear-attention
  tasks: [C20-linear-attention]
  difficulty: easy
  kind: open
  question: "Почему линейное внимание линейно по длине? При чём тут ассоциативность умножения матриц?"
  answer: >
    Вес пары exp(q·k) заменяют на φ(q)·φ(k) с положительной φ. Тогда (φ(Q)φ(K)ᵀ)V = φ(Q)(φ(K)ᵀV): сначала
    считается φ(K)ᵀV размера d × dv за O(T·d·dv), потом умножается на запросы. Матрица T × T не нужна. С
    softmax так нельзя: экспонента скалярного произведения не раскладывается в произведение признаков
    конечной размерности.
  source: course
- id: linear-attn-rnn-01
  topic: linear-attention
  tasks: [C20-linear-attention]
  difficulty: medium
  kind: mcq
  question: "Чем при генерации заменяется KV-cache у causal линейного внимания?"
  options:
    - "Ничем: KV-cache нужен так же, как в softmax-attention"
    - "Кешем только ключей, значения пересчитываются"
    - "Состоянием S = Σ φ(k)vᵀ размера d × dv и вектором z = Σ φ(k) — их размер не зависит от длины"
    - "Скользящим окном последних W токенов"
  correct: 2
  answer: >
    Causal-сумма по прошлому накапливается рекуррентно: S_t = S_{t−1} + φ(k_t)v_tᵀ, z_t = z_{t−1} + φ(k_t),
    выход φ(q_t)ᵀS_t / φ(q_t)ᵀz_t. Это RNN с состоянием фиксированного размера: память O(1) по длине.
  source: course
- id: linear-attn-tradeoff-01
  topic: linear-attention
  tasks: [C20-linear-attention]
  difficulty: medium
  kind: open
  question: "Почему чистое линейное внимание уступает softmax и почему его всё равно используют в гибридах?"
  answer: >
    Вся история сжата в матрицу d × dv, которая только накапливает (S += φ(k)vᵀ) и ничего не забывает и не
    перезаписывает: при длинном контексте ключи интерферируют, и точное извлечение (найти факт из начала
    документа) деградирует. Плюс φ(q)·φ(k) хуже, чем exp, выделяет один нужный ключ. Зато генерация идёт с
    постоянной памятью и временем на токен. Отсюда DeltaNet (правило дельты вместо простого накопления),
    гейты забывания и гибриды, где несколько линейных слоёв чередуются с полным attention.
  source: course
- id: linear-attn-norm-01
  topic: linear-attention
  tasks: [C20-linear-attention, C20d-linear-attention-debug]
  difficulty: medium
  kind: code-reading
  question: >
    Causal-форму написали так: `A = (φq @ φk.T).tril()`, `out = (A @ v) / (φq @ φk.sum(-2).unsqueeze(-1))`.
    Рекуррентная форма считает по-другому. Где ошибка и как её заметить одним тестом?
  answer: >
    Знаменатель взят из некаузальной формы — по всем ключам, а числитель только по прошлым. Веса не
    суммируются в 1 и будущие ключи влияют на выход через нормировку. Тест: подать v = const — правильная
    реализация вернёт ту же константу во всех позициях, ошибочная — меньшие числа в начале. Совпадает с
    рекуррентной формой такая реализация лишь в последней позиции.
  source: course
- id: linear-attn-feature-map-01
  topic: linear-attention
  tasks: [C20-linear-attention]
  difficulty: easy
  kind: mcq
  question: "Почему в «Transformers are RNNs» φ(x) = elu(x) + 1, а не, например, ReLU или тождество?"
  options:
    - "elu быстрее считается на GPU"
    - "φ должна быть строго положительной: тогда все веса > 0, а знаменатель не близок к нулю"
    - "elu(x) + 1 точно равна exp(x)"
    - "ReLU не дифференцируема, обучение невозможно"
  correct: 1
  answer: >
    Веса φ(q)·φ(k) играют роль ненормированных вероятностей: они должны быть неотрицательными, а их сумма — не
    нулевой. При тождестве веса бывают отрицательными, знаменатель может пройти через ноль. ReLU даёт нули,
    и у запроса может не оказаться ни одного ненулевого веса. elu(x) + 1 > 0 всюду и гладкая.
  source: course
