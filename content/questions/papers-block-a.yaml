# Вопросы на понимание статей блока A. Ответы — пересказ идей своими словами, без цитат из статей.
- id: paper-backprop-hidden-01
  topic: autograd
  tasks: [A-P1-backprop]
  difficulty: medium
  kind: open
  question: "Rumelhart et al., 1986: какую проблему скрытых слоёв решает обратное распространение ошибки?"
  answer: >
    Для выходных нейронов ясно, каким должен быть ответ, а для скрытых — нет: никто не говорит, какие признаки им
    представлять. Старые правила обучения (перцептрон, дельта-правило) меняли только веса, для которых известна
    желаемая активация. Backprop выводит «ошибку» скрытого нейрона из ошибок следующего слоя по chain rule: это
    производная общего лосса по его активации. В результате все веса обучаются одной процедурой градиентного
    спуска, а скрытые нейроны сами находят полезные внутренние представления.
  source: course
- id: paper-backprop-init-01
  topic: autograd
  tasks: [A-P1-backprop]
  difficulty: easy
  kind: open
  question: "Почему веса нейросети инициализируют маленькими случайными числами, а не нулями?"
  answer: >
    Если все веса одинаковые (например, нули), нейроны одного слоя считают одно и то же и получают одинаковые
    градиенты. После каждого шага они остаются копиями друг друга, и слой из H нейронов работает как один. Случайная
    инициализация нарушает эту симметрию. Веса берут маленькими, чтобы сигмоиды и tanh не насыщались с первого шага.
    Как подобрать масштаб точнее, разберём в модуле 2 (Xavier/Kaiming).
  source: course
- id: paper-backprop-momentum-01
  topic: training
  tasks: [A-P1-backprop]
  difficulty: medium
  kind: open
  question: "Какое дополнительное слагаемое кроме −ε·∂E/∂w стоит в правиле обновления весов в статье 1986 года и зачем оно?"
  answer: >
    Слагаемое, пропорциональное предыдущему изменению веса: Δw(t) = −ε ∂E/∂w + α Δw(t−1). Это momentum. Шаг
    накапливает скорость в направлениях, где градиент стабильно одного знака, и гасит колебания там, где знак
    скачет, например поперёк узкого оврага функции потерь. Тот же приём живёт в SGD с momentum и в первом моменте
    Adam.
  source: course
- id: paper-autodiff-kinds-01
  topic: autograd
  tasks: [A-P1-backprop]
  difficulty: medium
  kind: open
  question: "Чем автоматическое дифференцирование отличается от численного и от символьного?"
  answer: >
    Численное дифференцирование (конечные разности, A02) приближённое, требует O(n) вызовов функции и страдает от
    ошибок округления. Символьное строит формулу производной. Выражения при этом разрастаются, и ему нужна функция
    в замкнутом виде, без циклов и ветвлений. AD применяет chain rule к последовательности элементарных операций,
    которые реально выполнились в программе. Результат точный до округления, работают любые циклы и условия, а
    стоимость — небольшая константа от стоимости самой функции.
  source: course
- id: paper-autodiff-cost-01
  topic: autograd
  tasks: [A-P1-backprop]
  difficulty: hard
  kind: open
  question: "Сколько стоит градиент в обратном режиме AD по времени и по памяти, если f: Rⁿ → R?"
  answer: >
    По времени — небольшое постоянное число вычислений f, не зависящее от n. Обратный проход повторяет граф в
    обратную сторону, и на каждую операцию приходится несколько операций с локальными производными. По памяти —
    пропорционально длине вычисления: нужно сохранить промежуточные значения прямого прохода (tape / граф), потому
    что от них зависят локальные производные. Прямой режим, наоборот, почти не требует памяти, но за проход даёт
    производную только по одному входу, то есть нужно n проходов.
  source: course
- id: paper-adam-stepsize-01
  topic: training
  tasks: [A-P2-adam-adamw]
  difficulty: medium
  kind: open
  question: "Kingma & Ba: почему эффективный шаг Adam примерно ограничен learning rate и почему это удобно?"
  answer: >
    Шаг равен α·m̂/(√v̂ + ε). m̂ — среднее градиента, √v̂ — корень из среднего квадрата, поэтому их отношение по модулю
    обычно не больше 1 и равно 1, когда градиент стабилен по знаку. Получается, что каждая координата сдвигается
    примерно на α или меньше, независимо от масштаба градиента. Это удобно: α задаёт «доверительную область» для
    параметров, его легче подобрать, и он переносится между задачами. Когда градиент шумный (m̂ мало по сравнению
    с √v̂), шаг автоматически уменьшается — авторы сравнивают это с отношением сигнал/шум.
  source: course
- id: paper-adam-bias-01
  topic: training
  tasks: [A-P2-adam-adamw]
  difficulty: medium
  kind: open
  question: "Kingma & Ba: что сломается без bias correction при β₂, близком к 1?"
  answer: >
    v стартует с нуля, и при β2 = 0.999 после t шагов на реальные градиенты приходится лишь доля 1 − β2^t, на первых
    шагах около 0.1%. Без поправки √v сильно занижено, деление на него раздувает шаг, и первые обновления
    получаются в разы больше задуманного α. Это может дестабилизировать начало обучения. m тоже занижено, но при
    β1 = 0.9 оно выходит из этого режима за десяток шагов. Деление на 1 − β^t делает оценки несмещёнными с первого
    шага.
  source: course
- id: paper-adamw-l2-01
  topic: training
  tasks: [A-P2-adam-adamw]
  difficulty: medium
  kind: open
  question: "Loshchilov & Hutter: почему L2-регуляризация и weight decay совпадают для SGD, но различаются для Adam?"
  answer: >
    В SGD градиент L2-слагаемого λθ просто прибавляется к шагу: θ ← θ − η(g + λθ) = θ(1 − ηλ) − ηg. Это и есть
    weight decay с коэффициентом ηλ. В Adam λθ попадает в моменты и делится на √v̂, причём у каждой координаты свой
    множитель. Веса с большими градиентами регуляризуются слабее, чем задумано, и эквивалентность пропадает.
    Авторы предлагают применять decay отдельно, θ ← θ(1 − ηλ), а затем делать шаг Adam (AdamW). Так у всех весов
    одинаковое относительное затухание, и лучшие lr и λ меньше зависят друг от друга.
  source: course
- id: paper-adamw-schedule-01
  topic: training
  tasks: [A-P2-adam-adamw]
  difficulty: easy
  kind: open
  question: "Как связаны cosine-расписание learning rate и статья SGDR?"
  answer: >
    В SGDR (Loshchilov & Hutter) learning rate в каждом цикле опускается по косинусу от максимума до минимума, а затем
    цикл перезапускается (warm restart). У LLM обычно один цикл без перезапусков, перед ним warmup и в конце
    min_lr около 10% от пика. В статье про AdamW авторы комбинируют decoupled decay с таким расписанием (AdamWR) и
    отмечают, что λ лучше масштабировать с длиной обучения.
  source: course
- id: paper-glorot-saturation-01
  topic: training
  tasks: [A-P2b-init-nplm]
  difficulty: medium
  kind: open
  question: "Glorot & Bengio 2010: что плохого происходит с сигмоидой в глубокой сети при стандартной инициализации?"
  answer: >
    Активации последнего скрытого слоя быстро уходят в насыщение около 0. У сигмоиды это означает, что выход
    нейрона почти не зависит от входа, а производная мала. Градиенты к нижним слоям затухают, и обучение надолго
    застревает на плато, из которого сеть выходит медленно. Симметричные активации с нулём в центре (tanh, softsign)
    и масштаб весов, который сохраняет дисперсию сигнала по слоям, эту проблему смягчают. Отсюда и
    «нормализованная» (Xavier) инициализация.
  source: course
- id: paper-he-depth-01
  topic: training
  tasks: [A-P2b-init-nplm]
  difficulty: medium
  kind: open
  question: "He et al. 2015: почему для ReLU нужна дисперсия весов 2/n и что показали эксперименты с глубиной?"
  answer: >
    ReLU обнуляет половину входа, и второй момент активаций уменьшается вдвое на каждом слое. Чтобы дисперсия
    сигнала сохранялась, нужна Var(w) = 2/n_in (авторы показывают, что достаточно условия только для прямого или только
    для обратного прохода). С Xavier, где коэффициент 1, сигнал в глубокой ReLU-сети затухает как 2^(−L/2). В
    экспериментах авторов сеть из 30 слоёв с Xavier не начинала учиться, а с их инициализацией сходилась.
  source: course
- id: paper-bengio-curse-01
  topic: training
  tasks: [A-P2b-init-nplm]
  difficulty: medium
  kind: open
  question: "Bengio et al. 2003: что такое «проклятие размерности» для языковых моделей и как его обходит нейросетевая модель?"
  answer: >
    Число возможных последовательностей из n слов растёт как V^n, и почти все они ни разу не встречаются в обучающем
    тексте. n-граммная модель вынуждена сглаживать и откатываться к коротким контекстам. Нейросетевая модель учит
    вектор признаков для каждого слова и гладкую функцию от склеенных векторов окна. Похожие слова получают похожие
    векторы, и вероятность невиденного сочетания оценивается по похожим виденным. Число параметров растёт линейно
    с размером словаря и окна. По перплексии модель обошла сглаженные n-граммы.
  source: course
- id: paper-bpe-oov-01
  topic: tokenization
  tasks: [A-P3-bpe]
  difficulty: medium
  kind: open
  question: "Sennrich et al. 2016: какую проблему машинного перевода решает BPE и чем это лучше словаря слов с запасным словарём для редких слов?"
  answer: >
    Нейросетевой перевод того времени работал с фиксированным словарём из десятков тысяч слов, а имена, составные
    слова и редкие формы становились неизвестным токеном. Обычный обходной путь — заменить неизвестное слово и потом
    подставить перевод из внешнего словаря — не умеет переводить то, чего нет в словаре, и не видит внутреннего
    устройства слов. Авторы предлагают переводить последовательности подслов: редкое слово разбивается на частые
    куски (корни, суффиксы, части составных слов), и модель учится переводить их, как человек переводит незнакомое
    составное слово по частям. Словарь конечен, а словарь слов, которые можно записать, — открытый.
  source: course
- id: paper-bpe-algorithm-01
  topic: tokenization
  tasks: [A-P3-bpe]
  difficulty: medium
  kind: open
  question: "Sennrich et al. 2016: откуда взят алгоритм BPE и как его изменили для текста? Чем их вариант отличается от byte-level BPE из A11?"
  answer: >
    BPE пришёл из сжатия данных (Gage, 1994): там самая частая пара байтов заменяется неиспользуемым байтом. В статье
    стартовые единицы — символы, слияния делаются только внутри слов (слова считаются по частотам, пары через пробел
    не сливаются), а конец слова помечен отдельным символом, чтобы после декодирования восстановить границы. Число
    слияний — гиперпараметр, итоговый словарь = символы + слияния. Byte-level BPE из A11 стартует с 256 байтов,
    поэтому неизвестных символов нет вовсе, а роль «внутри слов» играет пре-токенизация из A13, где пробел — часть
    куска, и отдельный символ конца слова не нужен.
  source: course
- id: paper-bpe-joint-01
  topic: tokenization
  tasks: [A-P3-bpe]
  difficulty: hard
  kind: open
  question: "Sennrich et al. 2016: зачем обучать один общий BPE на исходном и целевом языке, а не два отдельных?"
  answer: >
    Имена и заимствования в двух языках часто пишутся похоже. Если слияния учатся раздельно, одно и то же имя может
    разбиться на разные куски в исходной фразе и в переводе, и модели труднее выучить, что их надо просто
    скопировать или транслитерировать. Общий набор слияний на объединённом корпусе делает разбиения согласованными.
    Для пары с разными алфавитами (английский и русский) авторы учили общий BPE на тексте, где кириллица
    транслитерирована в латиницу. Это тот же мотив, что у многоязычных токенизаторов LLM: одинаковые куски должны
    кодироваться одинаково.
  source: course
- id: paper-gpt2-input-01
  topic: tokenization
  tasks: [A-P3-bpe]
  difficulty: medium
  kind: open
  question: "GPT-2 (раздел 2.2): почему авторы выбрали BPE на байтах, а не на символах Unicode и не чистую байтовую модель?"
  answer: >
    Модели прямо на байтах в тот момент заметно уступали моделям на словах на больших корпусах, а последовательности
    у них длиннее. BPE на символах Unicode требовал бы стартового словаря больше 130 тысяч символов, ещё до любых
    слияний, — это больше всего бюджета словаря. BPE на байтах начинает с 256 символов, может закодировать любую
    строку (ни предобработки, ни неизвестных токенов) и при этом получает выгоду словаря подслов. Поэтому модель
    можно оценивать на любом датасете без его специальной токенизации.
  source: course
- id: paper-gpt2-categories-01
  topic: tokenization
  tasks: [A-P3-bpe]
  difficulty: medium
  kind: open
  question: "GPT-2 (раздел 2.2): какую проблему наивного byte-level BPE заметили авторы и как её решает регулярка из A13?"
  answer: >
    Жадные слияния по частоте склеивают частые слова с пунктуацией, и в словаре появляются варианты вроде «dog.»,
    «dog!», «dog?». Это тратит словарь и дробит статистику одного слова. Авторы запретили слияния между разными
    категориями символов (буквы, цифры, пунктуация), с исключением для пробела, который можно приклеить к началу
    слова. В коде это реализовано именно регуляркой пре-токенизации: она режет текст на куски одной категории, и
    BPE работает внутри куска.
  source: course
