id: embedding-space
title: "Пространство эмбеддингов до и после контрастивного обучения"
description: >
  Предзаписанный прогон проекта B20 (данные — content/viz/embedding-space.data.json, записаны командой
  `solution.py --record`): проекция PCA эмбеддингов 200 абзацев на плоскость, гистограммы косинусов «свой» и
  «чужой» пары до и после обучения, средний косинус случайных пар (анизотропия) и recall@k по шагам.
