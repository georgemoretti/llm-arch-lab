# Вопросы на понимание статей модуля 4 (задание C-P4): Transformers are RNNs, DeltaNet / Gated DeltaNet,
# Gated Attention, Mamba-2, DeepSeek-V3.2 (DSA). Ответы — пересказ идей своими словами, без цитат из статей.
- id: paper-linrnn-speed-01
  topic: linear-attention
  tasks: [C-P4-efficient-attention]
  difficulty: medium
  kind: open
  question: "Откуда в «Transformers are RNNs» ускорение именно авторегрессионной генерации, а не только обучения?"
  answer: >
    Softmax-трансформер на каждом новом токене читает весь KV-cache — шаг стоит O(t), вся генерация O(T²).
    Causal линейное внимание переписывается как RNN: на шаге обновляются S += φ(k)vᵀ и z += φ(k), выход
    считается из них — шаг стоит O(1) по длине и не требует растущего кеша. На длинных последовательностях
    разница в порядках величины, о чём и сообщают авторы.
  source: course
- id: paper-gdn-householder-01
  topic: linear-attention
  tasks: [C-P4-efficient-attention]
  difficulty: hard
  kind: open
  question: "Почему DeltaNet долго не обучали параллельно по длине и что изменила работа Yang et al. (2024)?"
  answer: >
    У линейного внимания состояние — сумма независимых слагаемых, её легко считать параллельно (cumsum или
    маскированная матрица). У DeltaNet каждый шаг умножает состояние на зависящую от токена матрицу
    I − β k kᵀ, поэтому прямой развёртки в сумму нет, и ранние реализации шли последовательно. Авторы заметили,
    что произведение таких матриц (обобщённых отражений Хаусхолдера) компактно представляется (WY-форма), и
    построили чанковый алгоритм: внутри чанка — матричные операции, между чанками — короткая рекуррентность.
  source: course
- id: paper-gdn-complement-01
  topic: linear-attention
  tasks: [C-P4-efficient-attention]
  difficulty: medium
  kind: open
  question: "Почему в Gated DeltaNet гейт и правило дельты называют взаимодополняющими?"
  answer: >
    Гейт (как в Mamba-2) умеет быстро и целиком ослабить память, но не может точно поправить одну
    ассоциацию. Правило дельты точно перезаписывает значение по ключу, но не умеет быстро забыть всё
    устаревшее — память держит старое, пока по тем же направлениям не придут новые ключи. Вместе: гейт
    отвечает за забывание, дельта — за точные записи; по замерам авторов комбинация лучше каждой по отдельности.
  source: course
- id: paper-gattn-position-01
  topic: attention
  tasks: [C-P4b-gated-attention-dsa]
  difficulty: medium
  kind: mcq
  question: "Какой вариант гейта авторы Gated Attention считают лучшим и ставят в Qwen3-Next?"
  options:
    - "Скалярный гейт на весь слой перед attention"
    - "Гейт на ключах до softmax"
    - "Поэлементный сигмоидный гейт на выходе SDPA, свой у каждой головы и зависящий от запроса"
    - "Гейт на residual после o_proj"
  correct: 2
  answer: >
    Лучший результат дал гейт сразу после scaled dot-product attention: σ(W_g x) поэлементно, свой у каждой
    головы, вычисляемый из текущего токена. Его и реализует C19.
  source: course
- id: paper-gattn-sink-01
  topic: attention
  tasks: [C-P4b-gated-attention-dsa]
  difficulty: hard
  kind: open
  question: "Как выходной гейт связан с attention sink и massive activations?"
  answer: >
    Без гейта голове, которой нечего добавить, всё равно приходится раздать вес 1 — она сбрасывает его на первый
    токен, и у этого токена вырастают огромные активации, нужные, чтобы он стабильно «притягивал» внимание. Гейт
    позволяет голове обнулить свой выход для конкретного запроса, поэтому стоку незачем возникать. Авторы
    показывают, что у гейтированных моделей доля внимания на первом токене и пиковые активации резко падают, а
    экстраполяция на длинный контекст улучшается.
  source: course
- id: paper-mamba2-scalar-01
  topic: ssm
  tasks: [C-P4-efficient-attention]
  difficulty: medium
  kind: open
  question: "Зачем Mamba-2 сужает матрицу перехода A до скаляра на голову по сравнению с Mamba-1?"
  answer: >
    Со скалярным затуханием маска L_ts = Π e^{Δ_r A} одна на всю голову, и вся модель становится attention-подобной
    матрицей (L ⊙ CBᵀ), которую можно считать матричными умножениями на тензорных ядрах. Это в разы быстрее
    скана Mamba-1 и позволяет брать гораздо больший размер состояния N (128 по умолчанию против 16 у Mamba-1).
    Выразительность одной головы падает, но её компенсируют числом голов и размером состояния.
  source: course
- id: paper-dsa-training-01
  topic: sparse-attention
  tasks: [C-P4b-gated-attention-dsa]
  difficulty: medium
  kind: open
  question: "Как DeepSeek-V3.2 переводит готовую плотную модель на DSA, не обучая её с нуля?"
  answer: >
    Продолженным обучением в два этапа. Сначала короткий прогрев с плотным attention: все веса заморожены, учится
    только индексатор — его распределение подгоняют KL-дивергенцией к сумме весов внимания основных голов. Затем
    включается выбор top-k и учится вся модель: основная часть — на языковом лоссе, индексатор — на своём KL по
    выбранным ключам, причём вход индексатора отсоединён от графа основной модели.
  source: course
