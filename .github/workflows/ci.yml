name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12", weights: true}
          - {os: macos-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    env:
      PYTHONUTF8: "1"          # Windows: консоль и файлы в UTF-8 (вывод курса — на русском)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only PyTorch)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then pip install torch; else pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -e . "httpx>=0.27"
      - name: Install weights extras (transformers — для сверки на игрушечных моделях, без скачивания весов)
        if: matrix.weights
        run: pip install -e ".[weights]"
      - name: Environment
        run: llmlab doctor --quick
      - name: Platform tests
        run: pytest tests/
      - name: Course invariants
        run: llmlab validate --all

  install:
    # Установка с нуля так, как в README: uv sync → llmlab doctor (с пробным прогоном тестов).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: uv sync
        run: uv sync
      - name: llmlab doctor
        run: uv run llmlab doctor

  frontend:
    # Собранный бандл коммитится в llmlab/static — проверяем, что он соответствует исходникам.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - name: Bundle is up to date
        run: |
          git diff --exit-code --stat llmlab/static || {
            echo "Бандл устарел. Пересобери фронтенд: cd web && npm run build"
            exit 1
          }
