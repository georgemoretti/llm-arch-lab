id: unpadding
title: "Unpadding: батч с паддингом против упаковки"
description: >
  Длины текстов ползунками: батч с паддингом [B, T] и упаковка [N] с границами cu_seqlens, позиции RoPE с нуля у каждого
  текста, блочно-диагональная маска упаковки (и окно ModernBERT внутри блока) и доля работы, которую съедает паддинг
  в линейных слоях и в attention. Переключатель ошибки «cu_seqlens со сдвигом на 1» показывает, как соседние тексты
  начинают видеть друг друга.
