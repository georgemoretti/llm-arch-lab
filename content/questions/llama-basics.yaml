# Вопросы курса к модулю 1 (GPT-2 → Llama): RMSNorm, SwiGLU, RoPE.
# Ответы написаны авторами курса. Полный квиз модуля (C-Q1) — в фазе 3b.
- id: rmsnorm-vs-layernorm-01
  topic: normalization
  tasks: [C01-rmsnorm]
  difficulty: easy
  kind: open
  question: "Чем RMSNorm отличается от LayerNorm и почему от этого не страдает качество?"
  answer: >
    RMSNorm не вычитает среднее и не имеет сдвига β: вектор делится на корень из среднего
    квадрата и умножается на γ. Эксперименты авторов показали, что полезный эффект нормализации
    в основном даёт инвариантность к масштабу входа, а центрирование почти ничего не добавляет.
    Взамен — одна редукция вместо двух и меньше параметров, то есть слой чуть быстрее.
  source: course
- id: rmsnorm-eps-01
  topic: normalization
  tasks: [C01-rmsnorm, C01d-rmsnorm-debug]
  difficulty: medium
  kind: open
  question: "Где стоит eps в RMSNorm Llama и что сломается, если перенести его за корень?"
  answer: >
    Под корнем: x / sqrt(mean(x²) + eps). Вариант x / (sqrt(mean(x²)) + eps) тоже не делит на
    ноль, но даёт другие числа, когда mean(x²) сравним с eps (маленькие активации): там
    делитель отличается в разы. Модель, обученная с одной формулой, при загрузке в код с другой
    выдаёт расходящиеся активации, и разница копится по слоям.
  source: course
- id: rmsnorm-precision-01
  topic: normalization
  tasks: [C01-rmsnorm]
  difficulty: medium
  kind: open
  question: "Зачем RMSNorm в Llama считают в float32, если веса и активации в bf16/fp16?"
  answer: >
    Квадраты активаций легко выходят за диапазон fp16 (максимум ≈ 65 504, переполнение уже при
    |x| > 256), а в bf16 у суммы квадратов мало значащих бит, и среднее получается грубым.
    Поэтому вход приводят к float32, нормируют и возвращают в исходный dtype; на скорость это
    почти не влияет, а численно стабильнее.
  source: course
- id: swiglu-formula-01
  topic: ffn
  tasks: [C02-swiglu, C02d-swiglu-debug]
  difficulty: easy
  kind: open
  question: "Запишите SwiGLU-FFN Llama. Какие матрицы в нём есть и к какой ветке применяется SiLU?"
  answer: >
    FFN(x) = W_down · (SiLU(W_gate·x) ⊙ (W_up·x)). Три матрицы без bias: gate и up (C → F) и
    down (F → C). SiLU применяется только к ветке gate; ветка up остаётся линейной, а
    поэлементное произведение «открывает» и «закрывает» её каналы.
  source: course
- id: swiglu-hidden-01
  topic: ffn
  tasks: [C02-swiglu]
  difficulty: medium
  kind: open
  question: "Почему скрытый размер SwiGLU-FFN обычно ≈ 8/3·d, а не 4·d, как в GPT-2?"
  answer: >
    У SwiGLU три матрицы вместо двух. Чтобы число параметров (и FLOPs) совпало с классическим
    MLP 2·d·4d = 8d², скрытый размер F берут из 3·d·F = 8d², то есть F = 8d/3, и округляют до
    кратного удобного числа. У Llama 3 8B есть ещё множитель 1.3, поэтому F = 14 336 = 3.5·d.
  source: course
- id: rope-relative-01
  topic: positional-encoding
  tasks: [C03-rope, C03d-rope-debug]
  difficulty: medium
  kind: open
  question: "Почему с RoPE скалярное произведение q_m·k_n зависит только от m − n?"
  answer: >
    RoPE поворачивает каждую пару координат на угол, пропорциональный позиции: q_m = R(mθ)q,
    k_n = R(nθ)k. Повороты ортогональны и коммутируют, поэтому ⟨R(mθ)q, R(nθ)k⟩ =
    ⟨q, R((n−m)θ)k⟩ — абсолютные позиции сокращаются, остаётся только разность. Позиционная
    информация попадает в attention, а модель не привязана к абсолютным номерам.
  source: course
- id: rope-where-01
  topic: positional-encoding
  tasks: [C03-rope]
  difficulty: easy
  kind: open
  question: "К каким тензорам применяется RoPE и почему не к V и не к эмбеддингам на входе?"
  answer: >
    Только к q и k внутри каждого слоя attention, после проекций и разбиения на головы. Позиция
    нужна лишь для оценок сходства q·k; значения v просто усредняются с весами, и поворачивать
    их незачем. Эмбеддинги на входе остаются без позиций — это и есть отличие от обучаемых
    абсолютных позиций GPT-2.
  source: course
- id: rope-theta-01
  topic: positional-encoding
  tasks: [C03-rope]
  difficulty: hard
  kind: open
  question: "Что задаёт параметр θ (rope_theta) и зачем Llama 3 увеличила его до 500 000?"
  answer: >
    Частоты пар равны θ^(−2i/D): первые пары вращаются быстро (различают соседние позиции),
    последние — очень медленно (кодируют дальние расстояния). Чем больше θ, тем медленнее самые
    медленные пары и тем больше расстояний модель может различить, прежде чем углы «обернутся».
    Это помогает работать с длинным контекстом; Llama 2 использовала 10 000, Llama 3 — 500 000.
  source: course
