# Вопросы с собеседований пользователя (source: user-db), переформулированные своими словами, с эталонными
# ответами курса. Тема: прикладные NLP/ML-пайплайны — документы и OCR, суммаризация, перенос с API на свою
# модель, рекомендации, дрейф данных — вне тем курса (topic: other). Правила — docs/QUESTIONS_IMPORT.md.
- id: iv-pipelines-01
  topic: other
  tags: [nlp-pipelines, documents]
  difficulty: medium
  kind: open
  question: "С какими типами документов приходится работать при извлечении текста и какими инструментами это делают?"
  answer: >
    Текстовые PDF (есть слой текста): pdfplumber, PyMuPDF, pypdf; сканы и фото (нужен OCR): Tesseract, PaddleOCR,
    EasyOCR, облачные OCR; офисные форматы: python-docx, openpyxl, LibreOffice для конвертации; HTML — парсеры
    вроде BeautifulSoup. Комплексные конвертеры, которые понимают структуру (заголовки, таблицы, списки) и выдают
    Markdown: unstructured, docling, marker, а также мультимодальные LLM для сложных страниц. Сначала определить
    тип документа (есть ли текстовый слой), потом выбрать путь.
  source: user-db
  source_ref: ["3567118467", "ab3a46bd6e", "a3f6958daa"]
- id: iv-pipelines-02
  topic: other
  tags: [nlp-pipelines, documents, ocr]
  difficulty: medium
  kind: open
  question: "Как распознавать таблицы и сложную вёрстку (многоколоночный текст, чертежи) на изображениях документов?"
  answer: >
    Двухэтапно: анализ макета (layout detection) — модель-детектор находит на странице блоки (текст, заголовок,
    таблица, рисунок, формула), например LayoutLMv3, DocLayout-YOLO, PP-Structure из PaddleOCR; затем каждый блок
    обрабатывается своим методом. Для таблиц — распознавание структуры (Table Transformer, PP-Structure): строки,
    столбцы и объединённые ячейки, плюс OCR содержимого. Порядок чтения восстанавливается по координатам блоков.
    Для чертежей нужны специализированные детекторы условных обозначений и OCR размеров; всё чаще используют
    мультимодальные LLM/VLM, которые сразу выдают Markdown или JSON, но их результат надо проверять.
  source: user-db
  source_ref: ["7446f0988d", "cd9964f8c3", "f8def3f1ba", "f99c836e6b", "4bb396399e"]
- id: iv-pipelines-03
  topic: other
  tags: [nlp-pipelines, ocr]
  difficulty: easy
  kind: open
  question: "Что представляет собой PaddleOCR?"
  answer: >
    Открытый набор инструментов OCR от Baidu на фреймворке PaddlePaddle: детекция текстовых областей,
    классификация ориентации, распознавание строк, много языков, лёгкие модели для CPU и мобильных устройств. В
    составе — PP-Structure для анализа макета документа и распознавания таблиц. Популярен как бесплатная и
    достаточно точная альтернатива облачным OCR.
  source: user-db
  source_ref: ["db80d407f8"]
- id: iv-pipelines-04
  topic: other
  tags: [nlp-pipelines, retrieval]
  difficulty: easy
  kind: open
  question: "Что такое семантический поиск и чем он отличается от поиска по ключевым словам?"
  answer: >
    Поиск по смыслу: запрос и документы переводятся моделью в векторы, близкие по смыслу тексты оказываются
    рядом, и выдача строится по сходству векторов (обычно через ANN-индекс). В отличие от поиска по словам он
    находит перефразы и синонимы («как сбросить пароль» ↔ «восстановление доступа»), но может промахнуться на
    точных идентификаторах — поэтому его часто комбинируют с BM25.
  source: user-db
  source_ref: ["e360187b2c"]
- id: iv-pipelines-05
  topic: other
  tags: [nlp-pipelines, summarization]
  difficulty: medium
  kind: open
  question: "Как суммаризировать очень длинный текст (например, расшифровку многочасовых встреч), который не помещается в один вызов модели?"
  answer: >
    Иерархически. Map-reduce: разрезать по смысловым границам (темам, спикерам, времени), суммаризировать каждый
    кусок с одинаковой инструкцией, затем суммаризировать сводки (при необходимости в несколько уровней).
    Refine: идти по кускам, обновляя накопленное резюме. Помогает извлекать структурированные заметки (решения,
    задачи, ответственные) на первом шаге, а не «пересказ», и ссылаться на исходные фрагменты. Модель с длинным
    контекстом снимает часть проблемы, но качество на середине длинного входа падает, поэтому иерархия часто всё
    равно лучше.
  source: user-db
  source_ref: ["d1bf7db289", "0fb1c3f517"]
- id: iv-pipelines-06
  topic: other
  tags: [nlp-pipelines, summarization]
  difficulty: medium
  kind: open
  question: "Как построить сервис транскрибации встреч с последующей суммаризацией на платной модели?"
  answer: >
    Аудио → распознавание речи (Whisper или облачный ASR) с таймкодами → диаризация (кто говорит, например
    pyannote) → чистка расшифровки → суммаризация LLM по шаблону (повестка, решения, задачи с ответственными и
    сроками), для длинных встреч — иерархически. С закрытой моделью через API важно: промпт с чётким форматом и
    примерами, structured output, лимиты и повторы при ошибках, кеширование, контроль стоимости, соответствие
    требованиям к данным (можно ли отправлять записи наружу), логирование для оценки качества.
  source: user-db
  source_ref: ["44bcba6cc3", "c89cb22c9c"]
- id: iv-pipelines-07
  topic: other
  tags: [nlp-pipelines, summarization, fine-tuning]
  difficulty: hard
  kind: open
  question: "Суммаризацию нужно перенести с платного API на свою модель, а после переноса качество упало. Как переходить и что делать?"
  answer: >
    До перехода — зафиксировать качество текущей системы на golden set и метриках (LLM-судья по полноте и
    фактической точности, человеческая оценка), чтобы было с чем сравнивать. Затем: подобрать открытую модель
    нужного размера и проверить её с тем же промптом; если хуже — адаптировать промпт под неё, разбить задачу
    на шаги (извлечение фактов → сборка резюме), дообучить (LoRA) на парах «расшифровка → резюме»,
    сгенерированных платной моделью (дистилляция) и проверенных людьми. Анализировать, где именно провал (длинные
    входы, формат, пропуск фактов, галлюцинации), и чинить точечно; не выключать старую систему до достижения
    паритета на метриках.
  source: user-db
  source_ref: ["f9236406f7", "3f1fa4e443", "f5de32bb9c"]
- id: iv-pipelines-08
  topic: other
  tags: [nlp-pipelines, summarization]
  difficulty: medium
  kind: open
  question: "Модель при суммаризации «залипает» на части контекста — пересказывает начало и теряет середину. Как с этим бороться?"
  answer: >
    Это эффект «потери середины»: на длинном входе модели лучше используют начало и конец. Решения: не подавать
    всё сразу — иерархическая суммаризация по кускам; сначала извлечь список тем или пунктов по всему тексту,
    потом раскрыть каждый; явная структура в инструкции (по разделам, по спикерам) и требование покрыть каждый
    раздел; модель с хорошим длинным контекстом; проверка покрытия — LLM-судья сверяет резюме с перечнем тем.
  source: user-db
  source_ref: ["4ebdd8f9c9"]
- id: iv-pipelines-09
  topic: other
  tags: [nlp-pipelines, documents]
  difficulty: medium
  kind: open
  question: "Как сравнивать две версии документа (например, договора) и находить существенные изменения?"
  answer: >
    Сначала привести обе версии к тексту с сохранённой структурой (пункты, разделы). Затем выровнять пункты (по
    нумерации, заголовкам или по сходству эмбеддингов, если структура поменялась) и для пар выполнить текстовый
    diff (difflib, diff-match-patch) — он покажет буквальные изменения. Чтобы отделить существенное от
    косметики, поверх diff использовать LLM: классифицировать изменения (сумма, срок, обязательства, редакторская
    правка) и кратко описать их смысл со ссылкой на пункт.
  source: user-db
  source_ref: ["a47ae74bca"]
- id: iv-pipelines-10
  topic: other
  tags: [nlp-pipelines, generation]
  difficulty: easy
  kind: open
  question: "Нужно автоматически писать типовые деловые письма с подстановкой данных. Нужна ли тут LLM и если да, то какая?"
  answer: >
    Если письма почти одинаковые — шаблонизатор (Jinja) с подстановкой полей, без LLM: дёшево и предсказуемо. Если
    нужен свободный текст под ситуацию — небольшая или средняя инструктивная модель (открытая 7–8B или недорогой
    API) с промптом: шаблон-структура, тон, несколько примеров, данные в структурированном виде; ограничения на
    длину и обязательные элементы, проверка фактов (суммы, даты подставлять кодом, а не генерировать). Дообучение
    нужно только при большом объёме и строгом корпоративном стиле.
  source: user-db
  source_ref: ["feab5f10ad"]
- id: iv-pipelines-11
  topic: other
  tags: [computer-vision, system-design]
  difficulty: hard
  kind: open
  question: "Опиши архитектуру сервиса, который в реальном времени детектирует объекты на потоках с десятков камер."
  answer: >
    Приём потоков (RTSP) → декодирование (желательно на GPU: NVDEC, GStreamer/DeepStream) → прореживание кадров
    по нужной частоте → батчинг кадров с нескольких камер → детектор (YOLO, экспорт в TensorRT/ONNX, FP16/INT8) →
    трекинг объектов между кадрами (ByteTrack, DeepSORT) → бизнес-логика (зоны, подсчёт, события) → очередь
    событий (Kafka) и хранение метаданных, а не видео целиком. Масштабирование горизонтальное по камерам;
    мониторинг задержки, пропущенных кадров, загрузки GPU; периодическое дообучение детектора на сложных кадрах.
  source: user-db
  source_ref: ["6a5c318865"]
- id: iv-pipelines-12
  topic: other
  tags: [classic-ml]
  difficulty: medium
  kind: open
  question: "Как обучить модель на данных, которые нельзя забирать с устройств пользователей или из разных организаций?"
  answer: >
    Модель учится на данных, которые не покидают устройств или организаций: сервер рассылает текущие веса,
    участники обучают их локально на своих данных и отправляют обратно только обновления, сервер их усредняет
    (FedAvg) и повторяет раунд. Нужно, когда данные нельзя собрать централизованно из-за приватности или
    регуляторики (клавиатуры телефонов, больницы, банки). Сложности: неоднородные данные у участников, связь и
    отваливающиеся клиенты, утечки через градиенты — их закрывают безопасной агрегацией и дифференциальной
    приватностью.
  source: user-db
  source_ref: ["b92ce8c6d1"]
- id: iv-pipelines-13
  topic: other
  tags: [recsys, embeddings]
  difficulty: medium
  kind: open
  question: "Как устроены рекомендательные системы и как в них и в ранжировании используются эмбеддинги?"
  answer: >
    Подходы: коллаборативная фильтрация (матричная факторизация взаимодействий пользователь × объект, соседи),
    контентная (по признакам объектов), гибридные; в продакшене — каскад: генерация кандидатов (быстро, из
    миллионов) → ранжирование (точная модель, градиентный бустинг или нейросеть с множеством признаков) →
    переранжирование с учётом разнообразия и бизнес-правил. Эмбеддинги: two-tower модели обучают векторы
    пользователей и объектов так, чтобы скалярное произведение предсказывало взаимодействие, и кандидатов ищут
    ANN-поиском; эмбеддинги текстов и картинок дают признаки для холодного старта; сходство векторов запроса и
    документа — признак в модели ранжирования.
  source: user-db
  source_ref: ["30d6ff0c63", "a2b6985e7f", "6b6e3e031a", "d8700e2604"]
- id: iv-pipelines-14
  topic: other
  tags: [mlops]
  difficulty: medium
  kind: open
  question: "Что такое дрейф данных, какие виды бывают и как его обнаруживать?"
  answer: >
    Дрейф — изменение данных в продакшене относительно обучающих. Data/covariate drift — меняется распределение
    входов P(X); label/prior drift — меняется P(Y); concept drift — меняется сама зависимость P(Y | X), и старые
    правила перестают работать. Обнаружение: сравнивать распределения признаков текущего окна и эталона
    статистическими тестами и мерами (KS-тест, PSI, χ², расстояние Вассерштейна, для эмбеддингов — расстояние
    между распределениями или классификатор «старое/новое»), следить за распределением предсказаний и, когда
    приходят метки, за качеством. Инструменты: Evidently, NannyML, alibi-detect, WhyLabs.
  source: user-db
  source_ref: ["cfe513a9a2", "6de083c880", "8b99fe50e5"]
