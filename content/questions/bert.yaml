# Вопросы курса к блоку B, модуль 2 (BERT): WordPiece, вход BERT, MLM-маскирование, модель, головы дообучения.
# Ответы написаны авторами курса. Квиз B-Q2 собирает весь файл.
- id: bert-wordpiece-vs-bpe-01
  topic: tokenization
  tasks: [B07-wordpiece]
  difficulty: medium
  kind: open
  question: "Чем WordPiece (BERT) отличается от byte-level BPE (GPT-2) при кодировании текста?"
  answer: >
    BPE кодирует слово, применяя выученные слияния по порядку их рангов, пока есть что сливать; работает на байтах,
    поэтому неизвестных символов не бывает. WordPiece кодирует жадно по словарю: с начала слова берёт самый длинный
    кусок из словаря, продолжения слова помечены «##»; если разобрать нельзя, всё слово становится [UNK]. До этого
    BERT нормализует текст (у uncased — нижний регистр и удаление диакритики) и режет по пробелам и каждому знаку
    пунктуации. При обучении словаря WordPiece выбирает пару не по частоте, а по выигрышу правдоподобия.
  source: course
- id: bert-wordpiece-greedy-01
  topic: tokenization
  tasks: [B07-wordpiece]
  difficulty: medium
  kind: mcq
  question: "Словарь: un, una, ##aff, ##ff, ##able. Как WordPiece разберёт «unaffable»?"
  options:
    - "un ##aff ##able — самое осмысленное разбиение"
    - "una ##ff ##able — жадно берётся самый длинный префикс"
    - "[UNK] — у слова два возможных разбиения"
    - "u ##n ##a ##f ##f ##a ##b ##l ##e"
  correct: 1
  answer: >
    Кодирование жадное: с позиции 0 берётся самый длинный кусок из словаря — «una», затем с позиции 3 самый длинный
    «##…» — «##ff», затем «##able». Алгоритм не ищет лучшее разбиение и не возвращается назад. Разбор существует,
    поэтому [UNK] не будет.
  source: course
- id: bert-wordpiece-uncased-01
  topic: tokenization
  tasks: [B07-wordpiece]
  difficulty: easy
  kind: open
  question: "Почему bert-base-uncased плохо подходит для русского текста?"
  answer: >
    Словарь собран на английском: кириллических токенов в нём десятки, поэтому русский текст разбирается почти по
    буквам (на корпусе курса ~4.4 токена на слово). Длина последовательности растёт в разы, а представления слов
    модель не выучила. Кроме того, uncased-нормализация удаляет диакритику через NFD, и «й» превращается в «и», «ё» —
    в «е». Для русского берут мультиязычные (mBERT, XLM-R) или русские модели (ruBERT) с подходящим словарём и обычно
    cased-нормализацией.
  source: course
- id: bert-input-segments-01
  topic: embeddings
  tasks: [B08-bert-input]
  difficulty: easy
  kind: open
  question: "Из чего состоит вход BERT для пары текстов и зачем нужны token_type_ids?"
  answer: >
    Последовательность [CLS] A [SEP] B [SEP]. [CLS] в начале: его выход служит представлением всего входа для
    классификации. [SEP] закрывает каждый сегмент. token_type_ids — 0 у [CLS], A и первого [SEP], 1 у B и последнего
    [SEP]; по ним берётся эмбеддинг сегмента, который прибавляется к эмбеддингам токена и позиции. Так модель
    отличает, например, вопрос от абзаца. Вход слоя — LayerNorm суммы трёх эмбеддингов, позиции обучаемые (до 512).
  source: course
- id: bert-input-truncation-01
  topic: tokenization
  tasks: [B08-bert-input]
  difficulty: medium
  kind: mcq
  question: "Пара сегментов длиной 10 и 3 токена, бюджет — 8 токенов (без служебных). Что сделает longest_first?"
  options:
    - "Обрежет оба сегмента до 4"
    - "Оставит короткий сегмент целым (3 ≤ 4) и обрежет длинный до 5"
    - "Обрежет только второй сегмент"
    - "Выбросит второй сегмент целиком"
  correct: 1
  answer: >
    longest_first старается сохранить оба текста: короткий сегмент не трогают, если он не длиннее половины бюджета,
    остальное получает длинный. Если оба длиннее половины, бюджет делится пополам. only_first / only_second режут
    только один сегмент — полезно, когда второй (например, вопрос) обрезать нельзя.
  source: course
- id: bert-mlm-80-10-10-01
  topic: training
  tasks: [B09-mlm-masking, B09d-mlm-debug]
  difficulty: medium
  kind: mcq
  question: "Зачем из выбранных для MLM токенов только 80 % заменяют на [MASK]?"
  options:
    - "Чтобы сэкономить вычисления"
    - "[MASK] не встречается при дообучении: модель должна строить полезные представления и для обычных токенов"
    - "Чтобы модель реже переобучалась на конкретных словах"
    - "Это ограничение размера словаря"
  correct: 1
  answer: >
    Если бы все выбранные позиции были [MASK], модель могла бы строить хорошее представление только там, где видит
    [MASK], а при дообучении и инференсе этого токена нет — разрыв между предобучением и использованием. 10 %
    случайных токенов учат не доверять входу слепо, 10 % нетронутых — держать полезное представление каждого токена.
    Лосс при этом считается во всех выбранных позициях.
  source: course
- id: bert-mlm-specials-01
  topic: training
  tasks: [B09-mlm-masking, B09d-mlm-debug]
  difficulty: easy
  kind: open
  question: "Почему спецтокены и PAD не выбирают для MLM и как это проверить в батче?"
  answer: >
    [CLS] и [SEP] стоят на известных местах, их предсказание ничему не учит, а PAD — вообще не текст и закрыт маской
    внимания. Если они попадут в labels, часть лосса уйдёт на тривиальные «угадай PAD на месте PAD», средний лосс будет
    выглядеть лучше реального качества. Проверка — по самим labels: все позиции с labels ≠ −100 должны приходиться на
    обычные токены. Частая ошибка — посчитать labels до исключения спецтокенов из маски.
  source: course
- id: bert-mlm-wwm-01
  topic: training
  tasks: [B09-mlm-masking]
  difficulty: medium
  kind: open
  question: "Что такое whole word masking и dynamic masking и что каждое улучшает?"
  answer: >
    Whole word masking: если выбрано слово, закрываются все его WordPiece-подтокены. Иначе «token [MASK] ##ization»
    восстанавливается по соседним кускам того же слова, и задача становится слишком лёгкой. Dynamic masking (RoBERTa):
    маска выбирается заново каждый раз, когда пример попадает в батч, а не один раз при подготовке данных. Модель
    видит один текст с разными масками, сигнала больше. В статье RoBERTa динамическая маска не хуже статической, а
    данные готовить проще.
  source: course
- id: bert-mlm-vs-clm-01
  topic: training
  tasks: [B09-mlm-masking]
  difficulty: medium
  kind: open
  question: "Сравни MLM (BERT) и next-token prediction (GPT): что даёт каждая задача и чем платит?"
  answer: >
    MLM даёт контекст с обеих сторон: представление каждого токена учитывает весь текст — это лучше для понимания,
    классификации, поиска. Платит тем, что сигнал есть только в ~15 % позиций, и тем, что модель не умеет
    генерировать текст слева направо. Next-token prediction учит на каждой позиции и естественно генерирует, но
    видит только левый контекст. Поэтому энкодеры доминируют в задачах представления текста, а декодеры — в генерации;
    современные LLM при большом масштабе догоняют энкодеры и в понимании.
  source: course
- id: bert-model-postln-gelu-01
  topic: architecture
  tasks: [B10-bert-model]
  difficulty: easy
  kind: mcq
  question: "Какой слой у BERT?"
  options:
    - "Pre-LN, SwiGLU, RoPE"
    - "Post-LN, GELU, обучаемые абсолютные позиции"
    - "Post-LN, ReLU, синусоидальные позиции"
    - "Pre-LN, GELU, относительные позиции"
  correct: 1
  answer: >
    BERT взял энкодер исходного Transformer (Post-LN: LayerNorm после сложения с остатком), но заменил ReLU на GELU
    (точный, через erf) и синусоиды на обучаемую таблицу позиций до 512. bert-base: 12 слоёв, hidden 768, 12 голов,
    FFN 3072, ~110 М параметров; eps LayerNorm 1e-12.
  source: course
- id: bert-model-pooler-01
  topic: architecture
  tasks: [B10-bert-model, B11-finetune-heads]
  difficulty: medium
  kind: open
  question: "Что такое pooler в BERT и почему его выход не лучший эмбеддинг текста?"
  answer: >
    Pooler — tanh(dense(h[CLS])): линейный слой с tanh над выходом [CLS]. При предобучении он обучался только на
    задаче Next Sentence Prediction, поэтому его выход отражает «связаны ли два сегмента», а не смысл текста. Для
    классификации его всё равно дообучают вместе с моделью. Для эмбеддингов поиска pooler обычно не используют: берут
    среднее по токенам или [CLS] модели, специально дообученной контрастивно (Sentence-BERT, E5); у RoBERTa без NSP
    pooler вообще не предобучен.
  source: course
- id: bert-model-mlm-head-01
  topic: weights
  tasks: [B10-bert-model]
  difficulty: medium
  kind: open
  question: "Как устроена MLM-голова BERT и какие её веса общие с другими частями модели?"
  answer: >
    На каждой позиции: dense H→H, GELU, LayerNorm, затем проекция на словарь матрицей word_embeddings
    (транспонированной) плюс отдельный bias на каждый токен. Матрица декодера общая с входными эмбеддингами (weight
    tying, как у GPT); dense, LayerNorm и bias — свои. При загрузке весов HF bias хранится под двумя именами
    (cls.predictions.bias и decoder.bias), но это один тензор.
  source: course
- id: bert-heads-labels-01
  topic: other
  tags: [bert, ner]
  tasks: [B11-finetune-heads]
  difficulty: easy
  kind: open
  question: "Метки NER даны для слов, а BERT видит подтокены. Как сопоставить метки и токены?"
  answer: >
    Токенизатор (fast в HF) отдаёт word_ids — номер слова для каждого токена и None у спецтокенов. Метка слова ставится
    на его первый подтокен, остальные подтокены и спецтокены получают −100 и в лосс не входят. При инференсе
    метку слова берут с первого подтокена. Альтернатива — метка на всех подтокенах (иногда с префиксами I-), но тогда
    длинные слова весят в лоссе больше.
  source: course
- id: bert-heads-qa-span-01
  topic: other
  tags: [bert, question-answering]
  tasks: [B11-finetune-heads, B11d-span-debug]
  difficulty: medium
  kind: open
  question: "Как extractive QA на BERT выбирает ответ и почему нельзя взять argmax начала и argmax конца отдельно?"
  answer: >
    Модель даёт для каждого токена две оценки: s (начало) и e (конец). Ответ — пара (i, j), где сумма s_i + e_j
    максимальна среди допустимых: i ≤ j, j − i < лимита длины, обе позиции внутри абзаца (не в вопросе и не [CLS]).
    Независимые argmax не учитывают ограничения: конец может оказаться раньше начала, а обрезка по длине даёт не
    лучшую пару. Если ответа может не быть (SQuAD 2.0), сравнивают лучшую пару с оценкой «нет ответа» s_CLS + e_CLS.
  source: course
- id: bert-heads-finetune-01
  topic: training
  tasks: [B11-finetune-heads]
  difficulty: medium
  kind: mcq
  question: "Что обучается при стандартном дообучении BERT на классификацию?"
  options:
    - "Только новый линейный слой, BERT заморожен"
    - "Вся модель вместе с новой головой, с маленьким learning rate"
    - "Только pooler"
    - "Только эмбеддинги"
  correct: 1
  answer: >
    В статье BERT дообучают все параметры вместе с головой, 2–4 эпохи с learning rate порядка 2e-5 – 5e-5 (приложение
    A.3). Заморозка энкодера и обучение только головы (linear probing) дешевле, но обычно заметно хуже. Маленький LR
    нужен, чтобы не разрушить предобученные представления (catastrophic forgetting).
  source: course
