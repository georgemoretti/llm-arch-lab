# Вопросы на понимание статей модуля 2 (задание C-P2): Longformer, NoPE, размещение LayerNorm.
# Ответы — пересказ идей своими словами, без цитат из статей.
- id: paper-longformer-patterns-01
  topic: attention
  tasks: [C-P2-longformer-nope]
  difficulty: medium
  kind: open
  question: "Какие виды внимания комбинирует Longformer и зачем ему глобальное внимание?"
  answer: >
    Основа — скользящее окно: каждый токен смотрит на соседей с обеих сторон (это энкодер, окно
    двустороннее). В части голов окно «прореженное» (dilated): смотрят на каждый d-й токен, чтобы
    охватить больше контекста при том же числе пар. Плюс глобальное внимание у нескольких выбранных
    токенов: они смотрят на всю последовательность, и вся последовательность смотрит на них. Какие
    токены глобальные, зависит от задачи — например, служебный токен классификации или токены
    вопроса в QA. Так информация из любого места документа может попасть в нужную точку за один слой.
  source: course
- id: paper-longformer-vs-gemma-01
  topic: attention
  tasks: [C-P2-longformer-nope]
  difficulty: medium
  kind: open
  question: "Чем sliding window в Longformer отличается от sliding window в Mistral 7B и Gemma 3?"
  answer: >
    Longformer — энкодер: окно симметричное (токен видит соседей слева и справа), а дальние
    зависимости передаются через немногие токены с глобальным вниманием. Mistral и Gemma —
    декодеры: окно causal, только последние W позиций. Дальние зависимости у Mistral передаются через
    стек слоёв (поле зрения растёт на W − 1 за слой), у Gemma 2/3 — через отдельные слои с полным
    attention, которые чередуются со sliding-слоями. Ещё одно практическое отличие — KV-cache: у
    декодера окно ограничивает и память кеша при генерации.
  source: course
- id: paper-longformer-impl-01
  topic: attention
  tasks: [C-P2-longformer-nope]
  difficulty: hard
  kind: open
  question: >
    Почему реализация SWA как «полная матрица scores + маска» не экономит ни память, ни время и что
    с этим делают?
  answer: >
    Если сначала посчитать все T×T скалярных произведений, а потом занулить лишние маской, работа и
    память остаются O(T²) — маска лишь выбрасывает результат. Экономия появляется, только если
    считать сразу ленту ширины W около диагонали: O(T·W). Авторы Longformer для этого написали
    собственное ленточное умножение (через TVM) и вариант на блоках; современные ядра вроде
    FlashAttention поддерживают окно напрямую и просто пропускают блоки вне ленты. В нашей задаче
    C07 маска полная — для понимания, не для скорости.
  source: course
- id: paper-nope-setup-01
  topic: positional-encoding
  tasks: [C-P2-longformer-nope]
  difficulty: medium
  kind: open
  question: "Что исследуют Kazemnejad et al. в статье про NoPE и какой главный вывод?"
  answer: >
    Как разные позиционные кодирования в декодере влияют на обобщение по длине: модели обучают на
    коротких примерах синтетических задач (арифметика, копирование, рассуждения и т. п.) и
    проверяют на более длинных. Сравнивают абсолютные эмбеддинги, T5-bias, ALiBi, RoPE и отсутствие
    кодирования (NoPE). Главный вывод — в их постановке NoPE обобщает по длине не хуже, а часто лучше
    распространённых схем, при том что не требует ничего дополнительного; это ставит под вопрос,
    обязательно ли явное позиционное кодирование в декодере. Масштаб экспериментов небольшой —
    переносить вывод на большие модели надо осторожно.
  source: course
- id: paper-nope-theory-01
  topic: positional-encoding
  tasks: [C-P2-longformer-nope]
  difficulty: hard
  kind: open
  question: "Как в статье про NoPE обосновывают, что декодер без позиционного кодирования может представить позиции?"
  answer: >
    Конструктивно: первый слой с causal-маской может вычислить абсолютную позицию — например,
    равномерное внимание по префиксу даёт величину, зависящую от числа видимых токенов (≈ 1/(t+1)
    от вклада первого токена), и её можно записать в скрытое состояние. Имея абсолютные позиции в
    состоянии, следующие слои могут реализовать и относительное внимание. Так что NoPE-декодер в
    принципе способен выразить и абсолютную, и относительную схему; в энкодере без маски этого нет.
  source: course
- id: paper-xiong-warmup-01
  topic: normalization
  tasks: [C-P2b-layernorm-placement]
  difficulty: medium
  kind: open
  question: "Почему по Xiong et al. Post-LN-трансформеру нужен warmup learning rate, а Pre-LN — нет?"
  answer: >
    Анализ при инициализации показывает: у Post-LN ожидаемый градиент весов около выхода сети велик
    и не уменьшается с глубиной, поэтому большой learning rate в начале обучения даёт слишком большие
    шаги и нестабильность — warmup это сглаживает. У Pre-LN градиенты последних слоёв уменьшаются с
    глубиной примерно как 1/√L (остаточный поток растёт, а финальная норма делит на него), поэтому
    обучение стабильно и без warmup. Эксперименты авторов показывают, что Pre-LN без warmup сходится
    быстрее, чем Post-LN с подобранным warmup.
  source: course

- id: paper-xiong-depth-01
  topic: normalization
  tasks: [C-P2b-layernorm-placement]
  difficulty: hard
  kind: open
  question: "Как в анализе Xiong et al. градиент весов последнего слоя при инициализации зависит от глубины L у Post-LN и у Pre-LN, и откуда берётся разница?"
  answer: >
    Оценка из статьи: у Post-LN норма градиента весов FFN последнего слоя ограничена величиной порядка
    d·√(ln d) — от глубины она не зависит, то есть на старте у выхода сети шаги большие при любом L. У Pre-LN
    та же оценка делится на √L. Причина — в остаточном потоке: у Pre-LN к нему без нормировки прибавляются
    выходы всех L подслоёв, его масштаб растёт примерно как √L, а финальная норма делит на этот масштаб — и
    градиент, проходящий через неё назад, уменьшается в те же √L раз. У Post-LN поток нормируется после
    каждого блока, его масштаб постоянный, и такого делителя нет. В C08 тот же эффект виден в тесте
    test_gradient_at_init.
  source: course

- id: paper-xiong-olmo-01
  topic: normalization
  tasks: [C-P2b-layernorm-placement]
  difficulty: medium
  kind: open
  question: "OLMo 2 ставит норму на выход подслоя: x + n(f(x)). Почему это не возврат к Post-LN, от которого предостерегает статья Xiong et al.?"
  answer: >
    В Post-LN норма стоит на самом остаточном потоке: x ← n(x + f(x)). Градиент к нижним слоям проходит через
    L норм подряд, а их якобианы и создают проблему с масштабом градиентов у выхода и нужду в warmup. У OLMo 2
    остаточный путь остаётся тождественным, как у Pre-LN: градиент идёт по x напрямую, а норма только
    ограничивает вклад каждого подслоя. Поэтому анализ статьи про Post-LN к этой схеме не относится; выигрыш
    OLMo 2 — в том, что вклад подслоя не разрастается при обучении (вместе с QK-Norm это стабилизирует обучение).
  source: course
