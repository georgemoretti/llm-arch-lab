# Вопросы с собеседований пользователя (source: user-db), переформулированные своими словами, с эталонными
# ответами курса. Тема: tool calling и LLM-агенты — вне тем курса (topic: other). Правила — docs/QUESTIONS_IMPORT.md.
- id: iv-agents-01
  topic: other
  tags: [agents, tool-calling]
  difficulty: easy
  kind: open
  question: "Что такое tool calling, как он работает и зачем он LLM-приложениям?"
  answer: >
    Модели передают описания доступных функций (имя, описание, JSON-схема аргументов). Вместо текста модель может
    вернуть структурированный запрос «вызови функцию X с аргументами {…}». Приложение выполняет функцию, кладёт
    результат обратно в диалог отдельным сообщением, и модель продолжает — отвечает или зовёт следующий
    инструмент. Так LLM получает доступ к свежим данным (поиск, базы, API), может действовать (создать тикет,
    отправить письмо) и делегировать точные вычисления коду, вместо того чтобы галлюцинировать.
  source: user-db
  source_ref: [41938ca07a, 667774c963, 37ffec1ef2]
- id: iv-agents-02
  topic: other
  tags: [agents, tool-calling]
  difficulty: medium
  kind: open
  question: >
    Модель «решила вызвать» функцию get_account. Кто и как на самом деле исполняет вызов, и что технически значит
    «агент выбрал и вызвал tool»?
  answer: >
    Модель ничего не исполняет: она лишь генерирует токены, которые парсятся в структуру {name, arguments} (или
    провайдер возвращает её отдельным полем tool_calls). «Выбрать tool» — значит сгенерировать имя одной из
    описанных функций и аргументы по её схеме. Дальше код приложения (цикл агента, фреймворк) находит функцию по
    имени в реестре, валидирует аргументы, вызывает её в своём процессе с правами приложения, ловит ошибки и
    добавляет результат в историю сообщений как ответ на конкретный tool_call_id; затем снова вызывает модель.
  source: user-db
  source_ref: [3f121e8215, 9b5820f17f, b1344e580a, 526b8179a5, a611ce0217, 325dbf5817]
- id: iv-agents-03
  topic: other
  tags: [agents, tool-calling]
  difficulty: medium
  kind: code-reading
  question: "Что на уровне Python получается, когда функцию помечают декоратором вроде @tool во фреймворке агентов?"
  answer: >
    Декоратор оборачивает обычную функцию в объект-инструмент: сохраняет саму функцию (её и вызовут), имя,
    описание из docstring и схему аргументов, выведенную из сигнатуры и аннотаций типов (часто через Pydantic). Из
    этого объекта фреймворк генерирует JSON-описание для модели и по нему же валидирует и приводит аргументы,
    когда модель запросила вызов. То есть tool — это функция + метаданные для LLM; логика исполнения остаётся
    обычным Python-кодом.
  source: user-db
  source_ref: [00a38d5183]
- id: iv-agents-04
  topic: other
  tags: [agents]
  difficulty: easy
  kind: open
  question: "Что такое LLM-агент и чем он отличается от фиксированной цепочки из двух промптов?"
  answer: >
    Агент — система, где LLM в цикле сама решает, какое действие сделать дальше: вызвать инструмент, задать
    уточнение, закончить, — опираясь на результаты прошлых шагов. Цепочка промптов (workflow) — заранее
    зафиксированный граф шагов: порядок и число вызовов задаёт программист, модель лишь заполняет каждый шаг.
    У агента управление потоком у модели, число шагов заранее неизвестно — гибче, но менее предсказуемо, дороже
    и сложнее в отладке и оценке.
  source: user-db
  source_ref: [f84db0348c, d00f371f40]
- id: iv-agents-05
  topic: other
  tags: [agents]
  difficulty: medium
  kind: open
  question: "Из каких компонентов состоит агент и какие паттерны проектирования агентных систем ты знаешь?"
  answer: >
    Компоненты: модель-«планировщик», инструменты, память (краткосрочная — история шагов; долговременная —
    векторное хранилище, заметки), цикл управления с условиями остановки и лимитами, обработка ошибок,
    guardrails и наблюдаемость (трассировка). Паттерны от простых к сложным: prompt chaining, роутинг по типу
    запроса, параллелизация, orchestrator–workers (ведущий раздаёт подзадачи), evaluator–optimizer (генерация
    и критика по кругу), ReAct (рассуждение + действие), plan-and-execute, мультиагентные системы с ролями.
    Отличаются тем, насколько поток задан кодом и сколько свободы у модели.
  source: user-db
  source_ref: [dfd2f4aa13, 8ec853271b, 076f05a16a, 6f622ba72e, fc4496c8d0]
- id: iv-agents-06
  topic: other
  tags: [agents]
  difficulty: medium
  kind: open
  question: "Как решить, нужен ли задаче агент, хватит ли фиксированного workflow или вообще классического ML?"
  answer: >
    Начинать с самого простого, что решает задачу. Классический ML — если есть размеченные данные и чёткая
    постановка (классификация, регрессия, ранжирование), нужны дешёвый инференс и предсказуемость. Workflow на
    LLM — если шаги известны заранее (извлечь → проверить → ответить), можно их зафиксировать и оценить по
    отдельности. Агент — только если путь к результату заранее неизвестен и зависит от промежуточных
    результатов, число шагов переменное, а цена ошибки и задержки приемлема. Решение подтверждать evals на
    реальных примерах, сравнивая качество, стоимость и время.
  source: user-db
  source_ref: [75b706fe87, c2e775da8b]
- id: iv-agents-07
  topic: other
  tags: [agents]
  difficulty: medium
  kind: open
  question: "Как устроен ReAct-агент и как реализовать его самому по шагам?"
  answer: >
    ReAct чередует рассуждение и действие: модель пишет мысль, выбирает действие (инструмент и аргументы),
    получает наблюдение (результат) и повторяет, пока не выдаст финальный ответ. Реализация: (1) описать
    инструменты и системный промпт с форматом шага (или использовать нативный tool calling); (2) цикл: вызвать
    модель с историей → если в ответе вызов инструмента, исполнить его, добавить результат в историю → иначе
    вернуть ответ; (3) ограничить число итераций и время, обрабатывать ошибки инструментов, возвращая их модели
    текстом; (4) логировать трассу шагов для отладки и evals.
  source: user-db
  source_ref: [076fe7552d, dd45f56ce5]
- id: iv-agents-08
  topic: other
  tags: [agents, prompting]
  difficulty: easy
  kind: open
  question: "Какими средствами сделать ответы LLM более предсказуемыми и стабильными?"
  answer: >
    Низкая temperature (или жадное декодирование) и фиксированный seed, где он поддерживается; чёткая
    инструкция с форматом и примерами (few-shot); структурированный вывод по схеме и constrained decoding;
    разбиение задачи на маленькие шаги с проверками; валидация выхода и повтор при ошибке; ограниченный набор
    инструментов и действий; закреплённая версия модели. И измерять стабильность evals-ами на наборе примеров, а
    не на одном запросе.
  source: user-db
  source_ref: [4236fa2b0c]
