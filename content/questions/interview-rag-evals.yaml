- id: iv-evals-06
  topic: other
  tags: [evals]
  difficulty: easy
  kind: open
  question: "Что такое precision и recall и как они относятся к поиску документов?"
  answer: >
    Precision — доля правильных среди того, что система выдала (сколько из найденных документов релевантны).
    Recall — доля найденного среди всего правильного (сколько релевантных документов из существующих система
    нашла). Они тянут в разные стороны: выдав больше документов, повышаешь recall и обычно снижаешь precision. В
    RAG на первом этапе важнее recall@k (нужное должно попасть в кандидаты), на финальном контексте — precision
    (лишние чанки мешают генерации). F1 — их гармоническое среднее.
  source: user-db
  source_ref: [3e6e5a2c82, b560403a66]
- id: iv-evals-07
  topic: other
  tags: [evals, llm-judge]
  difficulty: medium
  kind: open
  question: "Почему генеративные ответы часто оценивают LLM-судьёй, а не только BLEU, ROUGE, METEOR или BERTScore? Какие бывают подходы к LLM-as-a-judge?"
  answer: >
    N-граммные метрики меряют совпадение слов с эталоном: правильный ответ другими словами получает низкий балл,
    а ошибочный, но похожий по словам — высокий; BERTScore лучше ловит перефразы, но всё равно не проверяет факты,
    полноту и следование инструкции, а у открытых задач эталон один из многих. LLM-судья может оценить смысл по
    критериям. Подходы: оценка одного ответа по рубрике (pointwise), попарное сравнение двух версий (pairwise —
    стабильнее), сверка с эталонным ответом (reference-based), проверка опоры на контекст (faithfulness: разбить
    ответ на утверждения и проверить каждое), бинарные проверки отдельных критериев.
  source: user-db
  source_ref: [6a21b6f72f, 3ea1e591cc]
- id: iv-evals-08
  topic: other
  tags: [evals, llm-judge]
  difficulty: medium
  kind: open
  question: "Почему плохо просить LLM поставить ответу оценку от 1 до 10 и как сделать судью надёжнее?"
  answer: >
    Шкала без определений не откалибрована: модель склонна к средним и завышенным оценкам, баллы плохо
    воспроизводимы между запусками и моделями, разница «6 vs 7» ничего не значит, а смешивание многих критериев
    в одно число прячет причину. Улучшения: бинарные или 3-уровневые оценки по одному критерию с чётким
    описанием каждого уровня; рассуждение перед вердиктом; попарное сравнение вместо абсолютных баллов (с
    перестановкой порядка против позиционного смещения); эталонный ответ и контекст в промпте судьи; несколько
    примеров с правильной оценкой; калибровка — сверка с ручной разметкой на сотне примеров и подсчёт согласия;
    более сильная или другая модель-судья, чем оцениваемая.
  source: user-db
  source_ref: [9db04ec9b6, 31eaa54ffe]
- id: iv-evals-09
  topic: other
  tags: [evals, rag]
  difficulty: medium
  kind: open
  question: "Фреймворк оценки RAG выдал общий скор 0.91. Что с этим делать и можно ли этому верить?"
  answer: >
    Само по себе число почти ничего не говорит. Нужно понять: какие метрики усреднены (faithfulness, answer
    relevancy, context precision/recall), на каком наборе и сколько в нём примеров, какая модель-судья. Метрики
    фреймворков вроде RAGAS считаются LLM-ом и шумят; без калибровки на ручной разметке и без сравнения с базовой
    версией 0.91 нельзя назвать хорошим или плохим. Смотреть распределение по примерам и категориям, вручную
    прочитать худшие случаи, проверить, не слишком ли простой набор, и использовать метрику прежде всего для
    сравнения версий системы на одном и том же наборе.
  source: user-db
  source_ref: [ab5477cff3, a9e600dbed, 2692f80e5f]
- id: iv-evals-10
  topic: other
  tags: [evals]
  difficulty: easy
  kind: open
  question: "Какие библиотеки и автоматические метрики используют для оценки LLM-систем?"
  answer: >
    Библиотеки и платформы: RAGAS, DeepEval, TruLens, promptfoo, OpenAI Evals, lm-evaluation-harness (бенчмарки
    моделей), Langfuse / LangSmith / Phoenix (трассировка и оценки). Метрики: для поиска — hit rate, recall@k,
    precision@k, MRR, nDCG; для текста — exact match, F1 по токенам, BLEU, ROUGE, METEOR, chrF, BERTScore; для
    RAG — faithfulness, answer relevancy, context precision/recall (через LLM); для структурированного вывода —
    валидность схемы и точность полей; плюс задержка и стоимость.
  source: user-db
  source_ref: [aea81daf7b, 67512a244e]
- id: iv-prompting-01
  topic: other
  tags: [prompting]
  difficulty: easy
  kind: open
  question: "Какие техники prompt engineering ты знаешь кроме few-shot и как сильная закрытая модель помогает улучшать промпты?"
  answer: >
    Чёткая роль и задача, явный формат вывода, разметка частей промпта (XML-теги, разделители), пошаговое
    рассуждение (chain-of-thought) или отдельный шаг планирования, декомпозиция на цепочку промптов,
    самопроверка и критика ответа, примеры граничных случаев, позитивные инструкции вместо запретов, контекст в
    начале и вопрос в конце для длинных документов, structured outputs. Сильную модель можно использовать как
    «промпт-инженера»: дать ей текущий промпт, примеры плохих ответов и критерии, попросить проанализировать
    ошибки и предложить улучшенную версию, затем проверить её на evals (автоматизированно — DSPy и подобные
    оптимизаторы промптов).
  source: user-db
  source_ref: [961867f80f, e479183a64]
- id: iv-prompting-02
  topic: other
  tags: [prompting, structured-output]
  difficulty: medium
  kind: mcq
  question: >
    Модель без встроенного режима рассуждений просят вернуть JSON с полями answer и reasoning. Когда это действительно
    улучшает качество ответа?
  options:
    - "Всегда, наличие поля reasoning само по себе включает рассуждение"
    - "Только если поле reasoning стоит перед answer: модель генерирует слева направо и успевает «подумать» до ответа"
    - "Только если reasoning стоит после answer, чтобы не сбивать модель"
    - "Никогда, JSON запрещает рассуждения"
  correct: 1
  answer: >
    Генерация авторегрессионна: если сначала идёт answer, ответ уже выбран, а reasoning — объяснение задним числом.
    Если reasoning стоит первым, токены рассуждения становятся контекстом для ответа — это и есть chain-of-thought
    внутри структурированного вывода. Порядок полей в схеме важен; стоимость — больше выходных токенов.
  source: user-db
  source_ref: [7040c2869f]
