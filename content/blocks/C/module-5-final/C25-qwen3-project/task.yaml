# Источник: Qwen/Qwen3-0.6B (config.json, model.safetensors, сверено 2026-10-17): 596 049 920 параметров
# (посчитано по весам и совпадает с transformers), bf16, один файл ~1.5 ГБ, lm_head.weight == embed_tokens.weight.
# Расхождение логитов с transformers 5.x (fp32, eager attention) на промпте из теста: max |Δ| ≈ 6e-5 при |logit| ≤ 21.
arch:
  qwen3:
    norm: "RMSNorm (ε = 1e-6), Pre-Norm + QK-Norm по голове (q_norm, k_norm размера head_dim)"
    position: "RoPE, θ = 1 000 000, без масштабирования"
    attention: "GQA 16 / 8 голов, head_dim = 128 ≠ d_model / H = 64"
    ffn: "SwiGLU, 1024 → 3072 → 1024"
    moe: "нет — dense (MoE — у Qwen3-30B-A3B и 235B-A22B)"
    layers: "28 одинаковых слоёв, все full attention"
