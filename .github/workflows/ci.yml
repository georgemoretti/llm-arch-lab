name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . "httpx>=0.27"
      - name: Platform tests
        run: pytest tests/
      - name: Course invariants
        run: llmlab validate --all

  frontend:
    # Собранный бандл коммитится в llmlab/static — проверяем, что он соответствует исходникам.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - name: Bundle is up to date
        run: |
          git diff --exit-code --stat llmlab/static || {
            echo "Бандл устарел. Пересобери фронтенд: cd web && npm run build"
            exit 1
          }
