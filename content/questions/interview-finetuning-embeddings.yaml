# Вопросы с собеседований пользователя (source: user-db), переформулированные своими словами, с эталонными
# ответами курса. Тема: статические эмбеддинги (Word2Vec, GloVe), LoRA и дообучение, переобучение и
# регуляризация — вне тем курса (topic: other, кроме обучения нейросетей). Правила — docs/QUESTIONS_IMPORT.md.
- id: iv-embeddings-01
  topic: other
  tags: [embeddings]
  difficulty: easy
  kind: open
  question: "Как устроен и как обучается Word2Vec: что на входе, какая архитектура и какая задача?"
  answer: >
    Неглубокая сеть из двух матриц: таблица входных векторов слов и таблица выходных. Обучение на парах «слово —
    соседнее слово» из окна по корпусу. Skip-gram: по центральному слову (one-hot → его вектор) предсказать слова
    контекста; CBOW: по среднему векторов контекста предсказать центральное слово. Полный softmax по словарю
    дорог, поэтому используют negative sampling (отличить настоящую пару от случайных) или иерархический
    softmax. После обучения выходную часть выбрасывают, векторы первой таблицы — эмбеддинги слов: слова в
    похожих контекстах получают близкие векторы.
  source: user-db
  source_ref: ["902409e833", "6c820859ea", "e5efdb5a41", "10a6313d24"]
- id: iv-embeddings-02
  topic: other
  tags: [embeddings]
  difficulty: easy
  kind: mcq
  question: "Слово «ключ» в «ключ от двери» и «ключ бьёт из-под земли»: какие у него векторы в Word2Vec?"
  options:
    - "Разные: Word2Vec учитывает соседние слова при каждом использовании"
    - "Один и тот же: у каждого слова словаря ровно один вектор, независимо от контекста"
    - "Разные, если слово стоит в разных падежах"
    - "Word2Vec вообще не выдаёт векторов для многозначных слов"
  correct: 1
  answer: >
    Word2Vec — статические эмбеддинги: таблица «слово → вектор», контекст учитывается только при обучении. Вектор
    многозначного слова — смесь всех его значений, перекошенная к самому частому. (Падежные формы — это разные
    слова словаря, поэтому у них разные векторы, но к омонимии это отношения не имеет.)
  source: user-db
  source_ref: ["ca02f0ff83"]
- id: iv-embeddings-03
  topic: other
  tags: [embeddings]
  difficulty: medium
  kind: open
  question: "Как пытались бороться с омонимией статических эмбеддингов до появления BERT и attention?"
  answer: >
    Мульти-прототипные эмбеддинги: кластеризовать контексты слова и учить по вектору на каждый кластер (смысл) —
    например, Multi-Sense Skip-gram; эмбеддинги смыслов по словарю WordNet (sense embeddings) с предварительным
    снятием неоднозначности; контекстные модели на рекуррентных сетях — context2vec и ELMo, где вектор слова
    вычисляется двунаправленной LSTM по всему предложению. ELMo по сути и стал мостом к контекстным
    эмбеддингам трансформеров, где вектор каждого употребления свой.
  source: user-db
  source_ref: ["b32352ca4d"]
- id: iv-embeddings-04
  topic: other
  tags: [embeddings]
  difficulty: medium
  kind: open
  question: "Что такое GloVe и чем его идея отличается от Word2Vec?"
  answer: >
    GloVe (Global Vectors) строит по всему корпусу матрицу совместной встречаемости слов X_ij (сколько раз j
    встретилось в окне вокруг i) и подбирает векторы так, чтобы скалярное произведение w_i·w̃_j плюс смещения
    приближало log X_ij; ошибка взвешивается функцией, ограничивающей вклад очень частых пар. Word2Vec — предсказательная
    модель, которая идёт по корпусу локальными окнами; GloVe — факторизация глобальной статистики. Идея: отношения
    вероятностей совместной встречаемости кодируют смысл, и их удобно выражать разностями векторов. На практике
    качество близкое.
  source: user-db
  source_ref: ["fb873b358d", "bf362b5494"]
- id: iv-finetuning-01
  topic: other
  tags: [fine-tuning, lora]
  difficulty: easy
  kind: open
  question: "Что такое LoRA, как она работает и зачем нужна?"
  answer: >
    Low-Rank Adaptation: исходные веса W замораживают, а изменение представляют произведением двух маленьких
    матриц: W' = W + (α/r)·B·A, где A — [r × d_in], B — [d_out × r], ранг r ≪ d (4–64). Обучаются только A и B;
    B инициализируют нулями, поэтому в начале модель не меняется. Обучаемых параметров — доли процента, отсюда
    меньше памяти под градиенты и состояния оптимизатора, можно дообучать большую модель на одной GPU; адаптер
    весит мегабайты, их можно хранить много и переключать; после обучения B·A можно влить в W, и инференс не
    замедлится. Работает потому, что полезные изменения весов при дообучении, по наблюдениям, низкоранговые.
  source: user-db
  source_ref: ["f1acdfd155", "af31f4d0bd", "15d422db4c", "ae58612cef", "90cbbdcc79"]
- id: iv-finetuning-02
  topic: other
  tags: [fine-tuning, lora]
  difficulty: easy
  kind: mcq
  question: "Сколько обучаемых параметров у LoRA-адаптера ранга 8 для матрицы весов 500 × 1000?"
  options: ["8 000", "12 000", "64 000", "500 000"]
  correct: 1
  answer: >
    Адаптер — две матрицы: 8 × 1000 и 500 × 8 (или наоборот, в зависимости от ориентации), всего 8·(500 + 1000) =
    12 000 параметров против 500 000 у полной матрицы — 2.4 %. Общая формула: r·(d_in + d_out).
  source: user-db
  source_ref: ["b145787ca5"]
- id: iv-finetuning-03
  topic: other
  tags: [fine-tuning, lora]
  difficulty: medium
  kind: open
  question: "Оцени на салфетке: сколько параметров и мегабайт займёт адаптер r = 8 для модели масштаба 1B и от чего это зависит?"
  answer: >
    Посчитать r·(d_in + d_out) по всем матрицам, к которым применяем адаптер. Пусть d_model ≈ 2048 и ~20 слоёв.
    Только q и v (квадратные 2048 × 2048): на слой 2 · 8 · (2048 + 2048) ≈ 65K, на модель ≈ 1.3M параметров —
    около 2.6 МБ в bf16. На все линейные слои (q, k, v, o и три матрицы MLP с d_ff ≈ 8192) — примерно в 5–6 раз
    больше, порядка 10M параметров (~20 МБ), то есть около 1 % от модели. Точная цифра зависит от GQA,
    размеров MLP и списка целевых модулей.
  source: user-db
  source_ref: ["4096c1cb50"]
- id: iv-finetuning-04
  topic: other
  tags: [fine-tuning, lora]
  difficulty: medium
  kind: open
  question: "Чем дообучение через LoRA отличается по результату от полного дообучения модели, и какую роль играет ранг?"
  answer: >
    LoRA ограничивает изменение весов низким рангом: для адаптации стиля, формата, узкой задачи качество обычно
    близко к полному дообучению при кратно меньшей памяти; для усвоения больших объёмов новых знаний или
    сильного сдвига домена полный fine-tuning выигрывает. LoRA меньше «забывает» исходные способности, потому что
    базовые веса не трогаются. Ранг r — ёмкость адаптера: больше r → больше параметров и выразительность, но
    выше риск переобучения на маленьком датасете и память; эффективный шаг масштабируется α/r, поэтому при смене
    r подбирают и α. Типичные r — 8–64.
  source: user-db
  source_ref: ["8ca7c9e03b", "259600b251"]
- id: iv-finetuning-05
  topic: other
  tags: [fine-tuning]
  difficulty: medium
  kind: open
  question: "Как выглядит пайплайн дообучения LLM с LoRA от данных до продакшена?"
  answer: >
    (1) Постановка и метрики, базовая оценка исходной модели с хорошим промптом — вдруг дообучение не нужно.
    (2) Датасет в формате чата (инструкция → ответ) с шаблоном модели, разбиение на train/val/test. (3) Выбор
    базовой модели и конфигурации: целевые модули, r, α, dropout, learning rate (для LoRA выше, чем для полного
    FT), число эпох; QLoRA, если не хватает памяти. (4) Обучение (PEFT/TRL, Unsloth) с логированием лосса на
    train и val. (5) Оценка на отложенном наборе и общих способностях. (6) Слияние адаптера с весами или
    подгрузка адаптера в сервере инференса (vLLM поддерживает несколько LoRA), квантизация, мониторинг.
  source: user-db
  source_ref: ["eff95bc322"]
- id: iv-finetuning-06
  topic: other
  tags: [fine-tuning, data]
  difficulty: medium
  kind: open
  question: "Как собрать и проверить датасет для дообучения, включая синтетическую часть?"
  answer: >
    Источники: реальные примеры из логов и экспертная разметка — основа; синтетика — генерация сильной моделью по
    документам и шаблонам задач, перефразирование, дистилляция ответов. Проверка: дедупликация (в том числе
    почти-дубли), отсутствие пересечения с тестом, фильтрация по длине и формату, проверка качества LLM-судьёй и
    выборочно людьми, баланс по типам задач и сложностям, удаление персональных данных, единый шаблон чата.
    Синтетику разнообразить (разные промпты, персоны, температура) и не давать ей вытеснить реальные данные;
    небольшой чистый датасет лучше большого шумного.
  source: user-db
  source_ref: ["90f9d61587", "c8349bffcb", "e1af717438"]
- id: iv-finetuning-07
  topic: other
  tags: [fine-tuning, evals]
  difficulty: medium
  kind: open
  question: "Как оценивать дообученную модель, например на задаче суммаризации?"
  answer: >
    На отложенном тесте, которого не было в обучении, и в сравнении с базовой моделью с хорошим промптом.
    Автоматически: ROUGE/BERTScore с эталонными резюме (грубо), LLM-as-a-judge по критериям — полнота ключевых
    фактов, отсутствие выдуманного (faithfulness к исходнику), краткость, формат; для извлечения — точность полей.
    Отдельно проверить, не просели ли общие способности (небольшой набор общих задач). Финально — попарное
    сравнение людьми или A/B на пользователях.
  source: user-db
  source_ref: ["ef036a7141", "0262220346"]
- id: iv-training-02
  topic: training
  difficulty: easy
  kind: open
  question: "Как по кривым train/validation понять, сколько обучать модель, и как поймать переобучение?"
  answer: >
    Следить за лоссом (и целевой метрикой) на обучающей и отложенной выборке по ходу обучения. Пока оба падают —
    модель учится; если train продолжает падать, а val остановился или растёт — переобучение, лучший момент —
    минимум val (early stopping, сохранять чекпойнт по val). Если оба высокие и почти не падают — недообучение
    или проблема с learning rate. Скачки и NaN — нестабильность (lr, клиппинг). Для LLM-дообучения обычно
    хватает 1–3 эпох; больше на маленьком датасете ведёт к запоминанию.
  source: user-db
  source_ref: ["1d4f87c46d", "1fffdb86d6", "5e9b480750"]
- id: iv-training-03
  topic: training
  tags: [classic-ml]
  difficulty: easy
  kind: open
  question: "Какие способы борьбы с переобучением нейросетей ты знаешь и как работают dropout и batch normalization?"
  answer: >
    Больше и разнообразнее данных, аугментации, меньшая модель, weight decay (L2), dropout, early stopping,
    label smoothing, ограничение числа эпох. Dropout на обучении случайно зануляет долю p активаций (и
    масштабирует оставшиеся на 1/(1 − p)), не давая нейронам полагаться друг на друга, — это как обучать ансамбль
    подсетей; на инференсе выключается. Batch normalization нормирует активации по батчу (среднее и дисперсия)
    с обучаемыми масштабом и сдвигом, на инференсе — накопленные статистики; ускоряет и стабилизирует обучение,
    даёт лёгкую регуляризацию шумом статистик батча. В трансформерах вместо BN используют LayerNorm/RMSNorm (C01).
  tasks: [C01-rmsnorm]
  source: user-db
  source_ref: ["e3d930ea6b", "2f6c4f7cf3", "872fb4dfa3"]
- id: iv-training-04
  topic: other
  tags: [classic-ml]
  difficulty: easy
  kind: open
  question: "Чем L1-регуляризация отличается от L2 и как регуляризуют классические модели, включая деревья?"
  answer: >
    L1 добавляет к лоссу λ·Σ|w|: тянет веса ровно в ноль, даёт разреженные модели и отбор признаков (Lasso). L2
    добавляет λ·Σw²: равномерно уменьшает веса, не обнуляя, устойчив к коррелированным признакам (Ridge, weight
    decay); их смесь — Elastic Net. В линейных моделях и SVM это штраф в целевой функции (параметр C у SVM —
    обратная сила). У деревьев регуляризация — ограничения структуры: максимальная глубина, минимум объектов в
    листе, минимальный выигрыш от разбиения, обрезка; в бустинге ещё learning rate, субсэмплинг строк и признаков
    и L1/L2 на значения в листьях (XGBoost, LightGBM).
  source: user-db
  source_ref: ["f6edd38ac9", "9888ad9dfd", "e30ab38ee9"]
