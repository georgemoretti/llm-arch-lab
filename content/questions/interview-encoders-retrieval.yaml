# Вопросы с собеседований пользователя (source: user-db), переформулированные своими словами, с эталонными
# ответами курса. Тема: BERT и энкодеры, поиск (bi-/cross-encoder, BM25, reranker), токенизация.
# Энкодеры и поиск вне тем курса → topic: other (подтема в tags). Правила — docs/QUESTIONS_IMPORT.md.
- id: iv-bert-01
  topic: other
  tags: [bert, encoders]
  difficulty: easy
  kind: open
  question: "Как устроен BERT и чем он отличается от GPT-подобных моделей?"
  answer: >
    BERT — стопка блоков энкодера трансформера (Post-LN, GELU, обучаемые абсолютные позиции до 512) с
    двунаправленным self-attention: каждый токен видит весь текст. Предобучается на Masked Language Modeling (и в
    оригинале на Next Sentence Prediction). На вход — WordPiece-токены со служебными [CLS] и [SEP] и эмбеддингом
    сегмента. Генерировать текст слева направо он не умеет; его используют как кодировщик: классификация по [CLS],
    разметка токенов, извлечение ответов, эмбеддинги для поиска.
  source: user-db
  source_ref: [760769bc0f]
- id: iv-bert-02
  topic: training
  tags: [bert]
  difficulty: medium
  kind: open
  question: "Как устроено обучение Masked Language Modeling и зачем схема 80 / 10 / 10 при замене токенов?"
  answer: >
    Случайно выбирают ~15 % позиций и учат модель восстановить исходные токены в них по контексту с обеих сторон;
    лосс считается только по выбранным позициям, поэтому сигнал реже, чем у next-token prediction. Из выбранных
    80 % заменяют на [MASK], 10 % — на случайный токен, 10 % оставляют как есть. Причина — на дообучении и
    инференсе [MASK] не встречается: если бы модель видела только его, она училась бы строить хорошие
    представления лишь в позициях с маской. Случайные и нетронутые токены заставляют её держать полезное
    представление для каждого токена и не доверять слепо входу.
  source: user-db
  source_ref: [d082422839, c457a679d3]
- id: iv-bert-03
  topic: other
  tags: [bert, retrieval]
  difficulty: medium
  kind: open
  question: "Почему «сырой» предобученный BERT плохо подходит как энкодер для семантического поиска?"
  answer: >
    MLM не учит, что близкие по смыслу тексты должны давать близкие векторы. Эмбеддинг [CLS] или среднее по
    токенам у необученного под поиск BERT анизотропны (векторы сбиты в узкий конус, косинус почти всегда высокий)
    и отражают частоты слов и поверхностную форму, а не смысл. Нужен контрастивный дообучение на парах
    «запрос — релевантный документ» (Sentence-BERT, E5, BGE и т. п.). Плюс ограничение 512 токенов — длинные
    документы надо резать.
  source: user-db
  source_ref: [bc020dbe3d]
- id: iv-bert-04
  topic: other
  tags: [bert]
  difficulty: medium
  kind: open
  question: "Как BERT ведёт себя на тексте с переставленными словами и на редких словах?"
  answer: >
    Порядок модель знает только через позиционные эмбеддинги, а MLM-предобучение на нормальном тексте даёт
    сильную опору на лексику: при перестановке слов многие представления и даже классификация меняются мало —
    BERT частично работает как «мешок слов с контекстом», хотя грамматические роли путаются. Редкие слова
    WordPiece режет на частые куски (##-подслова), поэтому неизвестных токенов почти нет, но смысл собирается
    из частей и для редких терминов, имён и опечаток получается хуже; помогает дообучение на доменном тексте.
  source: user-db
  source_ref: [70cf148fa2, 3256fe2b75]
- id: iv-bert-05
  topic: other
  tags: [bert]
  difficulty: easy
  kind: open
  question: "Как решают extractive question answering на BERT (в стиле SQuAD)?"
  answer: >
    На вход подаётся пара «[CLS] вопрос [SEP] контекст [SEP]». Поверх выходов токенов контекста ставятся два
    линейных слоя: один даёт логит «здесь начало ответа», другой — «здесь конец». Обучают кросс-энтропией по
    позициям начала и конца, на инференсе выбирают пару (start ≤ end, ограниченной длины) с максимальной суммой
    логитов; ответ — отрезок контекста. Если ответа нет, его кодируют как span на [CLS].
  source: user-db
  source_ref: [bf8ce65027]
- id: iv-training-01
  topic: training
  difficulty: easy
  kind: open
  question: "Какими оптимизаторами обучают трансформеры и почему чаще всего AdamW?"
  answer: >
    Стандарт — AdamW: адаптивный шаг по каждому параметру (оценки первого и второго моментов градиента) плюс
    weight decay, отделённый от градиентного шага. К нему — warmup и косинусное (или WSD) расписание learning
    rate, клиппинг нормы градиента. Чистый SGD для трансформеров сходится плохо из-за сильно различающегося
    масштаба градиентов по слоям. Из альтернатив: Adafactor (меньше памяти под моменты), Lion, Muon (для матричных
    параметров), Shampoo/SOAP.
  source: user-db
  source_ref: [47de2ed5c6]
- id: iv-retrieval-01
  topic: other
  tags: [retrieval, embeddings]
  difficulty: medium
  kind: open
  question: "Какие модели эмбеддингов для поиска ты знаешь и как выбрать подходящую для своей задачи?"
  answer: >
    Открытые: семейства BGE, E5, GTE, multilingual-e5, Nomic, Jina, Qwen3-Embedding; закрытые — эмбеддинги
    OpenAI (text-embedding-3-small/large), Cohere, Voyage. Выбирать по: языку и домену данных; результатам на
    MTEB (особенно в разделе retrieval и на нужном языке), но с проверкой на своём отложенном наборе запросов
    (hit rate / MRR / nDCG); максимальной длине входа; размерности вектора (память и скорость индекса);
    задержке и цене; возможности дообучения и лицензии. Для многих моделей важно правильно ставить префиксы
    «query:» / «passage:».
  source: user-db
  source_ref: [0122afcffc, 241c477cce, 9f838d1613]
- id: iv-retrieval-02
  topic: other
  tags: [retrieval]
  difficulty: medium
  kind: open
  question: "Чем bi-encoder отличается от cross-encoder и когда что использовать?"
  answer: >
    Bi-encoder кодирует запрос и документ независимо в векторы, близость — косинус или скалярное произведение.
    Документы можно закодировать заранее и искать по ANN-индексу среди миллионов за миллисекунды, но модель не
    видит запрос и документ вместе — тонкие совпадения теряются. Cross-encoder подаёт пару «запрос + документ» в
    один трансформер и выдаёт оценку релевантности: точнее, потому что attention связывает слова запроса и
    документа, но каждый документ надо прогонять заново на каждый запрос. Поэтому типичная схема двухэтапная:
    bi-encoder (и/или BM25) достаёт top-50…100, cross-encoder пересортирует их (reranker).
  source: user-db
  source_ref: [694c538168, 8491f6bb3f, 74c2cf9a47]
- id: iv-retrieval-03
  topic: other
  tags: [retrieval, rag]
  difficulty: medium
  kind: open
  question: "Что такое reranker, какие модели для этого берут и чем он усложняет систему?"
  answer: >
    Reranker — второй этап поиска: модель (обычно cross-encoder) переоценивает небольшой список кандидатов
    первого этапа и пересортировывает их. Примеры: cross-encoder на MiniLM (ms-marco), bge-reranker,
    jina-reranker, Cohere Rerank, а также LLM в роли ранжировщика. Минусы: добавляет задержку (прогон на
    каждого кандидата), стоимость GPU или API, ещё одну модель для поддержки и мониторинга; он не может вернуть
    то, чего не нашёл первый этап, поэтому полнота всё равно определяется первым этапом.
  source: user-db
  source_ref: [27c9571273, d7138aa0b4, e23150bf53]
- id: iv-retrieval-04
  topic: other
  tags: [retrieval, rag]
  difficulty: medium
  kind: open
  question: "Какие виды поиска используют в RAG и в чём сильные и слабые стороны каждого?"
  answer: >
    Лексический (BM25, полнотекстовый): точно ловит редкие термины, коды, имена, номера; прозрачен и дёшев; но
    не понимает синонимов и перефразировок. Векторный (плотные эмбеддинги): ловит смысл и перефразы, работает
    кросс-язычно; хуже с точными идентификаторами и редкими словами, качество зависит от модели и домена.
    Гибридный — оба с объединением списков (RRF или взвешенная сумма): обычно лучший по полноте. Дополнительно:
    фильтры по метаданным, поиск по графу знаний, SQL для структурированных данных, reranker поверх всего.
  source: user-db
  source_ref: [9f9ef9c45f, 3c092d9e41]
- id: iv-retrieval-05
  topic: other
  tags: [retrieval]
  difficulty: medium
  kind: open
  question: "Как работает BM25 и зачем держать его рядом с векторным поиском?"
  answer: >
    BM25 — функция ранжирования по словам запроса: для каждого слова берётся IDF (редкие слова важнее) и
    насыщающаяся функция частоты слова в документе (параметр k1), с нормировкой на длину документа (параметр b).
    Оценка документа — сумма по словам запроса. Он не требует обучения, мгновенно работает по инвертированному
    индексу и точно находит документы с редкими терминами, артикулами, аббревиатурами, где эмбеддинги часто
    промахиваются. Векторный поиск ловит перефразы. Вместе (гибрид) они покрывают слабые места друг друга.
  source: user-db
  source_ref: [bfbeafe19f, 38a84a9e3e]
- id: iv-retrieval-06
  topic: other
  tags: [retrieval, fine-tuning]
  difficulty: medium
  kind: open
  question: "Что даёт дообучение модели эмбеддингов на своих данных и как его делают?"
  answer: >
    Общая модель не знает доменной лексики и того, что в твоей задаче считается «релевантным». Дообучение на
    парах (запрос, релевантный документ) с контрастивным лоссом (InfoNCE с in-batch негативами, лучше с
    hard negatives, найденными самим поиском) сдвигает пространство под домен: обычно заметно растут hit rate и
    MRR. Пары берут из логов, размеченных вопросов или генерируют синтетически LLM-ом по документам. Цена —
    переиндексация всех документов и риск переобучиться на узкий набор запросов; проверять на отложенной выборке.
  source: user-db
  source_ref: [94760e1e09]
- id: iv-tokenization-01
  topic: tokenization
  difficulty: easy
  kind: open
  question: "Зачем LLM токенизатор? Можно ли подать текст в модель напрямую или обойтись без токенизации?"
  answer: >
    Модель работает с векторами из таблицы эмбеддингов, поэтому текст надо превратить в последовательность
    целых id из конечного словаря — это и делает токенизатор. Подслова (BPE и т. п.) — компромисс: словарь
    конечен (десятки–сотни тысяч), неизвестных слов нет, а последовательности короче, чем по символам. Без
    «словарного» токенизатора можно: модели на байтах или символах (ByT5, CANINE, MambaByte) берут словарь из
    256 байтов, но последовательности в разы длиннее и attention дороже. Трансформер без токенизации вообще
    возможен и для не-текстовых данных: патчи изображения (ViT), кадры аудио — там вход сразу векторный.
  source: user-db
  source_ref: [a63efe9534, 71bef214a6, f8afd7914c, 60cae7fbe0]
- id: iv-tokenization-02
  topic: tokenization
  difficulty: medium
  kind: open
  question: "Что будет, если подавать в трансформер числа (например, 12,77) прямо значениями во входной вектор, без токенизации?"
  answer: >
    Модель ждёт векторы размерности d_model из таблицы эмбеддингов; скаляр или набор чисел надо как-то
    спроецировать в это пространство (линейным слоем), иначе формы просто не совпадут. Технически так делают
    для временных рядов (патчи значений → линейная проекция, PatchTST), но языковая модель, обученная на
    токенах, такой вход не поймёт. Сырые значения к тому же плохо масштабированы (12,77 и 12 770 отличаются на
    порядки), их нужно нормировать. В обычной LLM число 12,77 токенизатор разобьёт на куски вроде «12», «,»,
    «77» — отсюда известные трудности LLM с арифметикой.
  source: user-db
  source_ref: [28e6e4fa06, 0db60823bb]
- id: iv-tokenization-03
  topic: tokenization
  difficulty: medium
  kind: open
  question: "Какие алгоритмы токенизации существуют и как они решают, где резать слово?"
  answer: >
    BPE (GPT-2, Llama 3, в байтовом варианте) начинает с символов или байтов и жадно сливает самую частую пару
    соседних единиц в новый токен, пока словарь не достигнет нужного размера; при токенизации применяет слияния
    в том же порядке. WordPiece (BERT) похож, но выбирает слияния по приросту правдоподобия. Unigram LM
    (SentencePiece, T5) начинает с большого словаря и выбрасывает токены, меньше всего влияющие на
    правдоподобие, а разбиение ищет как наиболее вероятное. Итог одинаковый по сути: частые слова — один токен,
    редкие — несколько частых кусков. Плюс предтокенизация (пробелы, цифры, пунктуация) и служебные токены.
  source: user-db
  source_ref: [b70e1f110d, 9cc7f97aef]
