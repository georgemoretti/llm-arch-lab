id: autograd-graph
title: "Граф вычислений: прямой и обратный проход"
description: >
  Выражение как граф: узлы — значения, рёбра подписаны локальными производными. Меняй входы
  ползунками и шагай по обратному проходу: видно, в каком порядке узлы получают градиент и как
  складываются вклады у переиспользованного узла.
