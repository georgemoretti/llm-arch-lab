# Вопросы курса к модулю 3 (MoE и DeepSeek): роутер, MoE-слой, балансировка, shared expert.
# Ответы написаны авторами курса. Квиз модуля (Фаза 5b) соберёт вопросы этого файла.
- id: router-basics-01
  topic: moe
  tasks: [C12-router]
  difficulty: easy
  kind: open
  question: "Как работает роутер в MoE-слое и почему MoE даёт больше параметров без роста вычислений?"
  answer: >
    Роутер — линейный слой без bias, который по скрытому состоянию токена выдаёт по логиту на
    каждого из E экспертов. Из оценок (softmax или sigmoid) выбираются k лучших, их выходы
    складываются с весами (обычно перенормированными к сумме 1). Параметров у слоя в E раз больше,
    чем у одного FFN, но каждый токен проходит только через k экспертов, поэтому FLOPs на токен —
    примерно как у k FFN плюс крошечный роутер.
  source: course
- id: router-softmax-axis-01
  topic: moe
  tasks: [C12-router, C12d-router-debug]
  difficulty: easy
  kind: mcq
  question: "Логиты роутера имеют форму [N, E] (токены × эксперты). По какой оси берётся softmax?"
  options:
    - "По оси токенов (dim=0): эксперт распределяет внимание между токенами"
    - "По оси экспертов (dim=-1): у каждого токена своё распределение по экспертам"
    - "По обеим осям сразу"
    - "Не важно — после перенормировки top-k результат одинаковый"
  correct: 1
  answer: >
    По экспертам: роутинг каждого токена — функция только его собственного скрытого состояния. Softmax
    по токенам делает маршрут зависимым от других токенов батча. Перенормировка top-k такую ошибку
    маскирует (сумма весов всё равно 1), но выбор экспертов и веса будут другими.
  source: course
- id: router-renorm-01
  topic: moe
  tasks: [C12-router]
  difficulty: medium
  kind: open
  question: >
    Зачем перенормировать веса top-k экспертов и почему Switch Transformer (top-1) этого не делает?
  answer: >
    После top-k сумма вероятностей выбранных экспертов меньше 1 и меняется от токена к токену;
    перенормировка делает масштаб выхода MoE-слоя стабильным (как у одного FFN). Для softmax это
    равносильно softmax только по выбранным логитам. Но при k = 1 перенормированный вес всегда равен 1,
    а роутер учится только через веса (индексы top-k не дифференцируемы) — градиента к роутеру не было
    бы вовсе. Поэтому Switch умножает выход эксперта на исходную вероятность.
  source: course
- id: router-sigmoid-01
  topic: moe
  tasks: [C12-router]
  difficulty: medium
  kind: open
  question: "Чем роутер DeepSeek-V3 отличается от роутера Mixtral?"
  answer: >
    Mixtral: softmax по 8 экспертам, top-2, перенормировка. DeepSeek-V3: 256 экспертов, оценка каждого —
    sigmoid логита (эксперты не конкурируют за общую массу вероятности), выбор top-8 — с добавлением
    bias для балансировки (он обновляется простым правилом, а не градиентом) и в два этапа (4 группы из 8, потом эксперты внутри
    них), веса выбранных — исходные sigmoid-оценки, перенормированные и умноженные на 2.5
    (routed_scaling_factor). Aux loss для балансировки V3 почти не использует.
  source: course
- id: moe-layer-dispatch-01
  topic: moe
  tasks: [C13-moe-layer]
  difficulty: medium
  kind: open
  question: "Как эффективно посчитать MoE-слой, чтобы каждый эксперт обрабатывал только свои токены?"
  answer: >
    Разложить назначения роутера в N·k «слотов» (токен, эксперт, вес), отсортировать слоты по
    эксперту (argsort) и посчитать, сколько слотов у каждого (bincount). Тогда токены каждого
    эксперта идут подряд: эксперт прогоняется одним батчем только на своих строках, результат
    умножается на веса слотов и возвращается на места токенов сложением по индексам (index_add).
    Вычислений — N·k прогонов строк вместо N·E. В распределённом обучении то же самое делается
    между устройствами через all-to-all, а на одном GPU — grouped GEMM.
  source: course
- id: moe-layer-scatter-add-01
  topic: moe
  tasks: [C13-moe-layer, C13d-moe-layer-debug]
  difficulty: easy
  kind: mcq
  question: >
    При обратной сборке выходов экспертов в MoE с top-2 написали out[tok] = y внутри цикла по
    экспертам. Что получится?
  options:
    - "Всё верно — каждый токен встречается у эксперта один раз"
    - "У каждого токена останется вклад только одного (последнего по циклу) эксперта"
    - "Ошибка формы при выполнении"
    - "Выход удвоится"
  correct: 1
  answer: >
    Внутри одного эксперта номера токенов действительно не повторяются, но токен встречается у двух
    разных экспертов, в разных итерациях цикла. Присваивание перезапишет вклад первого эксперта.
    Нужно складывать: out.index_add_(0, tok, y). При top-1 ошибка не видна.
  source: course
- id: moe-layer-params-flops-01
  topic: moe
  tasks: [C13-moe-layer]
  difficulty: medium
  kind: open
  question: >
    MoE-слой: E = 64 эксперта, top-k = 8, эксперт — SwiGLU шириной F_e. Во сколько раз больше
    параметров и во сколько раз больше FLOPs на токен, чем у одного такого эксперта?
  answer: >
    Параметров в 64 раза больше (плюс роутер E·C, это мелочь). FLOPs на токен — примерно в 8 раз
    больше (8 экспертов на токен) плюс роутер. Поэтому MoE описывают двумя числами — «всего» и
    «активных» параметров (например, OLMoE-1B-7B: около 7B всего и около 1B активных).
  source: course
