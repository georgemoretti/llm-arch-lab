# Вопросы с собеседований пользователя (source: user-db), переформулированные своими словами, с эталонными
# ответами курса. Тема: RAG, оценка (evals, LLM-as-a-judge, метрики поиска), prompt engineering — вне тем курса
# (topic: other). Сырые вопросы были привязаны к конкретным проектам; здесь — обобщённые формулировки.
# Правила — docs/QUESTIONS_IMPORT.md.
- id: iv-rag-01
  topic: other
  tags: [rag]
  difficulty: easy
  kind: open
  question: "Что такое RAG и каким должен быть источник знаний, чтобы RAG работал хорошо?"
  answer: >
    Retrieval-Augmented Generation: по запросу находят релевантные фрагменты во внешней базе и кладут их в промпт,
    а LLM отвечает, опираясь на них. Так модель получает свежие и приватные знания без дообучения, а ответы можно
    сопровождать ссылками на источники. База должна быть: актуальной и с понятным владельцем обновлений; без
    противоречий и дублей (или с версиями и датами); разбитой на самодостаточные куски с метаданными (источник,
    раздел, дата, права доступа); покрывающей реальные вопросы пользователей; в формате, который нормально
    парсится (текст и таблицы, а не картинки).
  source: user-db
  source_ref: [71605b36fd, 2d0c12923c]
- id: iv-rag-02
  topic: other
  tags: [rag]
  difficulty: medium
  kind: open
  question: >
    Тебе дали несколько десятков страниц из корпоративной вики и попросили сделать по ним RAG. Опиши шаги и
    архитектуру по порядку и какие инструменты понадобятся.
  answer: >
    (1) Сбор: выгрузить страницы через API вики (с вложениями и метаданными), не копипастом. (2) Парсинг и
    очистка: HTML → текст/Markdown с сохранением заголовков и таблиц, удаление навигации. (3) Нарезка на чанки
    по структуре (заголовкам) с перекрытием, к каждому — метаданные и ссылка на источник. (4) Эмбеддинги
    чанков и запись в векторную базу (плюс полнотекстовый индекс для BM25). (5) Поиск: гибридный retrieval,
    reranker, фильтры по метаданным. (6) Генерация: промпт с инструкцией, найденными чанками и вопросом, требование
    ссылаться на источники и говорить «не знаю». (7) Оценка на golden set и итерации. Инструменты: парсер
    (BeautifulSoup, unstructured, docling), модель эмбеддингов, векторная база (Qdrant, pgvector), LLM, при
    желании фреймворк (LangChain, LlamaIndex) и трассировка (Langfuse и т. п.).
  source: user-db
  source_ref: [7ce30114d0, 6dfb6af08e, cad12c17d1, 23f14b1281, 354f9cc0af, 20db7e253f, 2095f2ae6a, d721b9bd87]
- id: iv-rag-03
  topic: other
  tags: [rag, data]
  difficulty: medium
  kind: open
  question: "Какие трудности бывают при сборе и парсинге данных из корпоративной вики для RAG и чем их решать?"
  answer: >
    Вики-страницы — это HTML с макросами, вложенными страницами, таблицами, кодом, вложениями (PDF, картинки),
    устаревшими и дублирующими версиями, а ещё права доступа. Проблемы: макросы и навигация попадают в текст,
    таблицы разваливаются, длинная страница не влезает целиком в один чанк, картинки со смыслом теряются,
    ссылки между страницами не сохраняются. Решения: забирать через API в формате хранения, конвертировать в
    Markdown с сохранением заголовков и таблиц, страницу резать по разделам, вложения парсить отдельно (OCR при
    необходимости), сохранять метаданные (автор, дата, путь, доступ), отфильтровывать архивное.
  source: user-db
  source_ref: [897a3e6a7b, d82c7c2786, 74359756c1, 0b1a9efafd, 9c25f3c959]
- id: iv-rag-04
  topic: other
  tags: [rag, chunking]
  difficulty: medium
  kind: open
  question: "Как резать документы на чанки, с какого размера начинать и о чём помнить?"
  answer: >
    Резать по структуре: заголовки, абзацы, пункты списков (рекурсивный сплиттер), а не каждые N символов
    посреди предложения. Стартовая точка — 300–800 токенов с перекрытием 10–20 %, дальше подбирать по метрикам
    поиска. Нюансы: чанк должен быть понятен без соседей — добавлять заголовок раздела и название документа
    (contextual chunking); таблицы и код не рвать; слишком мелкие чанки теряют контекст, слишком крупные
    размывают эмбеддинг и тратят окно; размер согласовать с максимальной длиной модели эмбеддингов; хранить
    ссылку на исходный документ, чтобы можно было подтянуть соседние чанки (small-to-big).
  source: user-db
  source_ref: [ed8604abf3, a358d3afb2, 380101d9d5]
- id: iv-rag-05
  topic: other
  tags: [rag]
  difficulty: easy
  kind: open
  question: "По каким критериям выбирать LLM для генерации ответа в RAG?"
  answer: >
    Качество следования инструкции «отвечай только по контексту» и честного «не знаю» (замерить на своих
    данных); умение работать с длинным контекстом нужного размера; язык; задержка и стоимость при ожидаемой
    нагрузке; требования к данным (можно ли отправлять во внешний API или нужна своя модель); поддержка
    структурированного вывода и цитирования. Часто достаточно модели среднего размера: основную работу делает
    поиск.
  source: user-db
  source_ref: [1608eb6df0]
- id: iv-rag-06
  topic: other
  tags: [rag, retrieval]
  difficulty: medium
  kind: open
  question: "Пользователи формулируют вопросы не так, как написано в документах. Как сделать поиск устойчивым к формулировке (multi-query и др.)?"
  answer: >
    Multi-query: LLM генерирует несколько перефразировок запроса, поиск идёт по каждой, результаты объединяются
    (например, RRF) — разные формулировки достают разные релевантные чанки, растёт полнота. Похожие приёмы: HyDE
    (ищем по эмбеддингу сгенерированного гипотетического ответа), переписывание запроса с учётом истории диалога,
    разбиение сложного вопроса на подвопросы. Со стороны индекса: гибридный поиск (BM25 ловит точные термины),
    генерация для каждого чанка вопросов, на которые он отвечает, и индексация их; дообучение эмбеддингов на
    реальных запросах.
  source: user-db
  source_ref: [8ee4d6daf2, b961cd32e1, c0c5daf95e, 00a6a51740]
- id: iv-rag-07
  topic: other
  tags: [rag, prompting]
  difficulty: easy
  kind: open
  question: "Что обычно входит в итоговый промпт LLM в RAG-системе?"
  answer: >
    Системная инструкция (роль, отвечать только по контексту, что делать, если ответа нет, формат и язык ответа,
    как ссылаться на источники); найденные фрагменты с идентификаторами и метаданными (название, дата, ссылка),
    в осмысленном порядке; при необходимости — сжатая история диалога; сам вопрос пользователя (лучше в конце);
    иногда пара примеров хорошего ответа. Неизменную часть ставят в начало, чтобы работал кеш промпта.
  source: user-db
  source_ref: [d1b3752e2d]
- id: iv-rag-08
  topic: other
  tags: [rag, vector-db]
  difficulty: medium
  kind: open
  question: "Какие векторные базы ты знаешь, как выбрать одну из них и как с ней работают на практике (например, с Qdrant)?"
  answer: >
    Специализированные: Qdrant, Milvus, Weaviate, Pinecone (управляемая), Chroma (прототипы); расширения обычных
    СУБД: pgvector, Elasticsearch/OpenSearch; библиотеки: FAISS. Критерии: объём и рост данных, задержка, фильтры
    по метаданным вместе с ANN-поиском, гибридный (sparse + dense) поиск, обновления на лету, мультитенантность,
    эксплуатация (self-hosted или облако), команда уже знает Postgres. С Qdrant: создать коллекцию с размерностью
    и метрикой (cosine), загрузить точки (id, вектор, payload с метаданными), построить индексы payload для
    фильтров, искать query-запросом с фильтром и лимитом; HNSW-параметры и квантизацию векторов настраивать под
    объём.
  source: user-db
  source_ref: [01ec95aaed, 184bbae542, 1d5c5b757d]
- id: iv-rag-09
  topic: other
  tags: [rag, retrieval]
  difficulty: medium
  kind: open
  question: "Что такое гибридный retrieval, как работает Reciprocal Rank Fusion и как такую схему реализуют?"
  answer: >
    Параллельно запускают лексический (BM25) и векторный поиск и объединяют списки. RRF складывает не оценки
    (у них разные шкалы), а ранги: score(d) = Σ_i 1 / (k + rank_i(d)), обычно k = 60; документ, высоко стоящий
    хотя бы в одном списке или средне в обоих, поднимается наверх. Альтернатива — взвешенная сумма
    нормированных оценок с подбором веса на валидации. Реализация: оба индекса (часто одна база с sparse и dense
    векторами — Qdrant, Elasticsearch, Weaviate), top-N из каждого, слияние, затем reranker по объединённому
    списку.
  source: user-db
  source_ref: [e772841cf4, 10f4cf355b, 83e8924e36, 8c56a526e2]
- id: iv-rag-10
  topic: other
  tags: [rag, data]
  difficulty: medium
  kind: open
  question: "Как организовать хранение и подготовку данных для RAG при больших объёмах? Что такое материализованное представление и зачем оно здесь?"
  answer: >
    Объёмы бывают от сотен документов до миллионов чанков. Типичная схема: сырые данные в хранилище (объектное
    хранилище, DWH), конвейер выгрузки и обработки (парсинг, очистка, чанкинг, эмбеддинги) с инкрементальными
    обновлениями по дате изменения, затем индекс в векторной базе; в метаданных — id и версия источника для
    переиндексации. Материализованное представление — сохранённый на диск результат запроса к базе, который
    обновляется по расписанию или событию: удобно заранее собрать «плоскую» витрину текстов из многих таблиц и
    пересчитывать её, а не выполнять тяжёлый запрос при каждой выгрузке в индекс.
  source: user-db
  source_ref: [08b0020b5f, 69c24756cb, c6cebc8678, b0b09d187f]
- id: iv-rag-11
  topic: other
  tags: [rag, faq]
  difficulty: medium
  kind: open
  question: "Есть около тысячи пар «вопрос — ответ» (FAQ поддержки) и два дня. Как быстро собрать работающую систему ответов?"
  answer: >
    Не строить сложный RAG по документам, а искать похожий вопрос: проиндексировать вопросы (и, отдельно, ответы)
    эмбеддингами, по запросу находить ближайшие пары гибридным поиском, при высоком сходстве отдавать ответ
    близкого вопроса (или давать LLM сформулировать ответ по 3–5 найденным парам), при низком — честно
    отказывать или звать оператора. День 1: очистка, дедупликация, индекс, простой интерфейс. День 2: golden set
    из отложенных и перефразированных вопросов, замер hit rate / MRR, подбор порога, промпт для LLM.
  source: user-db
  source_ref: [a29ccd846b]
- id: iv-rag-12
  topic: other
  tags: [rag, faq, data]
  difficulty: hard
  kind: open
  question: >
    Пар «вопрос — ответ» уже 5–10 тысяч: много дублей, у одних вопросов идеальные ответы, у других ответов нет или
    они неполные. Как подготовить такую базу для поиска?
  answer: >
    Кластеризовать вопросы по эмбеддингам (плюс точная дедупликация), внутри кластера выбрать канонический вопрос
    и лучший ответ (по полноте, дате, оценкам; LLM может помочь выбрать или объединить), остальные формулировки
    сохранить как перефразы, ведущие на тот же ответ, — это улучшает поиск. Вопросы без ответа не класть в базу
    как ответы: собрать в отдельный список пробелов для экспертов, а в системе по таким темам отвечать «нет
    информации» и логировать. В метаданных хранить источник и полноту ответа, чтобы фильтровать и считать
    покрытие.
  source: user-db
  source_ref: [cf5f0dd736, 51bccb74bd, d3bdbe02fe, 3cd9ac6856]
- id: iv-rag-13
  topic: other
  tags: [rag, debugging]
  difficulty: medium
  kind: open
  question: "RAG отвечает плохо. Как найти причину и как системно фиксировать и исправлять проблемы?"
  answer: >
    Разделить этапы и смотреть трассы на конкретных плохих примерах. Нашёлся ли нужный чанк (retrieval: hit rate
    на golden set)? Если нет — данные отсутствуют или плохо распарсены, неудачный чанкинг, формулировка запроса,
    слабые эмбеддинги → чинить индекс, гибридный поиск, query rewriting, reranker. Если нашёлся, но ответ плохой —
    генерация: контекста слишком много или он противоречив, промпт, модель → менять промпт, порядок и число
    чанков, модель. Каждую найденную ошибку записывать в набор регрессионных примеров с категорией причины и
    после каждого изменения прогонять evals, чтобы не сломать уже работавшее.
  source: user-db
  source_ref: [4e48e2a7c1, ef85a20d04, b6a065c642, ad32226918]
- id: iv-rag-14
  topic: other
  tags: [rag, data]
  difficulty: hard
  kind: open
  question: "Документации нет, есть только огромный рабочий чат многих сотрудников. Как превратить его в базу знаний и как декомпозировать такую задачу?"
  answer: >
    Разбить на этапы с проверкой каждого: (1) выгрузка и очистка (служебные сообщения, приветствия, персональные
    данные); (2) восстановление тредов — группировка сообщений в обсуждения по ответам, времени и теме; (3)
    отбор обсуждений, где был вопрос и решение (классификатор или LLM); (4) извлечение пары «проблема — решение» в
    сжатом виде LLM-ом со ссылкой на исходные сообщения; (5) дедупликация и кластеризация по темам, отметка
    устаревшего по дате; (6) выборочная проверка экспертами и метрики качества на каждом шаге; (7) индексация как
    FAQ-базы. Начать с небольшого среза, чтобы отладить конвейер.
  source: user-db
  source_ref: [a7face7425, 5eac276d9c]
- id: iv-evals-01
  topic: other
  tags: [evals, rag, agents]
  difficulty: medium
  kind: open
  question: "Зачем нужны evals в RAG- и агентных системах и как устроена оценка RAG?"
  answer: >
    LLM-системы недетерминированы и ломаются незаметно: смена промпта, модели или данных может улучшить одно и
    ухудшить другое. Evals — набор примеров с ожидаемым поведением и автоматические проверки, которые позволяют
    сравнивать версии и ловить регрессии. Для RAG оценивают отдельно: поиск (hit rate, recall@k, MRR, nDCG по
    golden set с размеченными релевантными документами) и генерацию (faithfulness — опирается ли ответ на
    контекст, answer relevancy, корректность относительно эталона — LLM-as-a-judge или сверка). Для агентов ещё:
    успешность задачи целиком, правильность выбора инструментов и аргументов, число шагов, стоимость.
  source: user-db
  source_ref: [66030628c0, 3680720323, 38e0796e36, 96c40f9654, ad36ee34eb]
- id: iv-evals-02
  topic: other
  tags: [evals]
  difficulty: medium
  kind: open
  question: "Как собрать golden set для оценки системы и как его развивать со временем?"
  answer: >
    Источники: реальные запросы пользователей (логи), вопросы от экспертов домена, синтетические вопросы,
    сгенерированные LLM по документам (с ручной проверкой). Для каждого примера — эталонный ответ и/или
    релевантные документы; покрыть разные типы вопросов, сложные случаи и вопросы без ответа в базе. Начать с
    50–200 примеров. Расширять: каждый найденный в проде провал → новый пример; периодически добавлять свежие
    запросы; балансировать по категориям; версионировать набор, чтобы сравнения были честными; держать часть
    примеров отложенной, чтобы не подгонять систему под набор.
  source: user-db
  source_ref: [8ec0cc3966, 5e5fb6fba6]
- id: iv-evals-03
  topic: other
  tags: [evals]
  difficulty: medium
  kind: open
  question: "Заказчик недоступен для проверки. Как самому убедиться, что система работает, прежде чем отдавать версию?"
  answer: >
    Собрать свой golden set из документов: сгенерировать вопросы LLM-ом по случайным фрагментам (эталон — сам
    фрагмент) и вручную отобрать качественные, добавить перефразы и вопросы без ответа. Автоматически замерить
    поиск (hit rate, MRR) и генерацию (LLM-as-a-judge на faithfulness и корректность), выборочно прочитать
    ответы самому. Сравнить с простой базовой версией. Отдать с измеренными метриками, известными ограничениями
    и сбором обратной связи (кнопки оценки, логи), чтобы следующая итерация шла по данным.
  source: user-db
  source_ref: [0a8f639144, 8d418356f5]
- id: iv-evals-04
  topic: other
  tags: [evals, retrieval]
  difficulty: easy
  kind: open
  question: "Что такое hit rate и MRR и как с их помощью оценивают поиск в RAG?"
  answer: >
    Нужен набор запросов, для каждого известен релевантный документ (чанк). Hit rate@k — доля запросов, у которых
    релевантный документ попал в top-k выдачи: меряет полноту поиска без учёта позиции. MRR (mean reciprocal rank)
    — среднее по запросам от 1 / rank первого релевантного (0, если не найден): учитывает, насколько высоко он
    стоит. Hit rate отвечает на вопрос «найдём ли мы вообще», MRR — «насколько близко к верху». Считают для разных
    k и сравнивают конфигурации поиска.
  source: user-db
  source_ref: [19e76190b3, bf94d22fa1, ce25faaa8a, baf191c833, bff8e5c864]
- id: iv-evals-05
  topic: other
  tags: [evals, retrieval]
  difficulty: easy
  kind: mcq
  question: "Для трёх запросов первый релевантный документ оказался на позициях 1, 4 и не найден в top-10. Чему равны hit rate@10 и MRR?"
  options: ["2/3 и 0.75", "2/3 и ≈ 0.42", "1 и ≈ 0.42", "2/3 и ≈ 0.63"]
  correct: 1
  answer: >
    Hit rate@10 = 2 из 3 запросов нашли релевантный документ = 2/3. MRR = (1/1 + 1/4 + 0) / 3 = 1.25 / 3 ≈ 0.42.
  source: user-db
