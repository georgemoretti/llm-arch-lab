# Вопросы курса к блоку B, модуль 1 (Transformer: энкодер и декодер): padding-маска, multi-head, синусоидальные
# позиции, энкодер, cross-attention, teacher forcing, label smoothing, генерация, проект «число → слова».
# Ответы написаны авторами курса. Квиз B-Q1 собирает весь файл.
- id: encdec-padding-axis-01
  topic: attention
  tasks: [B01-padding-mask, B01d-heads-debug]
  difficulty: medium
  kind: mcq
  question: "Padding-маска в энкодере должна запрещать PAD-позиции по какой оси матрицы оценок [T, S]?"
  options:
    - "По оси запросов (строки): PAD-токены не должны ни на что смотреть"
    - "По оси ключей (столбцы): никто не должен смотреть на PAD"
    - "По обеим осям сразу, иначе модель обучится на паддинге"
    - "Ни по какой: достаточно обнулить эмбеддинг PAD"
  correct: 1
  answer: >
    Запрещают ключи: тогда выход на настоящих токенах не зависит ни от числа PAD, ни от их содержимого. Строки
    PAD-запросов считают как обычно (они видят настоящие токены), а их выходы потом игнорируют в лоссе и пулинге.
    Если запретить строки, у PAD-запроса все оценки станут −inf и softmax даст nan, а настоящие токены продолжат
    смотреть на PAD. Нулевой эмбеддинг PAD не спасает: после первого слоя на PAD-позиции появляется позиционная
    часть и вклад attention, и вектор уже не нулевой.
  source: course
- id: encdec-padding-why-01
  topic: attention
  tasks: [B01-padding-mask, B03-encoder]
  difficulty: easy
  kind: open
  question: "Зачем вообще нужен паддинг и что сломается, если забыть padding-маску в энкодере?"
  answer: >
    Тексты в батче разной длины, а тензор прямоугольный, поэтому короткие дополняют PAD. Без маски настоящие токены
    смотрят на PAD как на обычные слова: представление текста зависит от того, сколько PAD добавили, то есть от
    длины соседей по батчу. Один и тот же текст получит разный эмбеддинг в разных батчах и при инференсе по одному.
    Модель частично подстроится к этому на обучении, но результат станет зависеть от batch size и способа сортировки
    данных.
  source: course
- id: encdec-padding-torch-01
  topic: attention
  tasks: [B01-padding-mask]
  difficulty: easy
  kind: mcq
  question: "В nn.MultiheadAttention передан key_padding_mask = (ids != pad_id). Что произойдёт?"
  options:
    - "Всё верно: True отмечает настоящие токены"
    - "Модель будет смотреть только на PAD: в key_padding_mask True означает «игнорировать»"
    - "Ошибка типа: маска должна быть float"
    - "Маска применится к запросам, а не к ключам"
  correct: 1
  answer: >
    В PyTorch у key_padding_mask (и у bool attn_mask в nn.MultiheadAttention) True — это «замаскировать». Маска
    ids != pad_id запретит все настоящие токены и оставит только PAD; у текстов без паддинга вся строка станет −inf и
    появятся nan. В F.scaled_dot_product_attention у bool-маски смысл обратный (True — участвует). Перед переносом кода
    всегда проверяют соглашение конкретной функции; в курсе True = «можно смотреть».
  source: course
- id: encdec-mha-split-01
  topic: attention
  tasks: [B01-padding-mask, B01d-heads-debug]
  difficulty: medium
  kind: code-reading
  question: >
    Тензор x формы [B, L, C] режут на H голов строкой x.view(B, H, L, C // H). Форма правильная. Что не так и как
    это заметить?
  answer: >
    view перечитывает память в новой форме: в «голову 0» попадают подряд идущие числа плоского массива, то есть
    целые векторы первых L/H позиций, а не первые C/H чисел каждой позиции. Головы видят перемешанные позиции,
    padding-маска по ключам закрывает не те элементы. Правильно: x.view(B, L, H, D).transpose(1, 2). При H = 1 оба
    варианта совпадают, поэтому ошибку ловят только при H > 1: сравнением с эталоном, проверкой эквивариантности к
    перестановке токенов и независимости выхода от содержимого PAD.
  source: course
- id: encdec-sinusoid-shift-01
  topic: positional-encoding
  tasks: [B02-sinusoidal]
  difficulty: medium
  kind: open
  question: "Почему для синусоидальных позиций PE(p + k) — линейная функция PE(p) и чем это полезно?"
  answer: >
    Каждая пара столбцов — это (sin pω, cos pω) одной частоты. По формулам синуса и косинуса суммы сдвиг на k —
    поворот этой пары на угол kω, а поворот — умножение на матрицу 2×2, не зависящую от p. Значит, PE(p + k) =
    M_k · PE(p) с блочно-диагональной ортогональной M_k. Для модели «на k позиций левее» — одно и то же линейное
    преобразование в любом месте текста, а скалярное произведение PE(p)·PE(p + k) зависит только от k. Эта идея,
    перенесённая прямо в q и k, стала RoPE.
  source: course
- id: encdec-sinusoid-sqrt-01
  topic: embeddings
  tasks: [B02-sinusoidal]
  difficulty: medium
  kind: mcq
  question: "Зачем в исходном Transformer эмбеддинги токенов умножают на √d_model перед сложением с позициями?"
  options:
    - "Чтобы дисперсия логитов attention не зависела от d_model"
    - "Матрица эмбеддингов общая с выходным слоем и потому маленькая; без множителя позиции (норма √(d/2)) заглушили бы токены"
    - "Это нормализация вместо LayerNorm на входе"
    - "Чтобы градиенты эмбеддингов были больше и они учились быстрее"
  correct: 1
  answer: >
    Одна матрица служит и эмбеддингом, и выходным слоем (§3.4). Выходному слою нужны маленькие веса, поэтому её
    инициализируют с std порядка 1/√d — тогда вектор токена имеет норму около 1. У синусоидальной позиции норма
    √(d/2), то есть при d = 512 в 16 раз больше. Умножение на √d выравнивает масштабы токена и позиции.
  source: course
- id: encdec-sinusoid-vs-learned-01
  topic: positional-encoding
  tasks: [B02-sinusoidal]
  difficulty: easy
  kind: open
  question: "Чем синусоидальные позиции отличаются от обучаемых (GPT-2, BERT) и почему авторы Transformer выбрали синусоиды?"
  answer: >
    Обучаемые позиции — таблица параметров с отдельной строкой на каждый номер до максимальной длины; позиции дальше
    таблицы не существуют. Синусоиды — фиксированная формула без параметров, определённая для любого номера, со
    связью между соседними позициями (сдвиг — поворот). По качеству в статье варианты почти одинаковы (таблица 3,
    строка E); синусоиды выбрали в надежде на работу с текстами длиннее обучающих. На практике такая экстраполяция
    работает плохо, и позже пришли к RoPE и относительным схемам.
  source: course
- id: encdec-encoder-postln-01
  topic: normalization
  tasks: [B03-encoder]
  difficulty: medium
  kind: mcq
  question: "Где стоит LayerNorm в слое энкодера исходного Transformer?"
  options:
    - "Перед каждым подслоем: x + f(LN(x))"
    - "После сложения с остатком: LN(x + f(x))"
    - "Только один раз, после всей стопки"
    - "Внутри attention, на q и k"
  correct: 1
  answer: >
    В статье 2017 года — Post-LN: LN(x + Sublayer(x)), у каждого из двух подслоёв. Выход каждого слоя нормирован,
    финальная норма после стопки не нужна. Позже почти все модели перешли на Pre-LN (x + f(LN x) и LN после стопки):
    у Post-LN градиенты верхних слоёв на старте велики, и глубокие сети без долгого прогрева LR обучаются нестабильно
    (Xiong et al., 2020). BERT и исходный Transformer — Post-LN, GPT-2 и далее — Pre-LN.
  source: course
- id: encdec-cross-qkv-01
  topic: attention
  tasks: [B04-decoder, B04d-cross-mask-debug]
  difficulty: easy
  kind: mcq
  question: "В cross-attention декодера откуда берутся запросы, ключи и значения?"
  options:
    - "Q, K, V — из выхода энкодера"
    - "Q — из энкодера, K и V — из декодера"
    - "Q — из декодера, K и V — из выхода энкодера"
    - "Q, K, V — из декодера, а энкодер прибавляется к остатку"
  correct: 2
  answer: >
    Декодер спрашивает: запросы — из его текущих состояний («какое слово источника мне сейчас нужно?»). Ключи и
    значения — из памяти энкодера, одной на все слои декодера. Матрица весов прямоугольная T × S: строка — позиция
    цели, столбец — токен источника. Поэтому выход cross-attention имеет длину цели.
  source: course
- id: encdec-cross-mask-01
  topic: attention
  tasks: [B04-decoder, B04d-cross-mask-debug]
  difficulty: medium
  kind: open
  question: "Какие маски у трёх видов attention в энкодер-декодере и почему в cross-attention нет causal-маски?"
  answer: >
    Self-attention энкодера — только padding источника. Self-attention декодера — causal и padding цели: иначе при
    teacher forcing позиция t увидит правильный ответ y_t. Cross-attention — только padding источника. Causal там
    не нужен: источник известен целиком ещё до начала генерации, и первое слово перевода имеет право зависеть от
    конца исходной фразы. Causal-маска в cross-attention — тихая ошибка: модель учится, но начало ответа не видит
    конец источника.
  source: course
- id: encdec-decoder-vs-gpt-01
  topic: architecture
  tasks: [B04-decoder]
  difficulty: easy
  kind: open
  question: "Чем слой декодера исходного Transformer отличается от блока GPT?"
  answer: >
    У GPT в блоке два подслоя: causal self-attention и FFN. У декодера Transformer — три: causal self-attention,
    cross-attention к памяти энкодера и FFN, у каждого остаток и LayerNorm. GPT по сути — декодер без cross-attention
    (и без энкодера): весь «источник» он получает как начало того же текста. Плюс различия эпохи: Post-LN вместо
    Pre-LN, ReLU вместо GELU, синусоидальные позиции вместо обучаемых.
  source: course
- id: encdec-seq2seq-shift-01
  topic: training
  tasks: [B05-seq2seq, B05d-shift-debug]
  difficulty: easy
  kind: open
  question: "Что такое teacher forcing и зачем цель сдвигают вправо с BOS в начале?"
  answer: >
    При обучении правильный ответ известен, поэтому декодеру подают его целиком, а не его собственные предсказания.
    Вход — [BOS, y0, …, y_{T−2}], цель — [y0, …, y_{T−1}]: на позиции t декодер видит (через causal-маску) только
    BOS и y_{<t} и предсказывает y_t. Все позиции считаются за один проход. BOS нужен, чтобы у первой позиции был
    вход, и чтобы при генерации начинать с того же токена, что при обучении. Если при обучении на позиции 0 стоит
    что-то другое (например, после torch.roll — EOS), модель учится отлично, а генерирует мусор.
  source: course
- id: encdec-seq2seq-exposure-01
  topic: generation
  tasks: [B05-seq2seq, B06-num2words]
  difficulty: medium
  kind: open
  question: "В чём недостаток teacher forcing (exposure bias) и почему его всё равно используют?"
  answer: >
    При обучении декодер всегда видит правильный префикс, а при генерации — свой собственный, с ошибками. Ситуации
    «я уже ошибся» он на обучении не встречал, и одна ошибка может потянуть за собой следующие. Используют всё
    равно, потому что это быстро и стабильно: все позиции параллельно, один проход, без последовательного сэмплинга.
    Смягчают проблему scheduled sampling, обучением на выходах модели, а для LLM — дообучением на своих генерациях
    (RL, DPO).
  source: course
- id: encdec-seq2seq-encode-once-01
  topic: inference
  tasks: [B05-seq2seq]
  difficulty: easy
  kind: mcq
  question: "При жадной генерации seq2seq сколько раз нужно прогнать энкодер на один источник?"
  options:
    - "Один раз: память источника не зависит от того, что уже сгенерировано"
    - "На каждом шаге, потому что cross-attention меняется"
    - "Дважды: для self- и cross-attention"
    - "Столько раз, сколько слоёв в декодере"
  correct: 0
  answer: >
    Энкодер видит только источник, а он не меняется во время генерации. Память [B, S, C] считают один раз, а декодер
    запускают в цикле на растущем префиксе. В эффективных реализациях ещё и кешируют K и V cross-attention каждого
    слоя (их тоже достаточно посчитать один раз) и KV-cache self-attention декодера.
  source: course
- id: encdec-smoothing-target-01
  topic: training
  tasks: [B05-seq2seq]
  difficulty: medium
  kind: mcq
  question: "Label smoothing с ε = 0.1 и словарём V. Какая цель у позиции с правильным токеном y (соглашение PyTorch)?"
  options:
    - "1 у y, 0 у остальных"
    - "0.9 у y, 0.1/(V − 1) у остальных"
    - "0.9 + 0.1/V у y, 0.1/V у остальных"
    - "0.1 у y, 0.9/V у остальных"
  correct: 2
  answer: >
    q = (1 − ε)·one-hot + ε/V: равномерная часть достаётся всем классам, включая правильный, поэтому у y получается
    0.9 + 0.1/V. Это соглашение F.cross_entropy(label_smoothing=…) и статьи Szegedy et al. В fairseq ε делят на
    V − 1 неверных классов (вариант 2) — при большом словаре разница несущественна. Лосс раскладывается как
    (1 − ε)·(−log p_y) + ε·(−среднее log p по словарю).
  source: course
- id: encdec-smoothing-why-01
  topic: training
  tasks: [B05-seq2seq]
  difficulty: medium
  kind: open
  question: "Зачем label smoothing и почему с ним перплексия хуже, а качество перевода лучше?"
  answer: >
    С one-hot целью лосс убывает, пока логит правильного токена уходит в бесконечность: модель учится быть
    сверхуверенной, растут веса, хуже калибровка. Сглаженная цель достигает минимума при p = q с конечными логитами,
    и модель держит небольшую вероятность на альтернативах. Перплексия измеряет вероятность правильного токена,
    а её модель намеренно не доводит до 1, — поэтому перплексия хуже. Зато генерация и beam search становятся
    устойчивее, BLEU растёт (§5.4 статьи, ε = 0.1). Побочный эффект: представления классов «сжимаются», что вредит
    дистилляции (Müller et al., 2019).
  source: course
- id: encdec-smoothing-grad-01
  topic: training
  tasks: [B05-seq2seq]
  difficulty: hard
  kind: open
  question: "Чему равен градиент cross-entropy с label smoothing по логитам и что из этого следует?"
  answer: >
    ∂L/∂z = p − q, где p = softmax(z), q = (1 − ε)·one-hot + ε/V (для среднего — делённое на число позиций). Как и
    у обычной cross-entropy (A04), только цель мягкая. Градиент обнуляется при p = q, то есть при конечных логитах:
    log-отношение правильного класса к остальным стремится к log((1 − ε + ε/V)/(ε/V)), а не к бесконечности. Поэтому
    label smoothing — регуляризация по логитам. На PAD-позициях градиент нулевой: они исключены из среднего.
  source: course
- id: encdec-project-shift-01
  topic: training
  tasks: [B06-num2words]
  difficulty: medium
  kind: open
  question: >
    Seq2seq, обученный на 2000 случайных числах до миллиона, переводит 99 % отложенных чисел без ошибок, но «761»
    превращает в «семь тысяч шестьсот одиннадцать». Почему и как это исправить?
  answer: >
    Это сдвиг распределения. Среди случайных чисел до миллиона 90 % шестизначных, а трёхзначных около 0.1 %: в
    обучении их почти нет, и модель выучила «первая цифра — сотни тысяч». Отложенная выборка взята из того же
    распределения, поэтому метрика высокая, но о коротких числах она почти ничего не говорит. Исправляют данными:
    сбалансировать выборку по длине (одинаково 1…6 цифр) и мерить качество отдельно по срезам. Общий вывод:
    средняя метрика скрывает провалы на редких группах.
  source: course
- id: encdec-project-alignment-01
  topic: attention
  tasks: [B06-num2words]
  difficulty: easy
  kind: open
  question: "Что показывает карта весов cross-attention обученного seq2seq и откуда в ней «выравнивание»?"
  answer: >
    Строка — сгенерированный токен цели, столбец — токен источника, значение — вес attention (обычно среднее по
    головам последнего слоя). У обученной модели «число → слова» почти диагональ: «сто» смотрит на «1», «двадцать» —
    на «2». Выравнивание никто не размечал: оно появляется само, потому что для предсказания слова выгодно смотреть
    на нужные цифры. То же наблюдали Bahdanau et al. для перевода. Но веса attention — не объяснение решения: модель
    может опираться и на остаток, и на другие слои.
  source: course
