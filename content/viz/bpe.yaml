id: bpe
title: "BPE по шагам: слияния, токены в тексте, длина последовательности"
description: >
  Byte-level BPE обучается прямо в браузере на введённом тексте (с пре-токенизацией в стиле GPT-2 или без
  неё). Ползунок — число слияний: текст с подсветкой токенов, таблица выученных слияний и кривые «размер
  словаря → токенов на текст и байтов на токен».
