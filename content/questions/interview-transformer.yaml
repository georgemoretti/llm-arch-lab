# Вопросы с собеседований пользователя (source: user-db), переформулированные своими словами, с эталонными
# ответами курса. Тема: устройство трансформера, attention, позиции, KV-cache, FlashAttention / PagedAttention.
# Разметка и правила — docs/QUESTIONS_IMPORT.md; сырые формулировки в репозиторий не копируются.
- id: iv-attention-01
  topic: attention
  tasks: [C00-causal-mha, C-Q1-llama-quiz]
  difficulty: easy
  kind: open
  question: "Объясни self-attention через запросы, ключи и значения: что считается и по какой формуле?"
  answer: >
    Каждый токен проецируется тремя матрицами в запрос q = xW_Q, ключ k = xW_K и значение v = xW_V. Для пары
    токенов (i, j) score = q_i·k_j / √d — насколько j релевантен для i. Строку scores нормируют softmax, получая
    веса, и выход токена i — взвешенная сумма значений: softmax(QKᵀ/√d)·V. Деление на √d держит scores в разумном
    диапазоне, чтобы softmax не насыщался. В декодере добавляется causal-маска: токен смотрит только на прошлое.
  source: user-db
  source_ref: ["acfdc0a8d6", "e2b0bca93b", "fe66635f78"]
- id: iv-attention-02
  topic: attention
  tasks: [C00-causal-mha]
  difficulty: easy
  kind: mcq
  question: "Что в attention обучаемое и постоянное, а что пересчитывается для каждого входа?"
  options:
    - "Матрицы Q, K, V — обучаемые параметры, одинаковые для любого текста"
    - "Веса W_Q, W_K, W_V фиксированы после обучения; сами Q, K, V получаются умножением входа на них и зависят от текста"
    - "W_Q, W_K, W_V подбираются заново под каждую последовательность"
    - "Q зависит от входа, а K и V — константы слоя"
  correct: 1
  answer: >
    Параметры слоя — проекции W_Q, W_K, W_V (и W_O); после обучения они не меняются. Тензоры Q = XW_Q, K = XW_K,
    V = XW_V — активации: другой текст даёт другие Q, K, V, а значит и другие веса внимания. Именно поэтому
    attention «динамический»: связи между токенами вычисляются заново для каждого входа.
  source: user-db
  source_ref: ["677d3207b7"]
- id: iv-attention-03
  topic: attention
  tasks: [C00-causal-mha, C04-gqa, C-Q1-llama-quiz]
  difficulty: easy
  kind: open
  question: "Как устроен multi-head attention и что он даёт по сравнению с одной большой головой?"
  answer: >
    Модельное пространство d_model делится на H голов размера d = d_model / H: у каждой свои проекции q, k, v,
    каждая независимо считает свой softmax(qkᵀ/√d)v, результаты склеиваются и смешиваются выходной проекцией
    W_O. Вычислений столько же, сколько у одной головы размера d_model, но каждая голова строит собственное
    распределение внимания: одна может следить за синтаксисом, другая за соседними токенами, третья за
    кореференцией. Одна голова дала бы лишь один усреднённый «взгляд» на строку.
  source: user-db
  source_ref: ["fe56d8fa80", "a5b0c0e64a"]
- id: iv-attention-04
  topic: attention
  tasks: [C00-causal-mha]
  difficulty: medium
  kind: open
  question: "Головы multi-head attention устроены одинаково. Почему после обучения они делают разное?"
  answer: >
    Их параметры инициализируются случайно и независимо, поэтому стартуют из разных точек и получают разные
    градиенты; дальше симметрия только усиливается — головам выгодно не дублировать друг друга, ведь выход W_O
    смешивает их вклады, и лосс снижается сильнее, если головы несут разную информацию. Если бы все головы
    инициализировали одинаково, они так и остались бы копиями. На практике часть голов всё равно оказывается
    избыточной — их можно обрезать почти без потерь.
  source: user-db
  source_ref: ["19ace03975"]
- id: iv-architecture-01
  topic: architecture
  tasks: [C00-causal-mha, C06-llama-block]
  difficulty: easy
  kind: open
  question: "Из каких частей состоит трансформер и через что проходит текст по дороге к выходу?"
  answer: >
    Текст режется токенизатором на токены, каждый id заменяется вектором из таблицы эмбеддингов, к нему
    добавляется (или в attention применяется) позиционная информация. Дальше — стопка одинаковых блоков: в
    каждом attention-подслой (токены обмениваются информацией) и FFN-подслой (поточечное нелинейное
    преобразование), каждый с остаточным соединением и нормализацией. В энкодере (BERT) attention
    двунаправленный, в декодере (GPT) — с causal-маской. В конце — нормализация и проекция в словарь (LM head)
    или голова под задачу. Ядро архитектуры — блок «attention + FFN + residual + norm».
  source: user-db
  source_ref: ["300c7430a3", "e1ca86a486", "296e3f3335"]
- id: iv-positional-01
  topic: positional-encoding
  tasks: [C03-rope, C10-nope, C-Q1-llama-quiz]
  difficulty: easy
  kind: open
  question: "Attention сам по себе не знает порядка токенов. Как трансформер узнаёт позиции и расстояния между ними?"
  answer: >
    Без позиций attention перестановочно-эквивариантен: переставь токены — выходы переставятся так же, порядок
    потерян. Поэтому позицию вносят явно. Вариант 1 — абсолютные эмбеддинги позиций (синусоидальные или
    обучаемые, GPT-2, BERT) прибавляются к эмбеддингам токенов. Вариант 2 — относительные схемы: RoPE поворачивает
    q и k на угол, пропорциональный позиции, и score q_m·k_n зависит только от m − n; ALiBi добавляет к score
    штраф, растущий с расстоянием. Causal-маска тоже даёт неявный сигнал о позиции (на этом работают NoPE-слои).
  source: user-db
  source_ref: ["8d2716d55e", "8eb0558e31", "c5a3a8595f"]
- id: iv-positional-02
  topic: positional-encoding
  tasks: [C03-rope]
  difficulty: hard
  kind: open
  question: "Позиционный эмбеддинг просто прибавили к эмбеддингу токена. Как модель потом отделяет «что» от «где»?"
  answer: >
    Явно она их не разделяет, но в пространстве большой размерности это и не нужно. Векторы позиций и токенов
    обучаются так, что в основном лежат в почти ортогональных подпространствах; линейные проекции W_Q, W_K
    могут «вытаскивать» нужную компоненту, поэтому сумма почти без потерь хранит обе. Синусоидальные позиции
    к тому же имеют структуру (сдвиг — линейное преобразование). Неудобство сложения — смешение в одном векторе
    и плохая экстраполяция за обученную длину; RoPE обходит это, внося позицию поворотом q и k внутри
    attention, а не прибавкой к входу.
  source: user-db
  source_ref: ["6f81d617f1"]
- id: iv-positional-03
  topic: positional-encoding
  tasks: [C03-rope, C-Q1-llama-quiz]
  difficulty: medium
  kind: code-reading
  question: >
    Опиши, как RoPE выглядит в коде модели: что предвычисляется, к каким тензорам и в каком месте forward
    он применяется (раскладка «половинами», как в HF Llama)?
  answer: >
    Один раз считаются частоты θ_i = base^(−2i/d) и для позиций — углы pos·θ_i, из них таблицы cos и sin формы
    [T, d] (каждая частота повторена для двух половин). В forward после проекций q и k (и разбиения на головы) их
    поворачивают: q' = q·cos + rotate_half(q)·sin, где rotate_half(x) = [−x₂, x₁] по половинам последней оси; так же
    k. Значения v не трогают. При генерации с KV-cache берутся cos/sin для абсолютных позиций новых токенов, а в
    кеш кладутся уже повёрнутые ключи.
  source: user-db
  source_ref: ["a2912025e2"]
- id: iv-attention-05
  topic: attention
  tasks: [C00-causal-mha]
  difficulty: medium
  kind: open
  question: "Откуда в классическом трансформере (и в BERT) жёсткий предел длины входа?"
  answer: >
    Две причины. Архитектурная: обучаемые абсолютные позиционные эмбеддинги — таблица фиксированного размера
    (у BERT 512 позиций); для позиции 513 вектора просто нет, и даже синусоидальные позиции за обученной длиной
    работают плохо. Вычислительная: матрица внимания [T, T] растёт квадратично по времени и памяти, поэтому
    длину при обучении ограничивают. Современные модели снимают первое ограничение относительными позициями
    (RoPE + масштабирование), второе — FlashAttention, SWA, sparse/linear attention.
  source: user-db
  source_ref: ["2f0acc3c2e"]
- id: iv-attention-06
  topic: attention
  tasks: [C00-causal-mha, C18-sparse-attention, C20-linear-attention, C-Q4-efficient-quiz]
  difficulty: easy
  kind: open
  question: "Какой формы матрица весов внимания и как время и память self-attention растут с длиной T?"
  answer: >
    На каждую голову и пример — матрица [T, T] (в батче [B, H, T, T]): по строке на запрос, по столбцу на ключ.
    Время — O(T²·d) на голову (QKᵀ и умножение на V), память под веса — O(T²). Удвоение длины в 4 раза
    увеличивает и то, и другое. FlashAttention убирает квадрат по памяти (не материализует матрицу), но не по
    времени; SWA, sparse и линейное внимание снижают и время.
  source: user-db
  source_ref: ["57ce1af605", "04745e9b5a", "3f00eed1b0"]
- id: iv-inference-01
  topic: inference
  tasks: [C00-causal-mha]
  difficulty: medium
  kind: open
  question: "Что такое FlashAttention и почему он быстрее обычной реализации, если формула та же?"
  answer: >
    Это точный (не приближённый) алгоритм attention, который учитывает иерархию памяти GPU. Обычная реализация
    пишет матрицу scores [T, T] в медленную HBM, читает для softmax, пишет веса, читает для умножения на V —
    упирается в пропускную способность памяти. FlashAttention режет Q, K, V на блоки, держит их в быстрой SRAM и
    считает softmax «онлайн» (с накоплением максимума и суммы), не сохраняя полную матрицу; в обратном проходе
    пересчитывает её по блокам. Меньше обращений к HBM → быстрее, и память O(T) вместо O(T²).
  source: user-db
  source_ref: ["33397b6d15", "2afe0662f5"]
- id: iv-inference-02
  topic: inference
  tasks: [C00-causal-mha]
  difficulty: medium
  kind: mcq
  question: "Что именно улучшает FlashAttention по сравнению с наивным attention?"
  options:
    - "Только асимптотику времени: O(T) вместо O(T²)"
    - "Только память, время не меняется"
    - "И память (не хранит матрицу [T, T]), и реальное время (меньше обмена с HBM), хотя число FLOPs остаётся O(T²)"
    - "Ничего, это приближённое attention ради качества"
  correct: 2
  answer: >
    Вычислений столько же (даже чуть больше из-за пересчёта в backward), асимптотика времени остаётся квадратичной.
    Но память под веса падает до линейной, а реальное время сокращается в разы, потому что узкое место — не
    арифметика, а чтение и запись в HBM.
  source: user-db
  source_ref: ["19223f66c2"]
- id: iv-kvcache-01
  topic: kv-cache
  tasks: [C05-kv-cache, C-Q1-llama-quiz]
  difficulty: easy
  kind: open
  question: "Что такое KV-cache, что именно в нём лежит и зачем он нужен при генерации?"
  answer: >
    При авторегрессионной генерации каждый новый токен должен видеть ключи и значения всех прошлых токенов. Без
    кеша их пришлось бы пересчитывать на каждом шаге для всего префикса. KV-cache хранит уже вычисленные K и V
    каждого слоя (в Llama — после RoPE) формы [B, H_kv, S, d]; на шаге считаются q, k, v только для нового
    токена, k и v дописываются в кеш, attention идёт по всему кешу. Цена — память 2·L·H_kv·d·S чисел на
    последовательность; её урезают GQA/MQA, MLA, SWA, квантизация кеша.
  source: user-db
  source_ref: ["9e26c22700", "7a47e839d4"]
- id: iv-kvcache-02
  topic: kv-cache
  tasks: [C05-kv-cache]
  difficulty: medium
  kind: open
  question: "Что такое PagedAttention (vLLM) и какую проблему с памятью KV-cache он решает?"
  answer: >
    Наивный сервер выделяет каждому запросу непрерывный буфер KV-cache на максимальную длину: большая часть
    памяти простаивает (внутренняя фрагментация), а разные длины запросов дают внешнюю фрагментацию. PagedAttention
    делит кеш на небольшие блоки фиксированного размера (страницы по N токенов) и держит для каждой
    последовательности таблицу блоков, как виртуальная память в ОС; ядро attention читает ключи по этой таблице.
    Память выделяется по мере роста, потери — максимум один неполный блок; общие префиксы (системный промпт,
    beam search) могут делить блоки. В итоге в той же памяти помещается больше одновременных запросов.
  source: user-db
  source_ref: ["62792bb05c", "2a645f8918"]
- id: iv-architecture-02
  topic: architecture
  tasks: [C00-causal-mha, C-Q1-llama-quiz]
  difficulty: easy
  kind: open
  question: "Чем декодер отличается от энкодера и какие виды внимания в каком из них стоят?"
  answer: >
    Энкодер (BERT) читает весь вход сразу: self-attention двунаправленный, каждый токен видит всех. Декодер (GPT,
    Llama) генерирует слева направо: self-attention с causal-маской, токен видит только себя и прошлое. В
    исходном encoder-decoder трансформере (перевод) у декодера ещё есть cross-attention: запросы из декодера, ключи
    и значения — из выхода энкодера. Современные LLM — decoder-only: только маскированный self-attention + FFN.
  source: user-db
  source_ref: ["d1eba489c7", "b3113f921d"]
- id: iv-architecture-03
  topic: attention
  tasks: [C00-causal-mha]
  difficulty: medium
  kind: open
  question: "При обучении декодера вся целевая последовательность известна. Зачем тогда causal-маска?"
  answer: >
    Обучение идёт параллельно: за один проход модель предсказывает следующий токен в каждой позиции (teacher
    forcing). Без маски позиция t видела бы токен t+1 — тот самый ответ, который надо предсказать, и выучила бы
    его просто копировать; лосс стал бы почти нулевым, а при генерации, где будущего нет, модель бы не работала.
    Маска делает каждую позицию эквивалентной шагу генерации и позволяет считать все T предсказаний за один
    проход.
  source: user-db
  source_ref: ["7a819ee009"]
