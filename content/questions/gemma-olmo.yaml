# Вопросы курса к модулю 2 (Gemma 3 / OLMo 2 / SmolLM3): SWA, размещение норм, QK-Norm, NoPE,
# KV-cache для SWA. Ответы написаны авторами курса. Квиз модуля C-Q2 собирает все вопросы файла.
- id: swa-window-01
  topic: attention
  tasks: [C07-swa, C07d-swa-debug]
  difficulty: easy
  kind: mcq
  question: "Окно SWA W = 4. Какие ключи видит запрос на позиции 10?"
  options:
    - "6, 7, 8, 9, 10"
    - "7, 8, 9, 10"
    - "7, 8, 9, 10, 11, 12, 13"
    - "только 6, 7, 8, 9 — себя токен не видит"
  correct: 1
  answer: >
    Окно из W позиций включает сам токен: разрешены расстояния 0..W−1, то есть ключи 7, 8, 9, 10.
    Вариант с пятью ключами — классическая ошибка на единицу (условие p − j ≤ W вместо < W); будущее
    (11+) запрещено causal-частью маски.
  source: course
- id: swa-cost-01
  topic: attention
  tasks: [C07-swa]
  difficulty: medium
  kind: open
  question: "Что экономит sliding window attention и чем за это платят?"
  answer: >
    Каждый запрос смотрит не на всю историю, а на последние W токенов: вычисления attention
    O(T·W) вместо O(T²), и в KV-cache слоя достаточно хранить W последних токенов — память не растёт
    с контекстом. Платят тем, что слой напрямую не видит дальше окна; дальние зависимости либо
    передаются через стек слоёв (L слоёв видят на L·(W−1) назад, но информация «сжимается» по пути),
    либо через отдельные глобальные слои с полным attention.
  source: course
- id: swa-receptive-field-01
  topic: attention
  tasks: [C07-swa]
  difficulty: medium
  kind: open
  question: >
    Модель из 32 слоёв, во всех слоях SWA с окном 4096 (как Mistral 7B). Может ли токен на
    позиции 20 000 зависеть от токена на позиции 0? Почему?
  answer: >
    Да. Каждый слой расширяет поле зрения на W − 1 позиций: выход слоя в позиции t уже несёт
    информацию о t − W + 1, и следующий слой смотрит на эти смешанные представления. 32 слоя
    достигают 32·4095 ≈ 131 тысячи позиций назад, так что формально токен 0 влияет на 20 000.
    Но влияние идёт через цепочку из ≥ 5 слоёв, и насколько хорошо модель им пользуется, — вопрос
    обучения: прямого attention к токену 0 нет.
  source: course
- id: local-global-pattern-01
  topic: attention
  tasks: [C07-swa]
  difficulty: medium
  kind: open
  question: "Как устроено чередование local и global слоёв в Gemma 2 и Gemma 3 и зачем его поменяли?"
  answer: >
    В Gemma 2 sliding и full слои чередуются 1:1, окно 4096. В Gemma 3 на каждые 5 sliding-слоёв
    приходится 1 full (каждый 6-й слой), окно уменьшено до 1024. Цель — KV-cache на длинном
    контексте: память sliding-слоя ограничена окном, и почти весь кеш занимают full-слои; чем их
    меньше, тем меньше память на 128K токенов. Авторы сообщают, что качество от такой пропорции
    почти не страдает, а глобальные слои оставляют модели доступ к дальнему контексту.
  source: course
- id: local-global-index-01
  topic: attention
  tasks: [C07-swa]
  difficulty: easy
  kind: mcq
  question: "У Gemma 3 sliding_window_pattern = 6, слои нумеруются с 0. Какие слои — full attention?"
  options:
    - "0, 6, 12, …"
    - "5, 11, 17, …"
    - "Последние 1/6 слоёв подряд"
    - "Случайные, выбираются при обучении"
  correct: 1
  answer: >
    Слой i — full, когда (i + 1) делится на 6: это последний слой каждой группы из шести, то есть
    5, 11, 17, … Слой 0 всегда sliding. Перепутать с i % 6 == 0 — частая ошибка при загрузке весов.
  source: course
- id: norm-placement-pre-post-01
  topic: normalization
  tasks: [C08-norm-placement]
  difficulty: medium
  kind: open
  question: "Чем Pre-Norm отличается от Post-Norm и почему почти все LLM после GPT-2 перешли на Pre-Norm?"
  answer: >
    В Post-Norm нормируется сумма x + f(x), то есть норма стоит на пути остаточного потока; в
    Pre-Norm нормируется только вход подслоя, а остаток проходит мимо: x + f(n(x)). У Pre-Norm есть
    «чистый» путь от выхода к входу, и анализ при инициализации (Xiong et al., 2020) показывает, что
    градиенты весов верхних слоёв убывают с глубиной примерно как 1/√L, тогда как у Post-Norm они
    остаются большими. Поэтому Post-Norm требует аккуратного warmup learning rate, а Pre-Norm
    обучается стабильнее и проще масштабируется по глубине. Минус Pre-Norm — остаток растёт по слоям
    и не нормирован.
  source: course
- id: norm-placement-olmo-01
  topic: normalization
  tasks: [C08-norm-placement]
  difficulty: medium
  kind: open
  question: "Где стоит нормализация в блоке OLMo 2 и чем это отличается от классического Post-Norm?"
  answer: >
    В OLMo 2 норма применяется к выходу подслоя перед сложением с остатком: x + n(f(x)); входной
    нормы нет. В классическом Post-Norm нормируется сумма n(x + f(x)), то есть сам остаточный поток.
    У OLMo 2 остаток идёт мимо нормы (как у Pre-Norm), блок с нулевыми подслоями — тождество, а вклад
    каждого подслоя ограничен по масштабу. Это одна из правок OLMo 2 ради стабильности обучения
    (вместе с QK-Norm).
  source: course
- id: norm-placement-sandwich-01
  topic: normalization
  tasks: [C08-norm-placement]
  difficulty: easy
  kind: mcq
  question: "Какая формула описывает подслой Gemma 3 (sandwich norm)?"
  options:
    - "x ← n(x + f(x))"
    - "x ← x + f(n(x))"
    - "x ← x + n₂(f(n₁(x)))"
    - "x ← n₂(x + f(n₁(x)))"
  correct: 2
  answer: >
    Gemma 2/3 ставят RMSNorm и на вход, и на выход подслоя, а остаток прибавляют мимо обеих норм:
    x + n₂(f(n₁(x))). В HF это input_layernorm → attention → post_attention_layernorm и
    pre_feedforward_layernorm → MLP → post_feedforward_layernorm.
  source: course
- id: norm-placement-growth-01
  topic: normalization
  tasks: [C08-norm-placement]
  difficulty: hard
  kind: open
  question: >
    В модели с нормой на выходе подслоя (OLMo 2, sandwich) как растёт RMS остаточного потока с
    глубиной при инициализации и почему?
  answer: >
    Каждый подслой прибавляет к остатку выход RMSNorm — вектор с RMS ≈ 1 (при единичных весах нормы),
    который в начале обучения почти ортогонален текущему остатку. Квадраты норм ортогональных
    векторов складываются, поэтому RMS² растёт на ≈ 1 за подслой: после L блоков (2L подслоёв)
    RMS ≈ √(1 + 2L). Рост предсказуемый и не зависит от масштаба весов подслоя — в отличие от
    Pre-Norm, где вклад подслоя ничем не ограничен.
  source: course
- id: qk-norm-why-01
  topic: attention
  tasks: [C09-qk-norm]
  difficulty: medium
  kind: open
  question: "Какую проблему решает QK-Norm и почему он помогает?"
  answer: >
    Рост логитов attention во время обучения: если нормы q и k растут, q·k/√D становится огромным,
    softmax вырождается почти в one-hot, градиенты через него исчезают или скачут, и обучение
    расходится (это наблюдали, например, при масштабировании ViT до 22B). QK-Norm нормирует q и k
    (RMSNorm) перед скалярным произведением: длина векторов фиксирована, логиты ограничены
    независимо от масштаба W_Q и W_K, а «температуру» задают только обучаемые веса нормы.
  source: course
- id: qk-norm-order-01
  topic: attention
  tasks: [C09-qk-norm, C09d-qk-norm-debug]
  difficulty: medium
  kind: open
  question: >
    QK-Norm ставят до RoPE. Почему при инициализации перестановка «RoPE → норма» ничего не меняет,
    а после обучения ломает модель?
  answer: >
    RoPE — поворот пар каналов (i, i + D/2): он сохраняет длину вектора, поэтому RMS не меняется.
    При инициализации веса RMSNorm единичные, и норма — это просто деление на RMS, которое с
    поворотом коммутирует. Обученные веса нормы разные по каналам, а умножение на диагональ с
    разными элементами в паре не коммутирует с поворотом этой пары. Веса нормы обучались на
    векторах до поворота, и в другом порядке они масштабируют уже перемешанные каналы.
  source: course
- id: qk-norm-variants-01
  topic: attention
  tasks: [C09-qk-norm]
  difficulty: medium
  kind: mcq
  question: "Чем QK-Norm в OLMo 2 отличается от QK-Norm в Gemma 3?"
  options:
    - "В OLMo 2 нормируется и v, в Gemma 3 — только q и k"
    - "В OLMo 2 RMSNorm по всей проекции H·D до разбиения на головы, в Gemma 3 — по каждой голове (размер head_dim)"
    - "В OLMo 2 норма после RoPE, в Gemma 3 — до"
    - "Ничем, это одна и та же операция"
  correct: 1
  answer: >
    OLMo 2: q_norm размера num_heads·head_dim применяется к выходу q_proj целиком (RMS по всем головам),
    k_norm — размера num_kv_heads·head_dim. Gemma 3 (и Qwen3): одна норма размера head_dim на каждую
    голову после разбиения. В обоих случаях норма стоит до RoPE, v не нормируется.
  source: course
- id: qk-norm-softcap-01
  topic: attention
  tasks: [C09-qk-norm]
  difficulty: hard
  kind: open
  question: "Gemma 2 ограничивала логиты attention soft-capping'ом, Gemma 3 — QK-Norm. В чём разница подходов?"
  answer: >
    Soft-capping применяется к уже посчитанному логиту: c·tanh(logit/c) (у Gemma 2 c = 50) — плавно
    срезает большие значения, но q и k по-прежнему могут расти, а tanh в насыщении даёт малые
    градиенты; к тому же это нестандартная операция внутри attention, которую не поддерживают
    многие быстрые ядра (FlashAttention и т. п. без доработки). QK-Norm ограничивает сами q и k до
    скалярного произведения, после чего attention — обычный softmax(q·kᵀ/√D) и совместим со
    стандартными ядрами.
  source: course
- id: nope-how-position-01
  topic: positional-encoding
  tasks: [C10-nope]
  difficulty: hard
  kind: open
  question: "Как декодер без позиционного кодирования (NoPE) может узнать позицию токена?"
  answer: >
    Через causal-маску. Запрос на позиции t видит ровно t + 1 ключей, поэтому результат softmax
    зависит от t: например, если первый токен отличается от остальных, его вес в смеси убывает
    примерно как 1/t, и по выходу слоя можно восстановить позицию. Kazemnejad et al. (2023)
    показали, что первый слой декодера может так восстановить абсолютную позицию, а следующие —
    реализовать и относительное внимание. В энкодере без маски этого механизма нет: там без
    позиционного кодирования модель полностью инвариантна к перестановкам.
  source: course
- id: nope-bag-of-words-01
  topic: positional-encoding
  tasks: [C10-nope]
  difficulty: medium
  kind: mcq
  question: >
    Один NoPE-слой с causal-маской. Если переставить токены 0..T−2, что произойдёт с выходом
    последнего токена (позиция T−1)?
  options:
    - "Не изменится"
    - "Изменится, потому что маска зависит от позиций"
    - "Станет нулевым"
    - "Изменится только при чётном T"
  correct: 0
  answer: >
    Последний запрос видит все предыдущие ключи, и взвешенная сумма softmax от их порядка не
    зависит — для него NoPE-слой работает как «мешок слов». У промежуточных позиций выход меняется
    (они видят другие префиксы), поэтому стек слоёв порядок всё же различает, но слабее, чем с RoPE.
  source: course
- id: nope-schedule-01
  topic: positional-encoding
  tasks: [C10-nope, C10d-nope-debug]
  difficulty: easy
  kind: open
  question: "Как устроены NoPE-слои в SmolLM3 и зачем они там?"
  answer: >
    В SmolLM3-3B из 36 слоёв каждый четвёртый (индексы 3, 7, …, 35) не применяет RoPE, остальные —
    обычный RoPE с θ = 5·10⁶. Авторы ссылаются на работу о гибриде RoPE/NoPE (Yang et al., 2025) и
    сообщают, что в абляциях это улучшило работу с длинным контекстом без потерь на коротком:
    NoPE-слоям не нужно экстраполировать незнакомые углы поворота на длинах больше обучающих.
    В config.json это список no_rope_layers, где 1 означает «RoPE есть».
  source: course
