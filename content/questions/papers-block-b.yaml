# Вопросы к статьям блока B (энкодеры). Модуль 1: Sutskever et al. 2014, Bahdanau et al. 2014, Vaswani et al. 2017
# (энкодер-декодер, регуляризация). Ответы написаны авторами курса.
- id: paper-seq2seq-bottleneck-01
  topic: architecture
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какое «бутылочное горлышко» было у seq2seq на RNN (Sutskever et al., 2014) и как его обходили в самой статье?"
  answer: >
    Энкодер-LSTM сжимает всё предложение в один вектор состояния фиксированного размера, и декодер разворачивает
    перевод только из него. Чем длиннее фраза, тем больше теряется. Авторы заметили, что подача исходного
    предложения в обратном порядке заметно улучшает качество: первые слова источника оказываются ближе к первым
    словам перевода, и зависимости становятся короче. Это обход, а не решение: вектор всё равно один.
  source: course
- id: paper-bahdanau-attention-01
  topic: attention
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Что предложили Bahdanau et al. (2014) и чем их attention отличается от scaled dot-product attention Transformer?"
  answer: >
    Декодер на каждом шаге строит свой вектор контекста — взвешенную сумму состояний энкодера по всем позициям,
    веса — softmax от оценок «насколько позиция источника подходит текущему шагу». Это убрало бутылочное горлышко
    одного вектора и дало выравнивание слов как побочный продукт. Оценка у них аддитивная: маленькая сеть
    vᵀ tanh(W s + U h). В Transformer — скалярное произведение q·k/√d: быстрее (матричное умножение) и при правильном
    масштабе не хуже. И главное: у Bahdanau attention — добавка к RNN, а в Transformer рекуррентности нет вовсе.
  source: course
- id: paper-aiayn-three-attentions-01
  topic: attention
  tasks: [B-P1-seq2seq-attention]
  difficulty: easy
  kind: open
  question: "Какие три применения multi-head attention описывает §3.2.3 статьи Transformer?"
  answer: >
    Cross-attention «энкодер-декодер»: запросы из предыдущего слоя декодера, ключи и значения — из выхода энкодера,
    каждая позиция декодера видит весь источник. Self-attention энкодера: Q, K, V из предыдущего слоя энкодера, каждая
    позиция видит все. Self-attention декодера: то же, но позиция видит только себя и прошлое — запрещённые связи
    получают −∞ до softmax. В задачах B01, B03 и B04 это три маски: padding, causal + padding, padding источника.
  source: course
- id: paper-aiayn-regularization-01
  topic: training
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какие два способа регуляризации использует Transformer (§5.4) и какой из них ухудшает перплексию?"
  answer: >
    Residual dropout: dropout на выходе каждого подслоя перед сложением с остатком и на сумме эмбеддингов и позиций
    (P = 0.1 у базовой модели). И label smoothing с ε = 0.1: он делает модель менее уверенной и потому ухудшает
    перплексию, но улучшает точность и BLEU. В курсе dropout выключен (детерминированные тесты), label smoothing
    реализован в B05.
  source: course
- id: paper-aiayn-shared-embeddings-01
  topic: embeddings
  tasks: [B-P1-seq2seq-attention]
  difficulty: medium
  kind: open
  question: "Какие матрицы весов Transformer делит между собой (§3.4) и что для этого нужно от токенизации?"
  answer: >
    Одна матрица служит эмбеддингом входа энкодера, эмбеддингом входа декодера и (транспонированной) матрицей
    выходного слоя перед softmax; в слоях эмбеддингов её умножают на √d_model. Чтобы источник и цель могли делить
    одну таблицу, у них должен быть общий словарь: для англо-немецкого перевода — общий BPE примерно на 37 тысяч
    токенов. Так экономятся параметры, а одинаковые подслова (имена, числа) в двух языках получают одно
    представление.
  source: course
# Модуль 2: BERT (Devlin et al. 2018), RoBERTa (Liu et al. 2019).
- id: paper-bert-pretraining-01
  topic: training
  tasks: [B-P2-bert-roberta]
  difficulty: medium
  kind: open
  question: "Какие две задачи предобучения были у BERT и на каких данных его учили?"
  answer: >
    Masked LM (15 % токенов, схема 80/10/10) и Next Sentence Prediction: для пары сегментов предсказать, идёт ли B
    сразу за A в тексте (50 % — настоящая следующая часть, 50 % — случайная из корпуса); NSP решается по pooled-выходу
    [CLS]. Данные — BooksCorpus (около 800 млн слов) и английская Википедия (около 2.5 млрд слов, только текст статей).
    Важно брать документы целиком, а не перемешанные предложения, чтобы были длинные связные последовательности.
  source: course
- id: paper-bert-sizes-01
  topic: architecture
  tasks: [B-P2-bert-roberta]
  difficulty: easy
  kind: open
  question: "Чем отличаются BERT-base и BERT-large и почему base имеет размер GPT-1?"
  answer: >
    BERT-base: 12 слоёв, hidden 768, 12 голов, ~110 М параметров. BERT-large: 24 слоя, hidden 1024, 16 голов, ~340 М.
    Размер base выбран равным OpenAI GPT, чтобы честно сравнить двунаправленный энкодер с однонаправленным декодером при
    том же числе параметров. На всех задачах GLUE large лучше base, даже на маленьких датасетах.
  source: course
- id: paper-bert-ablation-01
  topic: training
  tasks: [B-P2-bert-roberta]
  difficulty: medium
  kind: open
  question: "Что показали абляции статьи BERT про NSP и направленность модели (раздел 5.1)?"
  answer: >
    Без NSP качество падало на задачах с парами (QNLI, MNLI, SQuAD). Модель «слева направо» без NSP была заметно хуже
    на всех задачах, особенно на SQuAD, где важен правый контекст; добавление BiLSTM сверху помогало частично. Вывод
    авторов: главное — глубокая двунаправленность через MLM. Позже RoBERTa показала, что выигрыш от NSP связан с
    форматом входа, а сама задача не нужна.
  source: course
- id: paper-roberta-changes-01
  topic: training
  tasks: [B-P2-bert-roberta]
  difficulty: medium
  kind: open
  question: "Что изменила RoBERTa по сравнению с BERT, не трогая архитектуру?"
  answer: >
    Убрала NSP и подаёт полные последовательности из подряд идущих предложений (до 512 токенов); маска выбирается
    динамически; батчи больше (8 тысяч последовательностей); данных в ~10 раз больше (160 ГБ: книги, Википедия,
    новости CC-News, OpenWebText, Stories); обучение дольше; словарь — byte-level BPE на 50 тысяч, как у GPT-2. Вывод
    статьи: BERT был сильно недообучен, и рецепт обучения важен не меньше архитектуры.
  source: course
- id: paper-roberta-nsp-01
  topic: training
  tasks: [B-P2-bert-roberta]
  difficulty: hard
  kind: open
  question: "Почему RoBERTa отказалась от NSP, хотя абляции BERT говорили, что NSP помогает?"
  answer: >
    В абляции BERT без NSP менялся и формат входа: модель обучали на парах коротких сегментов. RoBERTa развела эти
    эффекты: сравнила пары сегментов с NSP, пары предложений с NSP, полные последовательности без NSP (FULL-SENTENCES)
    и куски одного документа без NSP (DOC-SENTENCES). Варианты без NSP на длинных последовательностях оказались не хуже
    или лучше. Значит, пользу давали длинные связные входы, а сама задача NSP слишком лёгкая (часто решается по теме) и
    не нужна.
  source: course
